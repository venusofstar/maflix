<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IMDb VidAPI Movie App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0f0f0f;
  color:#fff;
}

header{
  background:#111;
  padding:15px;
  position:sticky;
  top:0;
  z-index:999;
  border-bottom:1px solid #222;
}

.logo{
  font-size:28px;
  font-weight:700;
  color:#f5c518;
  text-align:center;
}

.search-box{
  margin-top:15px;
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  padding:14px;
  border:none;
  outline:none;
  border-radius:10px;
  background:#1c1c1c;
  color:#fff;
  font-size:16px;
}

.search-box button{
  background:#f5c518;
  border:none;
  padding:14px 20px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:18px;
}

.card{
  background:#181818;
  border-radius:14px;
  overflow:hidden;
  transition:.3s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.03);
}

.poster{
  width:100%;
  height:260px;
  object-fit:cover;
}

.info{
  padding:12px;
}

.title{
  font-size:15px;
  font-weight:600;
  line-height:1.4;
  height:42px;
  overflow:hidden;
}

.year{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

.player-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.player-box{
  width:100%;
  max-width:1100px;
  position:relative;
}

.close-btn{
  position:absolute;
  right:0;
  top:-50px;
  background:red;
  color:#fff;
  border:none;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

iframe{
  width:100%;
  aspect-ratio:16/9;
  border:none;
  border-radius:15px;
  background:#000;
}

.loading{
  text-align:center;
  padding:50px;
  color:#aaa;
}

@media(max-width:700px){
  .poster{
    height:230px;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo">IMDb VidAPI</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movie or series...">
    <button onclick="searchMovies()">Search</button>
  </div>
</header>

<div class="container">
  <div class="grid" id="movieGrid"></div>
</div>

<div class="player-modal" id="playerModal">
  <div class="player-box">
    <button class="close-btn" onclick="closePlayer()">✕</button>
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>
</div>

<script>
const API_KEY = "YOUR_OMDB_API_KEY";

const grid = document.getElementById("movieGrid");

async function searchMovies(query="Avengers"){

  grid.innerHTML = `<div class="loading">Loading...</div>`;

  const search = query || document.getElementById("searchInput").value;

  try{

    const res = await fetch(
      `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(search)}`
    );

    const data = await res.json();

    grid.innerHTML = "";

    if(!data.Search){
      grid.innerHTML = `<div class="loading">No results found.</div>`;
      return;
    }

    data.Search.forEach(movie => {

      const poster = movie.Poster !== "N/A"
        ? movie.Poster
        : "https://via.placeholder.com/300x450?text=No+Image";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img class="poster" src="${poster}">
        <div class="info">
          <div class="title">${movie.Title}</div>
          <div class="year">${movie.Year}</div>
        </div>
      `;

      card.onclick = () => {
        openPlayer(movie.imdbID);
      };

      grid.appendChild(card);

    });

  }catch(e){
    grid.innerHTML = `<div class="loading">Failed to load movies.</div>`;
  }
}

function openPlayer(imdbID){

  const modal = document.getElementById("playerModal");
  const frame = document.getElementById("videoFrame");

  /*
    VidAPI Embed
    Replace with your own provider if needed
  */

  frame.src = `https://vidsrc.xyz/embed/movie/${imdbID}`;

  modal.style.display = "flex";
}

function closePlayer(){
  document.getElementById("playerModal").style.display = "none";
  document.getElementById("videoFrame").src = "";
}

document.getElementById("searchInput")
.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    searchMovies();
  }
});

searchMovies();
</script>

</body>
</html>
