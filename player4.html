<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0"><title>HONOR TV Player</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.player-container{
    width:100%;
    height:100%;
    position:relative;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    z-index:5;
}

.loading.hidden{
    display:none;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #333;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
    z-index:10;
}

.error button{
    border:0;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}
</style></head><body><div class="player-container"><div class="loading" id="loading">
    <div class="spinner"></div>
</div>

<video
    id="video"
    controls
    autoplay
    playsinline
    preload="auto">
</video>

<div class="error" id="error">
    <div id="errorText">
        Unable to load video.
    </div>
    <button onclick="location.reload()">Retry</button>
</div>

</div><script>

const video = document.getElementById("video");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const errorText = document.getElementById("errorText");

/*
    Example:

    player.html?url=https://vidmody.com/vs/tt32820897/
*/

const params = new URLSearchParams(window.location.search);
const sourcePage = params.get("url");

if (!sourcePage) {

    showError("Missing video URL.");

} else {

    loadVideo(sourcePage);
}


async function loadVideo(pageURL){

    try {

        loading.classList.remove("hidden");

        /*
            Ask your server-side resolver for the actual
            HLS URL.

            Example endpoint:

            /api/resolve?url=...
        */

        const resolver =
            "/api/resolve?url=" +
            encodeURIComponent(pageURL);

        const response = await fetch(resolver);

        if (!response.ok) {
            throw new Error(
                "Resolver returned HTTP " + response.status
            );
        }

        const data = await response.json();

        if (!data.url) {
            throw new Error("No playable stream was returned.");
        }

        playStream(data.url);

    } catch (error) {

        console.error(error);

        showError(
            "Unable to resolve video stream."
        );
    }
}


function playStream(source){

    if (Hls.isSupported()) {

        const hls = new Hls({

            enableWorker:true,

            lowLatencyMode:true,

            backBufferLength:90,

            maxBufferLength:30,

            maxMaxBufferLength:60,

            capLevelToPlayerSize:true

        });

        hls.loadSource(source);

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loading.classList.add("hidden");

                video.play().catch(function(){});

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                console.error(
                    "HLS error:",
                    data
                );

                if (
                    data.fatal &&
                    data.type === Hls.ErrorTypes.NETWORK_ERROR
                ){

                    hls.startLoad();

                }

                else if (
                    data.fatal &&
                    data.type === Hls.ErrorTypes.MEDIA_ERROR
                ){

                    hls.recoverMediaError();

                }

                else if(data.fatal){

                    showError(
                        "Playback error."
                    );

                }

            }
        );

    }

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = source;

        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.classList.add("hidden");

                video.play().catch(function(){});

            }
        );

    }

    else {

        showError(
            "HLS playback is not supported."
        );

    }
}


function showError(message){

    loading.classList.add("hidden");

    errorText.textContent = message;

    errorBox.style.display = "flex";
}

</script></body>
</html>
