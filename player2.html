<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONOR TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.player-container{
    width:100%;
    height:100%;
    position:relative;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}
</style>
</head>
<body>

<div class="player-container">
    <video id="video" controls autoplay playsinline></video>
</div>

<script>
const video = document.getElementById("video");

const source =
"https://long-moon-7155.honortv-stream.workers.dev/?url=https://vidmody.com/mm/tt0133093/mainx/index-v1-a2.gif";

if (Hls.isSupported()) {
    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90
    });

    hls.loadSource(source);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(()=>{});
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = source;
}
</script>

</body>
</html>
