<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spider-Man: Brand New Day — Movie Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background: #050505;
  color: #fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* TITLE */

.title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 15px;
}

/* PLAYER */

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 35px rgba(0,0,0,.45);
}

video {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  object-fit: contain;
}

/* SERVER TITLE */

.server-title {
  margin-top: 20px;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 600;
  color: #ccc;
}

/* SERVERS */

.servers {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.server-btn {
  border: 1px solid #333;
  background: #151515;
  color: #fff;
  padding: 13px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition:
    background .2s,
    color .2s,
    border-color .2s,
    transform .15s;
}

.server-btn:hover {
  background: #242424;
  border-color: #555;
}

.server-btn:active {
  transform: scale(.97);
}

.server-btn.active {
  background: #fff;
  color: #000;
  border-color: #fff;
}

/* STATUS */

.status {
  margin-top: 12px;
  padding: 11px 13px;
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  color: #aaa;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 800px) {

  .servers {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 500px) {

  .container {
    padding: 10px;
  }

  .title {
    font-size: 19px;
  }

  .servers {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .server-btn {
    padding: 12px 8px;
    font-size: 13px;
  }

}
</style>
</head>

<body>

<div class="container">

  <!-- MOVIE TITLE -->

  <div class="title">
    Spider-Man: Brand New Day (2026)
  </div>


  <!-- VIDEO PLAYER -->

  <div class="player">

    <video
      id="video"
      controls
      playsinline
      preload="metadata">
    </video>

  </div>


  <!-- SERVER TITLE -->

  <div class="server-title">
    Select Server
  </div>


  <!-- SERVER BUTTONS -->

  <div class="servers">

    <button
      class="server-btn active"
      onclick="playServer(0)">
      Server 1
    </button>

    <button
      class="server-btn"
      onclick="playServer(1)">
      Server 2
    </button>

    <button
      class="server-btn"
      onclick="playServer(2)">
      Server 3 — HLS
    </button>

    <button
      class="server-btn"
      onclick="playServer(3)">
      Server 4
    </button>

    <button
      class="server-btn"
      onclick="playServer(4)">
      Server 5
    </button>

  </div>


  <!-- STATUS -->

  <div
    class="status"
    id="status">
    Loading Server 1...
  </div>

</div>


<script>

/* =========================================================
   SERVER LIST
========================================================= */

const servers = [

  {
    name: "Server 1",
    url: "https://ia601805.us.archive.org/3/items/spider-man.-brand.-new.-day.-2026/Spider-Man.Brand.New.Day.2026.mp4",
    type: "video/mp4"
  },

  {
    name: "Server 2",
    url: "https://ia800908.us.archive.org/28/items/ca-lum-spiderman-brand-new-day-full-movie-upload-a-uh-opd/Ca_lum_-_Spiderman_Brand_New_day_Full_movie_upload_aUhOpd.mp4",
    type: "video/mp4"
  },

  {
    name: "Server 3",
    url: "https://streamings.honor-tv.42web.io/spidemanbrandnewday2026/vod.m3u8",
    type: "application/x-mpegURL"
  },

  {
    name: "Server 4",
    url: "https://movies.honor-tv.42web.io/video/spider-man-brandnew-2026-s2",
    type: "video/mp4"
  },

  {
    name: "Server 5",
    url: "https://movies.honor-tv.42web.io/video/spiderman-brandnew-2026",
    type: "video/mp4"
  }

];


/* =========================================================
   PLAYER
========================================================= */

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const buttons = document.querySelectorAll(".server-btn");

let hls = null;
let currentServer = 0;


/* =========================================================
   DESTROY HLS
========================================================= */

function destroyHLS() {

  if (hls) {

    try {
      hls.destroy();
    } catch (e) {
      console.error(e);
    }

    hls = null;
  }

}


/* =========================================================
   UPDATE BUTTONS
========================================================= */

function updateButtons(index) {

  buttons.forEach((button, i) => {

    button.classList.toggle(
      "active",
      i === index
    );

  });

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

  statusText.textContent = message;

}


/* =========================================================
   PLAY SERVER
========================================================= */

function playServer(index) {

  if (!servers[index]) {
    return;
  }

  currentServer = index;

  const server = servers[index];

  updateButtons(index);

  destroyHLS();

  video.pause();

  video.removeAttribute("src");

  video.load();

  setStatus(
    "Connecting to " + server.name + "..."
  );


  /* =======================================================
     MP4
  ======================================================= */

  if (server.type === "video/mp4") {

    video.src = server.url;

    video.load();

    video.play()
      .then(() => {

        setStatus(
          server.name + " — Playing"
        );

      })
      .catch(() => {

        setStatus(
          server.name + " — Ready. Press Play."
        );

      });

    return;
  }


  /* =======================================================
     HLS
  ======================================================= */

  if (server.type === "application/x-mpegURL") {


    /* Native HLS */

    if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = server.url;

      video.load();

      video.play()
        .then(() => {

          setStatus(
            server.name + " — Playing"
          );

        })
        .catch(() => {

          setStatus(
            server.name + " — Ready. Press Play."
          );

        });

      return;
    }


    /* HLS.js */

    if (
      typeof Hls !== "undefined" &&
      Hls.isSupported()
    ) {

      hls = new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 90,

        maxBufferLength: 30,

        maxMaxBufferLength: 60

      });


      hls.loadSource(server.url);

      hls.attachMedia(video);


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          setStatus(
            server.name + " — Playing"
          );

          video.play()
            .catch(() => {

              setStatus(
                server.name +
                " — Ready. Press Play."
              );

            });

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.error(
            "HLS Error:",
            data
          );

          if (data.fatal) {

            setStatus(
              server.name +
              " — Stream error"
            );

          }

        }
      );


      return;
    }


    setStatus(
      "This browser does not support HLS."
    );

  }

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "loadstart",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Loading..."
    );

  }
);


video.addEventListener(
  "loadedmetadata",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Ready"
    );

  }
);


video.addEventListener(
  "waiting",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Buffering..."
    );

  }
);


video.addEventListener(
  "canplay",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Ready"
    );

  }
);


video.addEventListener(
  "playing",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Playing"
    );

  }
);


video.addEventListener(
  "pause",
  function () {

    if (
      !video.ended &&
      video.currentTime > 0
    ) {

      setStatus(
        servers[currentServer].name +
        " — Paused"
      );

    }

  }
);


video.addEventListener(
  "ended",
  function () {

    setStatus(
      "Movie ended."
    );

  }
);


video.addEventListener(
  "error",
  function () {

    setStatus(
      servers[currentServer].name +
      " — Unable to play. Try another server."
    );

  }
);


/* =========================================================
   START SERVER 1
========================================================= */

playServer(0);

</script>

</body>
</html>
