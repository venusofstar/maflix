<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Spider-Man: Brand New Day — Movie Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 15px;
}

.player {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

.server-title {
  margin-top: 18px;
  margin-bottom: 10px;
  font-size: 16px;
  color: #bbb;
}

.servers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.server-btn {
  border: 1px solid #333;
  background: #151515;
  color: #fff;
  padding: 14px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: .2s;
}

.server-btn:hover {
  background: #222;
}

.server-btn.active {
  background: #fff;
  color: #000;
  border-color: #fff;
}

.status {
  margin-top: 12px;
  padding: 10px;
  background: #111;
  border-radius: 7px;
  color: #aaa;
  font-size: 13px;
}

@media(max-width:600px) {
  .container {
    padding: 10px;
  }

  .title {
    font-size: 19px;
  }

  .servers {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="title">
    Spider-Man: Brand New Day (2026)
  </div>

  <div class="player">
    <video
      id="video"
      controls
      playsinline
      preload="metadata">
    </video>
  </div>

  <div class="server-title">
    Select Server
  </div>

  <div class="servers">

    <button
      class="server-btn active"
      onclick="playServer(0)">
      Server 1
    </button>

    <button
      class="server-btn"
      onclick="playServer(1)">
      Server 2
    </button>

    <button
      class="server-btn"
      onclick="playServer(2)">
      Server 3 — HLS
    </button>

  </div>

  <div class="status" id="status">
    Loading Server 1...
  </div>

</div>

<script>

const servers = [

  {
    name: "Server 1",
    url: "https://ia601805.us.archive.org/3/items/spider-man.-brand.-new.-day.-2026/Spider-Man.Brand.New.Day.2026.mp4",
    type: "video/mp4"
  },

  {
    name: "Server 2",
    url: "https://ia800908.us.archive.org/28/items/ca-lum-spiderman-brand-new-day-full-movie-upload-a-uh-opd/Ca_lum_-_Spiderman_Brand_New_day_Full_movie_upload_aUhOpd.mp4",
    type: "video/mp4"
  },

  {
    name: "Server 3",
    url: "https://streamings.honor-tv.42web.io/spidemanbrandnewday2026/vod.m3u8",
    type: "application/x-mpegURL"
  }

];

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const buttons = document.querySelectorAll(".server-btn");

let hls = null;

function destroyHLS() {

  if (hls) {
    hls.destroy();
    hls = null;
  }

}

function playServer(index) {

  const server = servers[index];

  destroyHLS();

  buttons.forEach((button, i) => {
    button.classList.toggle("active", i === index);
  });

  statusText.textContent =
    "Connecting to " + server.name + "...";

  video.pause();
  video.removeAttribute("src");
  video.load();

  /*
   * MP4
   */
  if (server.type === "video/mp4") {

    video.src = server.url;

    video.load();

    video.play()
      .then(() => {
        statusText.textContent =
          server.name + " — Playing";
      })
      .catch(() => {
        statusText.textContent =
          server.name + " — Ready. Press Play.";
      });

    return;
  }

  /*
   * HLS
   */
  if (server.type === "application/x-mpegURL") {

    if (video.canPlayType("application/vnd.apple.mpegurl")) {

      // Safari / native HLS
      video.src = server.url;
      video.load();

      video.play()
        .then(() => {
          statusText.textContent =
            server.name + " — Playing";
        })
        .catch(() => {
          statusText.textContent =
            server.name + " — Ready. Press Play.";
        });

    } else if (Hls.isSupported()) {

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false
      });

      hls.loadSource(server.url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function() {

        statusText.textContent =
          server.name + " — Playing";

        video.play().catch(() => {
          statusText.textContent =
            server.name + " — Ready. Press Play.";
        });

      });

      hls.on(Hls.Events.ERROR, function(event, data) {

        console.error("HLS Error:", data);

        if (data.fatal) {

          statusText.textContent =
            server.name + " — Stream error";

        }

      });

    } else {

      statusText.textContent =
        "This browser does not support HLS.";

    }

  }

}

/*
 * Video events
 */

video.addEventListener("waiting", () => {
  statusText.textContent = "Buffering...";
});

video.addEventListener("playing", () => {

  const active =
    document.querySelector(".server-btn.active");

  if (active) {
    statusText.textContent =
      active.textContent.trim() + " — Playing";
  }

});

video.addEventListener("ended", () => {
  statusText.textContent = "Movie ended.";
});

video.addEventListener("error", () => {

  statusText.textContent =
    "Unable to play this server. Try another server.";

});

/*
 * Start Server 1
 */

playServer(0);

</script>

</body>
</html>
