<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>No Ads Iframe Player</title><style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Arial, sans-serif;
  height:100vh;
  overflow:hidden;
}

.player-container{
  position:relative;
  width:100%;
  height:100vh;
  background:#000;
}

iframe{
  width:100%;
  height:100%;
  border:none;
  background:#000;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:12px;
  background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  z-index:10;
  display:flex;
  gap:10px;
  align-items:center;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  outline:none;
  background:#111;
  color:#fff;
  font-size:15px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#e50914;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.loading{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#fff;
  z-index:5;
  font-size:18px;
}

@media(max-width:768px){
  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  button{
    width:100%;
  }
}
</style></head>
<body><div class="player-container">  <div class="topbar">
    <input type="text" id="videoUrl" placeholder="Enter iframe or embed URL here...">
    <button onclick="loadVideo()">Play</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
  </div>  <div class="loading" id="loading">Ready to Play</div>  <iframe
    id="player"
    allowfullscreen
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="no-referrer">
  </iframe></div><script>
const iframe = document.getElementById('player');
const loading = document.getElementById('loading');
const input = document.getElementById('videoUrl');

function loadVideo(){
  let url = input.value.trim();

  if(!url){
    alert('Enter iframe URL');
    return;
  }

  loading.style.display = 'block';
  loading.innerText = 'Loading Video...';

  iframe.src = url;

  iframe.onload = () => {
    loading.style.display = 'none';
  };
}

function toggleFullscreen(){
  const elem = document.querySelector('.player-container');

  if(!document.fullscreenElement){
    elem.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// Auto load from URL parameter
const params = new URLSearchParams(window.location.search);
const iframeUrl = params.get('url');

if(iframeUrl){
  input.value = iframeUrl;
  iframe.src = iframeUrl;
  loading.style.display = 'none';
} else {
  // Example default iframe link
  input.value = 'https://example.com/embed/video';
}
</script></body>
</html>
