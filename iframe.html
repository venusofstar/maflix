<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Untouchable Iframe</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#frame{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;

  /* Completely untouchable */
  pointer-events:none;

  /* Prevent focus */
  outline:none;
  user-select:none;
  -webkit-user-select:none;
}
</style>
</head>

<body>

<iframe
  id="frame"
  title="Untouchable Iframe"
  allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
  allowfullscreen
  tabindex="-1"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>

<script>
const params = new URLSearchParams(location.search);
const target = params.get("url");

if(target){
  try{
    const url = new URL(target);

    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){
      document.getElementById("frame").src = url.href;
    }
  }catch(e){
    console.error("Invalid URL");
  }
}
</script>

</body>
</html>
