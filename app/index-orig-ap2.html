<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFLIX</title>

<meta name="theme-color" content="#e50914">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

html{
  scroll-behavior:smooth;
}

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#e50914;
  border-radius:20px;
}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:9998;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}

#overlay.active{
  opacity:1;
  visibility:visible;
}

#sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100vh;
  background:#111;
  z-index:9999;
  padding:20px;
  transition:.3s;
  overflow-y:auto;
}

#sidebar.active{
  left:0;
}

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

#sidebarHeader h2{
  color:#e50914;
  font-size:30px;
}

#closeMenu{
  background:none;
  border:none;
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.sidebarLinks{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sidebarLinks a{
  padding:14px;
  border-radius:12px;
  background:#1a1a1a;
}

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(12px);
}

#leftNav{
  display:flex;
  align-items:center;
  gap:12px;
}

#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:#e50914;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

#appTitle{
  color:#e50914;
  font-size:30px;
}

#searchBox{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  justify-content:flex-end;
}

#movieSearchInput{
  width:100%;
  max-width:420px;
  height:48px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  padding:0 15px;
  outline:none;
}

#searchBtn{
  height:48px;
  padding:0 18px;
  border:none;
  border-radius:12px;
  background:#e50914;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

#hero{
  min-height:80vh;
  background:
  linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.3)),
  url('https://i.imgur.com/w4NFeXx.png') center/cover no-repeat;
  display:flex;
  align-items:center;
  padding:130px 25px 40px;
}

.heroContent h1{
  font-size:60px;
  margin-bottom:15px;
}

.heroContent p{
  color:#ddd;
  margin-bottom:25px;
}

#content{
  padding:20px;
}

.section{
  margin-bottom:50px;
}

.sectionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.sectionHeader h2{
  font-size:28px;
}

.sliderButtons{
  display:flex;
  gap:10px;
}

.slideBtn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#1d1d1d;
  color:#fff;
  cursor:pointer;
}

.row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-behavior:smooth;
}

.row::-webkit-scrollbar{
  display:none;
}

.card{
  min-width:190px;
  width:190px;
  height:285px;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:#181818;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:scale(1.04);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card p{
  position:absolute;
  bottom:0;
  width:100%;
  padding:14px;
  background:linear-gradient(to top,rgba(0,0,0,.95),transparent);
}

#playerModal{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

#videoFrame{
  width:95vw;
  height:88vh;
  border:none;
  border-radius:14px;
}

#closePlayer{
  position:absolute;
  top:15px;
  right:15px;
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#e50914;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.serverButtons{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
}

.serverButtons button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

.server1{
  background:#e50914;
}

.server2{
  background:#222;
}

#episodeControls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  display:none;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:rgba(0,0,0,.75);
  padding:12px;
  border-radius:16px;
}

#episodeControls button{
  border:none;
  background:#e50914;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.loading{
  padding:20px;
  color:#aaa;
}

@media(max-width:650px){

  .card{
    min-width:135px;
    width:135px;
    height:205px;
  }

  #videoFrame{
    width:100%;
    height:100%;
    border-radius:0;
  }

  #episodeControls{
    width:95%;
    justify-content:center;
  }
}
</style>
</head>
<body>

<div id="overlay"></div>

<div id="sidebar">

  <div id="sidebarHeader">
    <h2>MAFLIX</h2>
    <button id="closeMenu">✕</button>
  </div>

  <div class="sidebarLinks">
    <a href="#">🏠 Home</a>
    <a href="#">🎌 Anime</a>
    <a href="#">📺 Series</a>
    <a href="#">⚽ Sports</a>
  </div>

</div>

<div id="navbar">

  <div id="leftNav">
    <button id="menuBtn">☰</button>
    <h1 id="appTitle">MAFLIX</h1>
  </div>

  <div id="searchBox">
    <input type="text" id="movieSearchInput" placeholder="Search movies...">
    <button id="searchBtn">Search</button>
  </div>

</div>

<section id="hero">
  <div class="heroContent">
    <h1>Unlimited Movies & Anime</h1>
    <p>Watch trending movies and TV series instantly.</p>
  </div>
</section>

<div id="content">

  <div class="section">
    <div class="sectionHeader">
      <h2>🔥 Search Movies</h2>
      <div class="sliderButtons">
        <button class="slideBtn" onclick="scrollRow('searchGrid',-1)">❮</button>
        <button class="slideBtn" onclick="scrollRow('searchGrid',1)">❯</button>
      </div>
    </div>
    <div class="row" id="searchGrid"></div>
  </div>

  <div class="section">
    <div class="sectionHeader">
      <h2>🎌 Anime</h2>
      <div class="sliderButtons">
        <button class="slideBtn" onclick="scrollRow('animeGrid',-1)">❮</button>
        <button class="slideBtn" onclick="scrollRow('animeGrid',1)">❯</button>
      </div>
    </div>
    <div class="row" id="animeGrid"></div>
  </div>

  <div class="section">
    <div class="sectionHeader">
      <h2>📺 TV Series</h2>
      <div class="sliderButtons">
        <button class="slideBtn" onclick="scrollRow('seriesGrid',-1)">❮</button>
        <button class="slideBtn" onclick="scrollRow('seriesGrid',1)">❯</button>
      </div>
    </div>
    <div class="row" id="seriesGrid"></div>
  </div>

</div>

<div id="playerModal">

  <div class="serverButtons">
    <button class="server1" id="server1Btn">Server 1</button>
    <button class="server2" id="server2Btn">Server 2</button>
  </div>

  <div id="episodeControls">
    <button onclick="prevSeason()">◀ Season</button>
    <span id="seasonText">Season 1</span>
    <button onclick="nextSeason()">Season ▶</button>

    <button onclick="prevEpisode()">◀ Episode</button>
    <span id="episodeText">Episode 1</span>
    <button onclick="nextEpisode()">Episode ▶</button>
  </div>

  <iframe id="videoFrame" allowfullscreen allow="autoplay; fullscreen"></iframe>

  <button id="closePlayer">✕</button>

</div>

<script>

const API_KEY = "90521a18";

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

menuBtn.onclick = () => {
  sidebar.classList.add("active");
  overlay.classList.add("active");
};

function closeSidebar(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

closeMenu.onclick = closeSidebar;
overlay.onclick = closeSidebar;

function scrollRow(rowId,direction){

  document.getElementById(rowId).scrollBy({
    left:direction * 600,
    behavior:"smooth"
  });
}

let currentMovieID = "";
let currentSeason = 1;
let currentEpisode = 1;
let isSeriesMode = false;

function playMovie(imdbID,type="movie"){

  currentMovieID = imdbID;

  isSeriesMode = type === "series";

  document.getElementById("episodeControls")
  .style.display = isSeriesMode ? "flex" : "none";

  if(isSeriesMode){

    currentSeason = 1;
    currentEpisode = 1;

    loadEpisode();

  }else{

    document.getElementById("videoFrame").src =
    `https://playimdb.com/title/${imdbID}`;
  }

  playerModal.style.display = "flex";
}

function loadEpisode(){

  videoFrame.src =
  `https://vidsrc.to/embed/tv/${currentMovieID}/${currentSeason}/${currentEpisode}`;

  seasonText.innerText = `Season ${currentSeason}`;

  episodeText.innerText = `Episode ${currentEpisode}`;
}

function nextEpisode(){
  currentEpisode++;
  loadEpisode();
}

function prevEpisode(){
  if(currentEpisode > 1){
    currentEpisode--;
    loadEpisode();
  }
}

function nextSeason(){
  currentSeason++;
  currentEpisode = 1;
  loadEpisode();
}

function prevSeason(){
  if(currentSeason > 1){
    currentSeason--;
    currentEpisode = 1;
    loadEpisode();
  }
}

closePlayer.onclick = () => {

  playerModal.style.display = "none";
  videoFrame.src = "";
};

server1Btn.onclick = () => {

  if(isSeriesMode){

    videoFrame.src =
    `https://vidsrc.to/embed/tv/${currentMovieID}/${currentSeason}/${currentEpisode}`;

  }else{

    videoFrame.src =
    `https://playimdb.com/title/${currentMovieID}`;
  }
};

server2Btn.onclick = () => {

  if(isSeriesMode){

    videoFrame.src =
    `https://vidsrc.to/embed/tv/${currentMovieID}/${currentSeason}/${currentEpisode}`;

  }else{

    videoFrame.src =
    `https://vidsrc.to/embed/movie/${currentMovieID}`;
  }
};

function createMovieCard(movie){

  const card = document.createElement("div");

  card.className = "card";

  const poster =
  movie.Poster !== "N/A"
  ? movie.Poster
  : "https://via.placeholder.com/300x450";

  card.innerHTML = `
    <img src="${poster}">
    <p>${movie.Title}</p>
  `;

  card.onclick = () => {

    const isSeries = movie.Type === "series";

    playMovie(movie.imdbID,isSeries ? "series" : "movie");
  };

  return card;
}

async function loadCategoryMovies(query,id){

  const grid = document.getElementById(id);

  grid.innerHTML = `<div class="loading">Loading...</div>`;

  try{

    const res = await fetch(
      `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(query)}`
    );

    const data = await res.json();

    grid.innerHTML = "";

    if(!data.Search){

      grid.innerHTML = `<div class="loading">No movies found</div>`;

      return;
    }

    data.Search.forEach(movie => {
      grid.appendChild(createMovieCard(movie));
    });

  }catch(err){

    grid.innerHTML = `<div class="loading">Failed to load movies</div>`;
  }
}

function searchMovies(){

  const query = movieSearchInput.value.trim() || "Marvel";

  loadCategoryMovies(query,"searchGrid");
}

searchBtn.onclick = searchMovies;

movieSearchInput.addEventListener("keypress",e => {
  if(e.key === "Enter"){
    searchMovies();
  }
});

window.onload = () => {

  loadCategoryMovies("Marvel","searchGrid");

  loadCategoryMovies("Anime","animeGrid");

  loadCategoryMovies("Series","seriesGrid");
};

</script>
</body>
</html>
