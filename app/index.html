<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MAFLIX</title>

  <meta name="theme-color" content="#e50914" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styl.css" />

  <!-- SAFE MONETAG ADS -->
  <script
    async
    data-cfasync="false"
    src="https://quge5.com/88/tag.min.js"
    data-zone="243456">
  </script>

  <!-- BASIC SECURITY -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src * data: blob: 'unsafe-inline' 'unsafe-eval';
      frame-src * data: blob:;
      script-src * 'unsafe-inline' 'unsafe-eval';
      style-src * 'unsafe-inline';
      img-src * data: blob:;
      connect-src *;
    "
  />

</head>

<body>

  <div id="overlay"></div>

  <!-- SIDEBAR -->

  <div id="sidebar">

    <div id="sidebarHeader">
      <h2>MAFLIX</h2>
      <button id="closeMenu">✕</button>
    </div>

    <div class="sidebarLinks">

      <a href="index.html">🏠 Home</a>

      <a href="anime/index.html">🎌 Anime Tagalog Dubbed</a>

      <a href="drama-tagalod-dudbed/index.html">
        🎭 Tagalog Dubbed Drama
      </a>

      <a href="tv-channel/index.html">📺 TV Channels</a>

      <a href="sports-event/index.html">⚽ Sports Event</a>

      <a href="vivamax/index.html">🎬 Viva Max</a>

    </div>

  </div>

  <!-- NAVBAR -->

  <div id="navbar">

    <div id="leftNav">

      <button id="menuBtn">☰</button>

      <h1 id="appTitle">MAFLIX</h1>

    </div>

    <div id="searchBox">

      <input
        type="text"
        id="movieSearchInput"
        placeholder="Search movies..."
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

  </div>

  <!-- HERO -->

  <section id="hero">

    <div class="heroContent">

      <h1>Unlimited Movies & Series</h1>

      <p>
        Watch trending movies, anime and TV series instantly on MAFLIX.
      </p>

      <div class="heroButtons">

        <button class="playBtn">
          ▶ Watch Now
        </button>

        <button class="infoBtn">
          More Info
        </button>

      </div>

    </div>

  </section>

  <!-- SAFE AD CONTAINER -->
  <div class="ad-container">
    <script>
      if (window.innerWidth > 768) {
        document.write(`
          <div style="margin:15px auto;text-align:center;">
            <script async data-cfasync="false"
              src="https://quge5.com/88/tag.min.js"
              data-zone="243456">
            <\/script>
          </div>
        `);
      }
    </script>
  </div>

  <!-- CONTENT -->

  <div id="content">

    <!-- CONTINUE WATCHING -->

    <div
      class="section"
      id="continueSection"
      style="display:none;"
    >

      <div class="sectionHeader">

        <h2>▶ Continue Watching</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('continueGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('continueGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="continueGrid"></div>

    </div>

    <!-- SEARCH MOVIES -->

    <div class="section">

      <div class="sectionHeader">

        <h2>🔥 Search Movies</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('searchGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('searchGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="searchGrid"></div>

    </div>

    <!-- NEW MOVIES -->

    <div class="section">

      <div class="sectionHeader">

        <h2>🆕 New Movies</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('newMoviesGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('newMoviesGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="newMoviesGrid"></div>

    </div>

    <!-- ACTION -->

    <div class="section">

      <div class="sectionHeader">

        <h2>💥 Action</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('actionGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('actionGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="actionGrid"></div>

    </div>

    <!-- COMEDY -->

    <div class="section">

      <div class="sectionHeader">

        <h2>😂 Comedy</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('comedyGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('comedyGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="comedyGrid"></div>

    </div>

    <!-- SERIES -->

    <div class="section">

      <div class="sectionHeader">

        <h2>📺 TV Series</h2>

        <div class="sliderButtons">

          <button
            class="slideBtn"
            onclick="scrollRow('seriesGrid',-1)"
          >
            ❮
          </button>

          <button
            class="slideBtn"
            onclick="scrollRow('seriesGrid',1)"
          >
            ❯
          </button>

        </div>

      </div>

      <div class="row" id="seriesGrid"></div>

    </div>

  </div>

  <!-- PLAYER -->

  <div id="playerModal">

    <div class="serverButtons">

      <button class="server1" id="server1Btn">
        Server 1
      </button>

      <button class="server2" id="server2Btn">
        Server 2
      </button>

    </div>

    <iframe
      id="videoFrame"
      allowfullscreen
      allow="autoplay; fullscreen"
      sandbox="allow-scripts allow-same-origin allow-presentation"
      referrerpolicy="origin"
    ></iframe>

    <button id="closePlayer">
      ✕
    </button>

  </div>

  <!-- SAFE SCRIPT LOAD -->
  <script src="scrpt.js" defer></script>

</body>
</html>
