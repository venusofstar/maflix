<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFLIX</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
</head>

<body>

<h1 id="appTitle">MAFLIX</h1>

<div id="searchContainer">
  <input type="text" id="searchInput" placeholder="Search channels...">
</div>

<div id="channelSections"></div>

<div id="videoContainer">
  <div id="spinner"></div>
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
  <button id="closeBtn">✕</button>
</div>

<script>
(async function () {

  let allowWebView = false;

  try {
    const r = await fetch("/app-check", { cache:"no-store" });
    const j = await r.json();
    allowWebView = j.ok === true;
  } catch(e){}

  function isWebView() {
    const ua = navigator.userAgent.toLowerCase();
    return ua.includes("wv") || (ua.includes("android") && ua.includes("version/");
  }

  function devtoolsOpened() {
    const t = performance.now();
    debugger;
    return performance.now() - t > 120;
  }

  if (isWebView() && !allowWebView) {
    block("Unsupported player environment");
    return;
  }

  if (devtoolsOpened()) {
    block("Debug tools detected");
    return;
  }

  function block(msg){
    document.documentElement.innerHTML =
      `<body style="margin:0;background:#000;color:#fff;
      display:flex;align-items:center;justify-content:center;
      font-family:Arial;text-align:center">
      <div>
        <h3>Access blocked</h3>
        <p>${msg}</p>
      </div></body>`;
  }

})();
</script>
  
<script src="script.js"></script>

  
</body>
</html>
