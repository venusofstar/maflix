<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MAFLIX</title>

<meta
name="theme-color"
content="#e50914">

<meta
name="description"
content="Watch movies, anime, sports and live TV with MAFLIX streaming platform.">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  touch-action:pan-y;
}

/* ================= TV / TOUCH ================= */

button,
a,
input,
.card-item{
  outline:none;
  -webkit-tap-highlight-color:transparent;
}

button:focus,
a:focus,
input:focus,
.card-item:focus{
  outline:3px solid #fff;
  outline-offset:2px;
}

/* ================= NAVBAR ================= */

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  padding:15px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    transparent
  );
  backdrop-filter:blur(10px);
}

#leftNav{
  display:flex;
  align-items:center;
  gap:15px;
}

#menuBtn{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  transition:.2s;
}

#menuBtn:hover,
#menuBtn:focus{
  background:#e50914;
  transform:scale(1.05);
}

#appTitle{
  color:#e50914;
  font-size:32px;
  font-weight:bold;
  letter-spacing:1px;
}

/* ================= SEARCH ================= */

#searchBox{
  display:flex;
  align-items:center;
  background:#1b1b1b;
  border-radius:30px;
  overflow:hidden;
}

#searchInput{
  width:220px;
  padding:10px 15px;
  border:none;
  background:transparent;
  color:#fff;
  font-size:15px;
}

#searchBtn{
  width:50px;
  height:42px;
  border:none;
  background:#e50914;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  background:#111;
  z-index:5000;
  padding:20px;
  transition:.3s;
  display:flex;
  flex-direction:column;
  gap:15px;
}

#sidebar.active{
  left:0;
}

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

#sidebarHeader h2{
  color:#e50914;
}

#closeMenu{
  width:40px;
  height:40px;
  border:none;
  border-radius:8px;
  background:#1b1b1b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

#sidebar a{
  color:#fff;
  text-decoration:none;
  padding:14px;
  border-radius:10px;
  background:#1a1a1a;
  transition:.2s;
}

#sidebar a:hover,
#sidebar a:focus{
  background:#e50914;
}

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:4000;
  display:none;
}

#menuOverlay.active{
  display:block;
}

/* ================= HERO ================= */

#hero{
  position:relative;
  width:100%;
  height:85vh;
  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.9),
    rgba(0,0,0,.2)
  ),
  url(
'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop'
  )
  center/cover no-repeat;
  display:flex;
  align-items:center;
  padding:80px;
}

.heroContent{
  max-width:500px;
}

.heroContent h2{
  font-size:60px;
  margin-bottom:15px;
}

.heroContent p{
  color:#ddd;
  line-height:1.6;
  margin-bottom:25px;
}

.heroButtons{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.heroButtons button{
  padding:12px 28px;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.heroButtons button:hover,
.heroButtons button:focus{
  transform:scale(1.05);
}

.playBtn{
  background:#fff;
  color:#000;
}

.infoBtn{
  background:rgba(109,109,110,.7);
  color:#fff;
}

/* ================= CHANNELS ================= */

#channelSections{
  padding:20px;
}

.category-wrapper{
  position:relative;
  margin-bottom:40px;
}

.category-wrapper h2{
  margin:20px 0 15px;
  font-size:24px;
}

/* ================= SLIDER ================= */

.horizontal-scroll{
  display:flex;
  gap:15px;
  overflow-x:hidden;
  scroll-behavior:smooth;
  padding-inline:55px;
  padding-bottom:10px;
}

.horizontal-scroll::-webkit-scrollbar{
  display:none;
}

/* ================= CARD ================= */

.card-item{
  min-width:220px;
  width:220px;
  height:320px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  background:#181818;
  transition:.25s;
  flex-shrink:0;
}

.card-item:hover,
.card-item:focus{
  transform:scale(1.08);
}

.card-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-item p{
  position:absolute;
  bottom:0;
  width:100%;
  padding:15px;
  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.95),
    transparent
  );
  font-size:18px;
  font-weight:bold;
}

/* ================= SLIDE BUTTON ================= */

.slideBtn{
  position:absolute;
  top:55%;
  transform:translateY(-50%);
  width:55px;
  height:95px;
  border:none;
  border-radius:14px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:34px;
  cursor:pointer;
  z-index:10;
  backdrop-filter:blur(8px);
}

.slideBtn:hover,
.slideBtn:focus{
  background:#e50914;
}

.slideLeft{
  left:0;
}

.slideRight{
  right:0;
}

/* ================= PLAYER ================= */

#videoContainer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#videoPlayer,
#ytFrame{
  width:90%;
  height:85%;
  border:none;
  border-radius:10px;
  background:#000;
}

#closeBtn{
  position:absolute;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#e50914;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

#spinner{
  border:5px solid rgba(255,255,255,.2);
  border-top:5px solid #e50914;
  border-radius:50%;
  width:50px;
  height:50px;
  animation:spin 1s linear infinite;
  position:absolute;
  display:none;
}

@keyframes spin{

  100%{
    transform:rotate(360deg);
  }

}

/* ================= MOBILE ================= */

@media(max-width:768px){

  #hero{
    height:70vh;
    padding:30px;
  }

  .heroContent h2{
    font-size:38px;
  }

  .card-item{
    min-width:160px;
    width:160px;
    height:240px;
  }

  #searchInput{
    width:140px;
  }

  .slideBtn{
    width:42px;
    height:70px;
    font-size:24px;
  }

}

/* ================= SMART TV ================= */

@media(min-width:1200px){

  .card-item{
    min-width:260px;
    width:260px;
    height:380px;
  }

  .slideBtn{
    width:70px;
    height:130px;
    font-size:42px;
  }

  #searchInput{
    width:320px;
    height:60px;
    font-size:20px;
  }

  #searchBtn,
  #menuBtn,
  #closeMenu{
    width:60px;
    height:60px;
    font-size:28px;
  }

  #appTitle{
    font-size:42px;
  }

}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div id="navbar">

  <div id="leftNav">

    <button id="menuBtn">☰</button>

    <h1 id="appTitle">MAFLIX</h1>

  </div>

  <div id="searchBox">

    <input
      type="text"
      id="searchInput"
      placeholder="Search channels...">

    <button id="searchBtn">🔍</button>

  </div>

</div>

<!-- ================= SIDEBAR ================= -->

<div id="sidebar">

  <div id="sidebarHeader">

    <h2>MAFLIX</h2>

    <button id="closeMenu">✕</button>

  </div>

  <a href="index.html">🏠 Home</a>

  <a href="anime/index.html">🎌 Anime</a>

  <a href="drama-tagalod-dudbed/index.html">
    🎭 Tagalog Dubbed Drama
  </a>

  <a href="tv-channel.html">📺 TV Channels</a>

  <a href="sports-event.html">⚽ Sports Event</a>

</div>

<div id="menuOverlay"></div>

<!-- ================= HERO ================= -->

<section id="hero">

  <div class="heroContent">

    <h2>Trending Now</h2>

    <p>
      Watch movies, anime, sports and live TV
      with MAFLIX streaming platform.
    </p>

    <div class="heroButtons">

      <button class="playBtn">
        ▶ Watch
      </button>

      <button class="infoBtn">
        More Info
      </button>

    </div>

  </div>

</section>

<!-- ================= CHANNELS ================= -->

<div id="channelSections"></div>

<!-- ================= PLAYER ================= -->

<div id="videoContainer">

  <div id="spinner"></div>

  <video
    id="videoPlayer"
    controls
    autoplay
    playsinline>
  </video>

  <iframe
    id="ytFrame"
    allow="autoplay; fullscreen"
    allowfullscreen
    style="display:none">
  </iframe>

  <button id="closeBtn">✕</button>

</div>

<script>

/* ================= MENU ================= */

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.getElementById("sidebar");

const closeMenu =
document.getElementById("closeMenu");

const menuOverlay =
document.getElementById("menuOverlay");

menuBtn.onclick = ()=>{

  sidebar.classList.add("active");

  menuOverlay.classList.add("active");

};

function closeSidebar(){

  sidebar.classList.remove("active");

  menuOverlay.classList.remove("active");

}

closeMenu.onclick =
closeSidebar;

menuOverlay.onclick =
closeSidebar;

/* ================= CHANNEL SYSTEM ================= */

let staticChannels = [];

let shakaPlayer = null;

/* ================= PARSE M3U ================= */

function parseM3U(content){

  const lines =
  content.split("\n");

  const channels = [];

  let current = null;

  for(let i = 0; i < lines.length; i++){

    const line =
    lines[i].trim();

    if(line.startsWith("#EXTINF")){

      const nameMatch =
      line.match(/,(.*)$/);

      const logoMatch =
      line.match(/tvg-logo="(.*?)"/);

      const groupMatch =
      line.match(/group-title="(.*?)"/);

      current = {

        name:
        nameMatch ?
        nameMatch[1] :
        "Unknown",

        logo:
        logoMatch ?
        logoMatch[1] :
        "https://via.placeholder.com/300x450",

        category:
        groupMatch ?
        groupMatch[1] :
        "Live TV",

        manifestUri:"",

        type:"iframe"

      };

    }

    else if(
      line &&
      !line.startsWith("#") &&
      current
    ){

      current.manifestUri =
      line;

      if(
        line.includes("youtube.com") ||
        line.includes("youtu.be")
      ){

        current.type =
        "youtube";

      }

      else if(
        line.includes(".m3u8")
      ){

        current.type =
        "hls";

      }

      else if(
        line.includes(".mpd")
      ){

        current.type =
        "dash";

      }

      else if(
        line.includes(".mp4")
      ){

        current.type =
        "mp4";

      }

      else{

        current.type =
        "iframe";

      }

      channels.push(current);

      current = null;

    }

  }

  return channels;

}

/* ================= FETCH ================= */

async function fetchChannels(){

  try{

    let allChannels = [];

    /* channels.json */

    try{

      const res1 =
      await fetch("channels.json");

      const data1 =
      await res1.json();

      if(data1.channels){

        allChannels.push(
          ...data1.channels
        );

      }

    }catch(e){

      console.log(
        "channels.json missing"
      );

    }

    /* channels2.json */

    try{

      const res2 =
      await fetch("channels2.json");

      const text2 =
      await res2.text();

      const parsed =
      parseM3U(text2);

      allChannels.push(
        ...parsed
      );

    }catch(e){

      console.log(
        "channels2.json missing"
      );

    }

    staticChannels =
    allChannels;

    render(staticChannels);

  }

  catch(err){

    console.error(err);

  }

}

/* ================= GROUP ================= */

function groupChannels(list){

  return list.reduce((g,c)=>{

    (g[c.category] ||= [])
    .push(c);

    return g;

  },{});

}

/* ================= RENDER ================= */

function render(channelsList){

  const container =
  document.getElementById(
    "channelSections"
  );

  container.innerHTML = "";

  const grouped =
  groupChannels(channelsList);

  Object.entries(grouped)
  .forEach(([cat,channels],index)=>{

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "category-wrapper";

    wrapper.innerHTML = `
      <h2>${cat}</h2>

      <button
        class="slideBtn slideLeft"
        onclick="slideRow('row${index}',-1)">
        ❮
      </button>

      <div
        class="horizontal-scroll"
        id="row${index}">
      </div>

      <button
        class="slideBtn slideRight"
        onclick="slideRow('row${index}',1)">
        ❯
      </button>
    `;

    container.appendChild(wrapper);

    const row =
    wrapper.querySelector(
      ".horizontal-scroll"
    );

    channels.forEach(ch=>{

      const card =
      document.createElement("div");

      card.className =
      "card-item";

      card.tabIndex = 0;

      card.innerHTML = `
        <img
          loading="lazy"
          decoding="async"
          src="${ch.logo}">

        <p>${ch.name}</p>
      `;

      card.onclick =
      ()=> playChannel(ch);

      row.appendChild(card);

    });

  });

}

/* ================= SLIDE ================= */

function slideRow(rowId,direction){

  const row =
  document.getElementById(rowId);

  const card =
  row.querySelector(".card-item");

  if(!card) return;

  const amount =
  card.offsetWidth * 3;

  row.scrollBy({

    left:
    direction * amount,

    behavior:"smooth"

  });

}

/* ================= TV REMOTE ================= */

document.addEventListener(
  "keydown",
  e=>{

    const active =
    document.activeElement;

    if(
      e.key === "Enter" &&
      active
    ){

      if(
        active.tagName === "BUTTON" ||
        active.tagName === "A" ||
        active.classList.contains(
          "card-item"
        )
      ){

        active.click();

      }

    }

  }
);

/* ================= PLAY CHANNEL ================= */

async function playChannel(ch){

  const v =
  document.getElementById(
    "videoPlayer"
  );

  const yt =
  document.getElementById(
    "ytFrame"
  );

  const c =
  document.getElementById(
    "videoContainer"
  );

  const spinner =
  document.getElementById(
    "spinner"
  );

  c.style.display =
  "flex";

  spinner.style.display =
  "block";

  v.pause();

  v.removeAttribute("src");

  v.load();

  yt.src = "";

  yt.style.display =
  "none";

  v.style.display =
  "none";

  /* ================= YOUTUBE ================= */

  if(ch.type === "youtube"){

    yt.style.display =
    "block";

    yt.src =
    `https://www.youtube.com/embed/${
      ch.manifestUri.split("v=")[1]
    }?autoplay=1`;

    spinner.style.display =
    "none";

    return;

  }

  /* ================= IFRAME ================= */

  if(ch.type === "iframe"){

    yt.style.display =
    "block";

    yt.src =
    ch.manifestUri;

    spinner.style.display =
    "none";

    return;

  }

  /* ================= MP4 ================= */

  if(ch.type === "mp4"){

    if(shakaPlayer){

      await shakaPlayer.destroy();

      shakaPlayer = null;

    }

    v.style.display =
    "block";

    v.src =
    ch.manifestUri;

    v.onloadeddata = ()=>{

      spinner.style.display =
      "none";

    };

    v.play();

    return;

  }

  /* ================= HLS / DASH ================= */

  v.style.display =
  "block";

  shakaPlayer ??=
  new shaka.Player(v);

  await shakaPlayer.unload();

  if(ch.clearKey){

    shakaPlayer.configure({

      drm:{

        clearKeys:
        ch.clearKey

      }

    });

  }

  try{

    await shakaPlayer.load(
      ch.manifestUri
    );

    spinner.style.display =
    "none";

    v.play();

  }

  catch(e){

    console.error(e);

    spinner.style.display =
    "none";

    alert("Playback Error");

  }

}

/* ================= CLOSE PLAYER ================= */

document.getElementById(
  "closeBtn"
).onclick = ()=>{

  const v =
  document.getElementById(
    "videoPlayer"
  );

  const yt =
  document.getElementById(
    "ytFrame"
  );

  document.getElementById(
    "videoContainer"
  ).style.display = "none";

  v.pause();

  v.removeAttribute("src");

  v.load();

  yt.src = "";

};

/* ================= SEARCH ================= */

const searchInput =
document.getElementById(
  "searchInput"
);

function searchChannels(){

  const value =
  searchInput.value
  .toLowerCase();

  const filtered =
  staticChannels.filter(ch=>

    ch.name
    .toLowerCase()
    .includes(value)

    ||

    ch.category
    .toLowerCase()
    .includes(value)

  );

  render(filtered);

}

searchInput.addEventListener(
  "input",
  searchChannels
);

document.getElementById(
  "searchBtn"
).onclick =
searchChannels;

/* ================= INIT ================= */

window.onload =
fetchChannels;

</script>

</body>
</html>
