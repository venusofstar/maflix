<!DOCTYPE html>
<html lang="tl">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>MAFLIX | Tagalog Dubbed Drama</title>

<meta
name="description"
content="Watch Tagalog Dubbed Drama Series on MAFLIX">

<meta
name="theme-color"
content="#e50914">

<link rel="preconnect" href="https://i.imgur.com">

<style>

:root{
  --bg:#0b0b0b;
  --card:#181818;
  --soft:#1b1b1b;
  --red:#e50914;
  --text:#fff;
}

/* RESET */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-thumb{
  background:var(--red);
  border-radius:20px;
}

::-webkit-scrollbar-track{
  background:#111;
}

/* NAVBAR */

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:9999;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.96),
    rgba(0,0,0,.65),
    transparent
  );
  backdrop-filter:blur(12px);
}

#leftNav{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:var(--soft);
  color:#fff;
  font-size:24px;
  cursor:pointer;
  flex-shrink:0;
}

#appTitle{
  font-size:clamp(24px,4vw,38px);
  font-weight:900;
  color:var(--red);
  letter-spacing:1px;
  white-space:nowrap;
}

/* SEARCH */

#searchBox{
  display:flex;
  align-items:center;
  background:var(--soft);
  border-radius:50px;
  overflow:hidden;
  flex-shrink:0;
}

#searchInput{
  width:220px;
  height:46px;
  padding:0 16px;
  border:none;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:15px;
}

#searchInput::placeholder{
  color:#aaa;
}

#searchBtn{
  width:54px;
  height:46px;
  border:none;
  background:var(--red);
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

/* SIDEBAR */

#sidebar{
  position:fixed;
  top:0;
  left:-320px;
  width:280px;
  max-width:90%;
  height:100dvh;
  background:#101010;
  z-index:99999;
  padding:20px 16px;
  transition:.35s ease;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--red) #111;
}

/* SCROLL UP DOWN MENU */

#sidebar::-webkit-scrollbar{
  width:6px;
}

#sidebar::-webkit-scrollbar-thumb{
  background:var(--red);
  border-radius:20px;
}

#sidebar.active{
  left:0;
}

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  position:sticky;
  top:0;
  background:#101010;
  padding-bottom:12px;
  z-index:2;
}

#sidebarHeader h2{
  color:var(--red);
  font-size:28px;
}

#closeMenu{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

#sidebar nav{
  display:flex;
  flex-direction:column;
  gap:12px;
}

#sidebar a{
  color:#fff;
  text-decoration:none;
  padding:16px;
  border-radius:14px;
  background:#1a1a1a;
  transition:.25s;
  font-size:16px;
  font-weight:600;
}

#sidebar a:hover,
#sidebar a:focus{
  background:var(--red);
  transform:translateX(4px);
}

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:9990;
  opacity:0;
  visibility:hidden;
  transition:.25s;
}

#menuOverlay.active{
  opacity:1;
  visibility:visible;
}

/* HERO */

#hero{
  position:relative;
  width:100%;
  min-height:78vh;
  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.96),
    rgba(0,0,0,.25)
  ),
  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop')
  center/cover no-repeat;
  display:flex;
  align-items:center;
  padding:
  clamp(110px,12vw,140px)
  clamp(22px,6vw,90px)
  60px;
}

.heroContent{
  max-width:720px;
}

.heroBadge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--red);
  padding:10px 16px;
  border-radius:999px;
  margin-bottom:20px;
  font-size:14px;
  font-weight:700;
}

.heroContent h1{
  font-size:clamp(38px,7vw,76px);
  line-height:1.05;
  margin-bottom:22px;
  font-weight:900;
}

.heroContent p{
  color:#ddd;
  line-height:1.8;
  margin-bottom:28px;
  font-size:clamp(15px,2vw,19px);
  max-width:620px;
}

.heroButtons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.heroButtons button{
  min-height:52px;
  padding:14px 28px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.playBtn{
  background:#fff;
  color:#000;
}

.infoBtn{
  background:rgba(255,255,255,.18);
  color:#fff;
  backdrop-filter:blur(6px);
}

/* SECTION TITLE */

.dramaHeader{
  font-size:clamp(24px,4vw,38px);
  font-weight:900;
  padding:32px 22px 10px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */

.card{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background:var(--card);
  transition:
  transform .25s ease,
  box-shadow .25s ease;
  aspect-ratio:2/3;
}

.card:hover{
  transform:scale(1.04);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cardOverlay{
  position:absolute;
  inset:0;
  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.96),
    transparent 60%
  );
}

.title{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:14px;
  font-size:15px;
  font-weight:700;
  line-height:1.45;
}

/* FOOTER */

footer{
  text-align:center;
  padding:35px 20px;
  color:#888;
  font-size:14px;
}

/* SCROLL BUTTONS */

.scrollBtn{
  position:fixed;
  right:16px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:rgba(229,9,20,.92);
  color:#fff;
  font-size:20px;
  cursor:pointer;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
  transition:.25s;
}

.scrollBtn:hover{
  transform:scale(1.08);
}

#scrollTop{
  bottom:82px;
}

#scrollBottom{
  bottom:22px;
}

/* TABLET */

@media(max-width:1024px){

  .grid{
    grid-template-columns:
    repeat(auto-fill,minmax(160px,1fr));
  }

}

/* MOBILE */

@media(max-width:768px){

  #navbar{
    padding:12px 14px;
    gap:10px;
  }

  #searchInput{
    width:120px;
    font-size:14px;
  }

  #searchBtn{
    width:48px;
  }

  #hero{
    min-height:68vh;
    padding:
    110px 20px 40px;
  }

  .grid{
    grid-template-columns:
    repeat(2,minmax(0,1fr));
    gap:14px;
    padding:14px;
  }

  .title{
    font-size:13px;
    padding:10px;
  }

  .heroButtons{
    width:100%;
  }

  .heroButtons button{
    flex:1;
  }

}

/* SMART TV / LARGE SCREEN */

@media(min-width:1600px){

  body{
    font-size:20px;
  }

  #navbar{
    padding:22px 40px;
  }

  #menuBtn{
    width:60px;
    height:60px;
    font-size:28px;
  }

  #searchInput{
    width:320px;
    height:58px;
    font-size:18px;
  }

  #searchBtn{
    width:70px;
    height:58px;
    font-size:22px;
  }

  .grid{
    grid-template-columns:
    repeat(auto-fill,minmax(260px,1fr));
    gap:28px;
    padding:28px 40px;
  }

  .title{
    font-size:18px;
    padding:18px;
  }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div id="navbar">

  <div id="leftNav">

    <button id="menuBtn">☰</button>

    <h1 id="appTitle">MAFLIX</h1>

  </div>

  <div id="searchBox">

    <input
    type="text"
    id="searchInput"
    placeholder="Search drama...">

    <button id="searchBtn">🔍</button>

  </div>

</div>

<!-- SIDEBAR -->

<div id="sidebar">

  <div id="sidebarHeader">

    <h2>MAFLIX</h2>

    <button id="closeMenu">✕</button>

  </div>

  <nav>

    <a href="../index.html">🏠 Home</a>

    <a href="../anime/index.html">🎌 Anime</a>

    <a href="index.html">🎭 Tagalog Dubbed Drama</a>

    <a href="../tv-channel.html">📺 TV Channels</a>

    <a href="../sports-event.html">⚽ Sports Event</a>

  </nav>

</div>

<div id="menuOverlay"></div>

<!-- HERO -->

<section id="hero">

  <div class="heroContent">

    <div class="heroBadge">
      🔥 Trending Drama
    </div>

    <h1>
      Tagalog Dubbed<br>
      Drama Series
    </h1>

    <p>
      Watch your favorite Korean,
      Chinese and Asian drama series
      dubbed in Tagalog only on MAFLIX.
    </p>

    <div class="heroButtons">

      <button class="playBtn">
        ▶ Watch Now
      </button>

      <button class="infoBtn">
        More Info
      </button>

    </div>

  </div>

</section>

<!-- DRAMA SECTION -->

<header class="dramaHeader">
🎬 Drama Series Tagalog Dubbed
</header>

<div class="grid" id="dramaGrid">

  <!-- YOUR CARDS HERE -->

</div>

<!-- FOOTER -->

<footer>
© 2026 MAFLIX - Tagalog Dubbed Drama
</footer>

<!-- SCROLL BUTTONS -->

<button
id="scrollTop"
class="scrollBtn">↑</button>

<button
id="scrollBottom"
class="scrollBtn">↓</button>

<script>

/* MENU */

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.getElementById("sidebar");

const closeMenu =
document.getElementById("closeMenu");

const menuOverlay =
document.getElementById("menuOverlay");

menuBtn.addEventListener("click", ()=>{

  sidebar.classList.add("active");
  menuOverlay.classList.add("active");

  document.body.style.overflow = "hidden";

});

function closeSidebar(){

  sidebar.classList.remove("active");
  menuOverlay.classList.remove("active");

  document.body.style.overflow = "";

}

closeMenu.addEventListener(
"click",
closeSidebar
);

menuOverlay.addEventListener(
"click",
closeSidebar
);

/* ESC CLOSE */

document.addEventListener(
"keydown",
(e)=>{

  if(e.key === "Escape"){

    closeSidebar();

  }

});

/* OPEN DRAMA */

document.querySelectorAll(".card")
.forEach(card=>{

  card.addEventListener("click", ()=>{

    const link =
    card.getAttribute("data-link");

    if(link){

      window.location.href = link;

    }

  });

});

/* SEARCH */

const searchInput =
document.getElementById("searchInput");

const searchBtn =
document.getElementById("searchBtn");

function searchDrama(){

  const value =
  searchInput.value.toLowerCase();

  const cards =
  document.querySelectorAll(".card");

  cards.forEach(card=>{

    const title =
    card.getAttribute("data-title")
    .toLowerCase();

    card.style.display =
    title.includes(value)
    ? "block"
    : "none";

  });

}

searchInput.addEventListener(
"input",
searchDrama
);

searchBtn.addEventListener(
"click",
searchDrama
);

/* SCROLL BUTTONS */

const scrollTopBtn =
document.getElementById("scrollTop");

const scrollBottomBtn =
document.getElementById("scrollBottom");

scrollTopBtn.addEventListener(
"click",
()=>{

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});

scrollBottomBtn.addEventListener(
"click",
()=>{

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

});

</script>

</body>
</html>
