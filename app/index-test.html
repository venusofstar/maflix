<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MAFLIX</title><meta
name="theme-color"
content="#e50914">

<meta
name="description"
content="Watch movies, anime, sports and live TV with MAFLIX streaming platform.">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script><style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  touch-action:pan-y;
}

img{
  display:block;
  max-width:100%;
}

button,
a,
input,
.card-item{
  outline:none;
  -webkit-tap-highlight-color:transparent;
}

button:focus,
a:focus,
input:focus,
.card-item:focus{
  outline:3px solid #fff;
  outline-offset:2px;
}

/* ================= NAVBAR ================= */

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.35),
    transparent
  );

  backdrop-filter:blur(10px);
}

#leftNav{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  flex-shrink:0;
  transition:.2s;
}

#menuBtn:hover,
#menuBtn:focus{
  background:#e50914;
  transform:scale(1.05);
}

#appTitle{
  color:#e50914;
  font-size:clamp(22px,4vw,38px);
  font-weight:bold;
  letter-spacing:1px;
  white-space:nowrap;
}

/* ================= SEARCH ================= */

#searchBox{
  display:flex;
  align-items:center;
  background:#1b1b1b;
  border-radius:50px;
  overflow:hidden;
  flex-shrink:0;
}

#searchInput{
  width:220px;
  height:46px;
  padding:0 15px;
  border:none;
  background:transparent;
  color:#fff;
  font-size:15px;
}

#searchBtn{
  width:52px;
  height:46px;
  border:none;
  background:#e50914;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  top:0;
  left:-320px;
  width:280px;
  max-width:85%;
  height:100dvh;

  background:#111;
  z-index:5000;

  padding:20px;

  transition:.3s;

  display:flex;
  flex-direction:column;
  gap:14px;

  overflow-y:auto;
  overscroll-behavior:contain;

  scrollbar-width:thin;
  scrollbar-color:#e50914 #111;
}

#sidebar.active{ left:0; }

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  position:sticky;
  top:0;
  background:#111;
  padding-bottom:10px;
  z-index:10;
}

#sidebarHeader h2{
  color:#e50914;
  font-size:28px;
}

#closeMenu{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.sidebarLinks{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:50px;
}

#sidebar a{
  color:#fff;
  text-decoration:none;
  padding:15px;
  border-radius:12px;
  background:#1a1a1a;
  transition:.2s;
  font-size:16px;
}

#sidebar a:hover,
#sidebar a:focus{
  background:#e50914;
}

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:4000;
  display:none;
}

#menuOverlay.active{ display:block; }

/* ================= HERO ================= */

#hero{
  position:relative;
  width:100%;
  min-height:85vh;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.92),
    rgba(0,0,0,.2)
  ),
  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;

  display:flex;
  align-items:center;

  padding:clamp(20px,5vw,80px);
  padding-top:100px;
}

.heroContent{ max-width:650px; }
.heroContent h2{ font-size:clamp(34px,7vw,72px); margin-bottom:15px; }
.heroContent p{ color:#ddd; line-height:1.7; margin-bottom:25px; font-size:clamp(14px,2vw,20px); }
.heroButtons{ display:flex; gap:15px; flex-wrap:wrap; }
.heroButtons button{ min-height:48px; padding:12px 26px; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight:bold; }
.playBtn{ background:#fff; color:#000; }
.infoBtn{ background:rgba(109,109,110,.7); color:#fff; }

/* ================= CHANNELS ================= */

#channelSections{ padding:15px; }
.category-wrapper{ position:relative; margin-bottom:35px; }
.category-wrapper h2{ margin:15px 0; font-size:clamp(20px,3vw,32px); padding-left:10px; }

.horizontal-scroll{ display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; padding-inline:60px; padding-bottom:10px; scrollbar-width:none; }
.horizontal-scroll::-webkit-scrollbar{ display:none; }

.card-item{ min-width:170px; width:170px; height:255px; border-radius:14px; overflow:hidden; position:relative; cursor:pointer; background:#181818; transition:transform .25s,box-shadow .25s; flex-shrink:0; }
.card-item:hover,.card-item:focus{ transform:scale(1.06); box-shadow:0 10px 25px rgba(0,0,0,.5); }
.card-item img{ width:100%; height:100%; object-fit:cover; }
.card-item p{ position:absolute; bottom:0; width:100%; padding:14px; background:linear-gradient(to top,rgba(0,0,0,.96),transparent); font-size:16px; font-weight:bold; }

.slideBtn{ position:absolute; top:55%; transform:translateY(-50%); width:52px; height:95px; border:none; border-radius:14px; background:rgba(0,0,0,.7); color:#fff; font-size:34px; cursor:pointer; z-index:10; }
.slideBtn:hover,.slideBtn:focus{ background:#e50914; }
.slideLeft{ left:0; }
.slideRight{ right:0; }

/* ================= PLAYER ================= */

#videoContainer{ position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:9999; }
#videoPlayer,#ytFrame{ width:min(95vw,1600px); height:min(85vh,900px); border:none; border-radius:12px; background:#000; }
#closeBtn{ position:absolute; top:15px; right:15px; width:48px; height:48px; border:none; border-radius:50%; background:#e50914; color:#fff; font-size:22px; cursor:pointer; }
#spinner{ border:5px solid rgba(255,255,255,.2); border-top:5px solid #e50914; border-radius:50%; width:52px; height:52px; animation:spin 1s linear infinite; position:absolute; display:none; }
@keyframes spin{100%{transform:rotate(360deg);}}

/* ================= MOBILE ================= */
@media(max-width:768px){
#searchInput{ width:120px; }
.card-item{ min-width:140px; width:140px; height:210px; }
.horizontal-scroll{ padding-inline:42px; }
#videoPlayer,#ytFrame{ width:100%; height:100%; border-radius:0; }
}

</style></head>
<body><!-- NAVBAR --><div id="navbar">  <div id="leftNav">
    <button id="menuBtn">☰</button>
    <h1 id="appTitle">MAFLIX</h1>
  </div>  <div id="searchBox">
    <input id="searchInput" placeholder="Search channels...">
    <button id="searchBtn">🔍</button>
  </div></div><!-- SIDEBAR --><div id="sidebar">  <div id="sidebarHeader">
    <h2>MAFLIX</h2>
    <button id="closeMenu">✕</button>
  </div>  <div class="sidebarLinks">
    <a href="index.html">🏠 Home</a>
    <a href="anime/index.html">🎌 Anime</a>
    <a href="drama-tagalod-dudbed/index.html">🎭 Tagalog Dubbed Drama</a>
    <a href="tv-channel.html">📺 TV Channels</a>
    <a href="sports-event.html">⚽ Sports Event</a>
    <a href="vivamax.html">🎬 Viva Max</a>
  </div></div><div id="menuOverlay"></div><!-- HERO --><section id="hero">
  <div class="heroContent">
    <h2>Trending Now</h2>
    <p>Watch movies, anime, sports and live TV with MAFLIX streaming platform.</p>
    <div class="heroButtons">
      <button class="playBtn">▶ Watch</button>
      <button class="infoBtn">More Info</button>
    </div>
  </div>
</section><!-- CHANNELS --><div id="channelSections"></div><!-- PLAYER --><div id="videoContainer">
  <div id="spinner"></div>
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
  <button id="closeBtn">✕</button>
</div><script>

const menuBtn=document.getElementById("menuBtn");
const sidebar=document.getElementById("sidebar");
const closeMenu=document.getElementById("closeMenu");
const menuOverlay=document.getElementById("menuOverlay");

menuBtn.onclick=()=>{
  sidebar.classList.add("active");
  menuOverlay.classList.add("active");
};

function closeSidebar(){
  sidebar.classList.remove("active");
  menuOverlay.classList.remove("active");
}

closeMenu.onclick=closeSidebar;
menuOverlay.onclick=closeSidebar;

let staticChannels=[];
let shakaPlayer=null;

function parseM3U(content){
  const lines=content.split("\n");
  const channels=[];
  let current=null;

  for(let line of lines){
    line=line.trim();

    if(line.startsWith("#EXTINF")){
      const name=line.match(/,(.*)$/);
      const logo=line.match(/tvg-logo="(.*?)"/);
      const group=line.match(/group-title="(.*?)"/);

      current={
        name:name?name[1]:"Unknown",
        logo:logo?logo[1]:"https://via.placeholder.com/300x450",
        category:group?group[1]:"Live TV",
        manifestUri:"",
        type:"iframe"
      };
    } else if(line && !line.startsWith("#") && current){
      current.manifestUri=line;

      if(line.includes("youtube.com")||line.includes("youtu.be")) current.type="youtube";
      else if(line.includes(".m3u8")) current.type="hls";
      else if(line.includes(".mpd")) current.type="dash";
      else if(line.includes(".mp4")) current.type="mp4";
      else current.type="iframe";

      channels.push(current);
      current=null;
    }
  }

  return channels;
}

async function fetchChannels(){
  let all=[];

  try{
    const r1=await fetch("channels.json");
    const d1=await r1.json();
    if(d1.channels) all.push(...d1.channels);
  }catch(e){}

  try{
    const r2=await fetch("channels2.json");
    const t2=await r2.text();
    all.push(...parseM3U(t2));
  }catch(e){}

  staticChannels=all;
  render(all);
}

function group(list){
  return list.reduce((a,c)=>{
    (a[c.category] ||= []).push(c);
    return a;
  },{});
}

function render(list){
  const container=document.getElementById("channelSections");
  container.innerHTML="";

  const grouped=group(list);

  Object.entries(grouped).forEach(([cat,items],i)=>{
    const wrapper=document.createElement("div");
    wrapper.className="category-wrapper";

    wrapper.innerHTML=`
      <h2>${cat}</h2>
      <button class="slideBtn slideLeft" onclick="slideRow('row${i}',-1)">❮</button>
      <div class="horizontal-scroll" id="row${i}"></div>
      <button class="slideBtn slideRight" onclick="slideRow('row${i}',1)">❯</button>
    `;

    container.appendChild(wrapper);

    const row=wrapper.querySelector(".horizontal-scroll");

    items.forEach(ch=>{
      const card=document.createElement("div");
      card.className="card-item";
      card.tabIndex=0;
      card.innerHTML=`<img src="${ch.logo}"><p>${ch.name}</p>`;
      card.onclick=()=>playChannel(ch);
      row.appendChild(card);
    });
  });
}

function slideRow(id,dir){
  const row=document.getElementById(id);
  row.scrollBy({left:dir*row.clientWidth*0.85,behavior:"smooth"});
}

document.addEventListener("keydown",e=>{
  const a=document.activeElement;
  if(e.key==="Enter"&&(a?.click)) a.click();
  if(e.key==="ArrowDown") window.scrollBy({top:300,behavior:"smooth"});
  if(e.key==="ArrowUp") window.scrollBy({top:-300,behavior:"smooth"});
});

async function playChannel(ch){
  const v=document.getElementById("videoPlayer");
  const yt=document.getElementById("ytFrame");
  const c=document.getElementById("videoContainer");
  const spinner=document.getElementById("spinner");

  c.style.display="flex";
  spinner.style.display="block";

  v.pause(); v.src=""; yt.src="";
  v.style.display="none"; yt.style.display="none";

  if(ch.type==="youtube"){
    yt.style.display="block";
    yt.src=`https://www.youtube.com/embed/${ch.manifestUri.split("v=")[1]}?autoplay=1`;
    spinner.style.display="none";
    return;
  }

  if(ch.type==="iframe"){
    yt.style.display="block";
    yt.src=ch.manifestUri;
    spinner.style.display="none";
    return;
  }

  if(ch.type==="mp4"){
    v.style.display="block";
    v.src=ch.manifestUri;
    v.onloadeddata=()=>spinner.style.display="none";
    v.play();
    return;
  }

  v.style.display="block";

  shakaPlayer??=new shaka.Player(v);
  await shakaPlayer.unload();

  try{
    await shakaPlayer.load(ch.manifestUri);
    spinner.style.display="none";
  }catch(e){
    spinner.style.display="none";
    alert("Playback Error");
  }
}

document.getElementById("closeBtn").onclick=()=>{
  document.getElementById("videoContainer").style.display="none";
  document.getElementById("videoPlayer").pause();
  document.getElementById("videoPlayer").src="";
  document.getElementById("ytFrame").src="";
};

const searchInput=document.getElementById("searchInput");

function searchChannels(){
  const v=searchInput.value.toLowerCase();
  const filtered=staticChannels.filter(c=>c.name.toLowerCase().includes(v)||c.category.toLowerCase().includes(v));
  render(filtered);
}

searchInput.addEventListener("input",searchChannels);
document.getElementById("searchBtn").onclick=searchChannels;

window.onload=fetchChannels;

</script></body>
</html>
