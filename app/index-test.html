<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MAFLIX</title>

<meta name="theme-color" content="#e50914">
<meta name="description" content="MAFLIX Streaming Platform">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

img{
  display:block;
  max-width:100%;
}

/* NAVBAR */

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;

  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.4),
    transparent
  );

  backdrop-filter:blur(10px);
}

#sidebar{
  position:fixed;
  top:0;
  left:-320px;

  width:280px;
  max-width:85%;
  height:100vh;

  background:#111;

  z-index:5000;

  padding:20px;

  transition:.3s;

  display:flex;
  flex-direction:column;
  gap:14px;

  overflow-y:auto;

  box-shadow:0 0 30px rgba(0,0,0,.5);
}

#sidebar.active{
  left:0;
}

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

#sidebarHeader h2{
  color:#e50914;
  font-size:30px;
}

#closeMenu{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.sidebarLinks{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.sidebarLinks a{
  color:#fff;
  text-decoration:none;
  padding:15px;
  border-radius:12px;
  background:#1a1a1a;
  transition:.2s;
  font-size:16px;
}

.sidebarLinks a:hover,
.sidebarLinks a:focus{
  background:#e50914;
  transform:translateX(5px);
}

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:4000;
  display:none;
  backdrop-filter:blur(4px);
}

#menuOverlay.active{
  display:block;
}

#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  margin-right:12px;
}

#menuBtn:hover{
  background:#e50914;
}

#appTitle{
  color:#e50914;
  font-size:34px;
  font-weight:700;
}

#searchBox{
  display:flex;
  align-items:center;
  gap:10px;
}

#movieSearchInput{
  width:240px;
  height:48px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  padding:0 15px;
  font-size:15px;
}

#searchBtn{
  height:48px;
  padding:0 20px;
  border:none;
  border-radius:12px;
  background:#e50914;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* HERO */

#hero{
  min-height:75vh;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.3)
  ),
  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop')
  center/cover no-repeat;

  display:flex;
  align-items:center;

  padding:120px 25px 30px;
}

.heroContent{
  max-width:650px;
}

.heroContent h1{
  font-size:65px;
  margin-bottom:15px;
}

.heroContent p{
  color:#ddd;
  line-height:1.7;
  margin-bottom:20px;
}

.heroButtons{
  display:flex;
  gap:15px;
}

.heroButtons button{
  border:none;
  border-radius:10px;
  padding:14px 26px;
  font-weight:700;
  cursor:pointer;
}

.playBtn{
  background:#fff;
  color:#000;
}

.infoBtn{
  background:rgba(109,109,110,.7);
  color:#fff;
}

/* CONTENT */

#content{
  padding:20px;
}

.section{
  margin-bottom:45px;
}

.section h2{
  margin-bottom:15px;
  font-size:28px;
}

.row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:10px;
}

.row::-webkit-scrollbar{
  display:none;
}

/* CARD */

.card{
  min-width:180px;
  width:180px;
  height:270px;

  background:#181818;
  border-radius:14px;
  overflow:hidden;

  position:relative;

  cursor:pointer;

  transition:.25s;

  flex-shrink:0;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card p{
  position:absolute;
  bottom:0;
  width:100%;

  padding:14px;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.95),
    transparent
  );

  font-size:15px;
  font-weight:600;
}

/* PLAYER */

#playerModal{
  position:fixed;
  inset:0;
  background:#000;

  display:none;
  align-items:center;
  justify-content:center;

  z-index:9999;
}

#videoFrame{
  width:min(95vw,1600px);
  height:min(85vh,900px);
  border:none;
  border-radius:14px;
  background:#000;
}

#closePlayer{
  position:absolute;
  top:15px;
  right:15px;

  width:50px;
  height:50px;

  border:none;
  border-radius:50%;

  background:#e50914;
  color:#fff;

  font-size:22px;
  cursor:pointer;
}

.loading{
  padding:20px;
  color:#aaa;
}

/* MOBILE */

@media(max-width:768px){

  #appTitle{
    font-size:26px;
  }

  #movieSearchInput{
    width:140px;
  }

  .heroContent h1{
    font-size:42px;
  }

  .card{
    min-width:140px;
    width:140px;
    height:210px;
  }

  #videoFrame{
    width:100%;
    height:100%;
    border-radius:0;
  }

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div id="sidebar">

  <div id="sidebarHeader">

    <h2>MAFLIX</h2>

    <button id="closeMenu">✕</button>

  </div>

  <div class="sidebarLinks">

    <a href="index.html">🏠 Home</a>

    <a href="anime/index.html">🎌 Anime</a>

    <a href="drama-tagalod-dudbed/index.html">
      🎭 Tagalog Dubbed Drama
    </a>

    <a href="tv-channel.html">📺 TV Channels</a>

    <a href="sports-event.html">⚽ Sports Event</a>

    <a href="vivamax.html">🎬 Viva Max</a>

  </div>

</div>

<div id="menuOverlay"></div>

<!-- NAVBAR -->

<div id="navbar">

  <div style="display:flex;align-items:center;gap:12px;">

    <button id="menuBtn">☰</button>

    <h1 id="appTitle">MAFLIX</h1>

  </div>

  <div id="searchBox">

    <input
      type="text"
      id="movieSearchInput"
      placeholder="Search movies...">

    <button id="searchBtn">
      Search
    </button>

  </div>

</div>

<!-- HERO -->

<section id="hero">

  <div class="heroContent">

    <h1>Unlimited Movies & Series</h1>

    <p>
      Watch trending movies, anime and TV series instantly on MAFLIX.
    </p>

    <div class="heroButtons">

      <button class="playBtn">
        ▶ Watch Now
      </button>

      <button class="infoBtn">
        More Info
      </button>

    </div>

  </div>

</section>

<!-- CONTENT -->

<div id="content">

  <!-- CONTINUE WATCHING -->

  <div
    class="section"
    id="continueSection"
    style="display:none">

    <h2>▶ Continue Watching</h2>

    <div class="row" id="continueGrid"></div>

  </div>

  <!-- TRENDING -->

  <div class="section">

    <h2>🔥 Trending Movies</h2>

    <div class="row" id="trendingGrid"></div>

  </div>

  <!-- NEW MOVIES -->

  <div class="section">

    <h2>🆕 New Movies</h2>

    <div class="row" id="newMoviesGrid"></div>

  </div>

  <!-- ACTION -->

  <div class="section">

    <h2>💥 Action</h2>

    <div class="row" id="actionGrid"></div>

  </div>

  <!-- DRAMA -->

  <div class="section">

    <h2>🎭 Drama</h2>

    <div class="row" id="dramaGrid"></div>

  </div>

  <!-- COMEDY -->

  <div class="section">

    <h2>😂 Comedy</h2>

    <div class="row" id="comedyGrid"></div>

  </div>

  <!-- HORROR -->

  <div class="section">

    <h2>👻 Horror</h2>

    <div class="row" id="horrorGrid"></div>

  </div>

  <!-- SEARCH -->

  <div class="section">

    <h2>🎬 Search Results</h2>

    <div class="row" id="movieGrid"></div>

  </div>

</div>

<!-- PLAYER -->

<div id="playerModal">

  <iframe
    id="videoFrame"
    allowfullscreen
    allow="autoplay; fullscreen">
  </iframe>

  <button id="closePlayer">✕</button>

</div>

<script>

/* SIDEBAR */

const menuBtn =
document.getElementById(
  "menuBtn"
);

const sidebar =
document.getElementById(
  "sidebar"
);

const closeMenu =
document.getElementById(
  "closeMenu"
);

const menuOverlay =
document.getElementById(
  "menuOverlay"
);

menuBtn.onclick = ()=>{

  sidebar.classList.add(
    "active"
  );

  menuOverlay.classList.add(
    "active"
  );

};

function closeSidebar(){

  sidebar.classList.remove(
    "active"
  );

  menuOverlay.classList.remove(
    "active"
  );

}

closeMenu.onclick =
closeSidebar;

menuOverlay.onclick =
closeSidebar;

/* ESC CLOSE */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Escape"){

      closeSidebar();

    }

  }
);

const API_KEY = "90521a18";

/* TRENDING */

async function loadTrendingMovies(){

  const keywords = [
    "Marvel",
    "Avengers",
    "Batman",
    "Fast",
    "John Wick",
    "Anime"
  ];

  const randomKeyword =
  keywords[
    Math.floor(
      Math.random() * keywords.length
    )
  ];

  const grid =
  document.getElementById(
    "trendingGrid"
  );

  grid.innerHTML =
  `<div class="loading">
    Loading trending movies...
  </div>`;

  try{

    const res =
    await fetch(
      `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(randomKeyword)}`
    );

    const data =
    await res.json();

    grid.innerHTML = "";

    if(!data.Search) return;

    data.Search.forEach(movie=>{

      const card =
      createMovieCard(movie);

      grid.appendChild(card);

    });

  }

  catch(err){

    console.error(err);

  }

}

/* SEARCH */

async function searchMovies(
  defaultQuery = "Avengers"
){

  const query =
  document
  .getElementById(
    "movieSearchInput"
  )
  .value.trim()
  || defaultQuery;

  const grid =
  document.getElementById(
    "movieGrid"
  );

  /* SCROLL SEARCH RESULTS TO TOP */

  document
  .getElementById(
    "movieGrid"
  )
  .scrollIntoView({

    behavior:"smooth",
    block:"start"

  });

  grid.innerHTML =
  `<div class="loading">
    Loading movies...
  </div>`;

  try{

    const res =
    await fetch(
      `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(query)}`
    );

    const data =
    await res.json();

    grid.innerHTML = "";

    if(!data.Search){

      grid.innerHTML =
      `<div class="loading">
        No movies found.
      </div>`;

      return;

    }

    data.Search.forEach(movie=>{

      const card =
      createMovieCard(movie);

      grid.appendChild(card);

    });

  }

  catch(err){

    console.error(err);

  }

}

/* CREATE CARD */

function createMovieCard(movie){

  const card =
  document.createElement("div");

  card.className = "card";

  const poster =
  movie.Poster !== "N/A"
  ? movie.Poster
  : "https://via.placeholder.com/300x450";

  card.innerHTML = `

    <img
      src="${poster}"
      loading="lazy">

    <p>
      ${movie.Title}
    </p>

  `;

  card.onclick = ()=>{

    playMovie(
      movie.imdbID,
      movie.Title,
      poster
    );

  };

  return card;

}

/* PLAY MOVIE */

function playMovie(
  imdbID,
  title,
  poster
){

  const modal =
  document.getElementById(
    "playerModal"
  );

  const frame =
  document.getElementById(
    "videoFrame"
  );

  modal.style.display =
  "flex";

  /* SERVER 1 */
  const server1 =
  `https://vidsrc.to/embed/movie/${imdbID}`;

  /* SERVER 2 */
  const server2 =
  `https://videosrc2.com/embed/movies/${imdbID}`;

  frame.src = server1;

  /* fallback to server 2 */
  setTimeout(()=>{

    try{

      if(!frame.contentWindow){

        frame.src = server2;

      }

    }catch(e){

      frame.src = server2;

    }

  },5000);

  localStorage.setItem(
    "continueMovie",
    JSON.stringify({

      imdbID,
      title,
      poster

    })
  );

  renderContinueWatching();
}

/* CONTINUE WATCHING */ */

function renderContinueWatching(){

  const section =
  document.getElementById(
    "continueSection"
  );

  const grid =
  document.getElementById(
    "continueGrid"
  );

  const saved =
  JSON.parse(
    localStorage.getItem(
      "continueMovie"
    )
  );

  if(!saved){

    section.style.display =
    "none";

    return;

  }

  section.style.display =
  "block";

  grid.innerHTML = "";

  const card =
  document.createElement("div");

  card.className = "card";

  card.innerHTML = `

    <img src="${saved.poster}">

    <p>
      ▶ ${saved.title}
    </p>

  `;

  card.onclick = ()=>{

    playMovie(
      saved.imdbID,
      saved.title,
      saved.poster
    );

  };

  grid.appendChild(card);

}

/* CLOSE PLAYER */

document
.getElementById(
  "closePlayer"
)
.onclick = ()=>{

  document
  .getElementById(
    "playerModal"
  )
  .style.display = "none";

  document
  .getElementById(
    "videoFrame"
  )
  .src = "";

};

/* ENTER SEARCH */

document
.getElementById(
  "movieSearchInput"
)
.addEventListener(
  "keypress",
  e=>{

    if(e.key === "Enter"){

      searchMovies();

    }

  }
);

/* BUTTON SEARCH */

document
.getElementById(
  "searchBtn"
)
.onclick = ()=>{

  searchMovies();

};

/* INIT */

/* CATEGORY MOVIES */

async function loadCategoryMovies(category, containerId){

  const grid =
  document.getElementById(containerId);

  grid.innerHTML =
  `<div class="loading">
    Loading ${category}...
  </div>`;

  try{

    const res =
    await fetch(
      `https://www.omdbapi.com/?apikey=${API_KEY}&s=${encodeURIComponent(category)}`
    );

    const data =
    await res.json();

    grid.innerHTML = "";

    if(!data.Search) return;

    data.Search.forEach(movie=>{

      const card =
      createMovieCard(movie);

      grid.appendChild(card);

    });

  }

  catch(err){

    console.error(err);

  }

}

window.onload = ()=>{

  loadTrendingMovies();

  searchMovies("Marvel");

  renderContinueWatching();

  loadCategoryMovies(
    "2025",
    "newMoviesGrid"
  );

  loadCategoryMovies(
    "Action",
    "actionGrid"
  );

  loadCategoryMovies(
    "Drama",
    "dramaGrid"
  );

  loadCategoryMovies(
    "Comedy",
    "comedyGrid"
  );

  loadCategoryMovies(
    "Horror",
    "horrorGrid"
  );

};

</script>

</body>
</html>
