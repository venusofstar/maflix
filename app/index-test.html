<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MAFLIX</title>

<meta
name="theme-color"
content="#e50914">

<meta
name="description"
content="Watch movies, anime, sports and live TV with MAFLIX streaming platform.">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0b0b0b;
  color:#fff;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
  touch-action:pan-y;
}

img{
  display:block;
  max-width:100%;
}

button,
a,
input,
.card-item{
  outline:none;
  -webkit-tap-highlight-color:transparent;
}

/* ================= NAVBAR ================= */

#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  padding:12px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.95),
    rgba(0,0,0,.4),
    transparent
  );

  backdrop-filter:blur(10px);
}

#leftNav{
  display:flex;
  align-items:center;
  gap:12px;
}

#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

#menuBtn:hover{
  background:#e50914;
}

#appTitle{
  color:#e50914;
  font-size:34px;
  font-weight:700;
}

/* ================= SEARCH ================= */

#searchBox{
  display:flex;
  align-items:center;
  background:#1b1b1b;
  border-radius:50px;
  overflow:hidden;
}

#searchInput{
  width:220px;
  height:46px;
  border:none;
  background:transparent;
  color:#fff;
  padding:0 15px;
  font-size:15px;
}

#searchInput::placeholder{
  color:#aaa;
}

#searchBtn{
  width:52px;
  height:46px;
  border:none;
  background:#e50914;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  top:0;
  left:-320px;

  width:280px;
  height:100vh;

  background:#111;

  z-index:5000;

  padding:20px;

  transition:.3s;

  display:flex;
  flex-direction:column;
  gap:14px;
}

#sidebar.active{
  left:0;
}

#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

#sidebarHeader h2{
  color:#e50914;
  font-size:28px;
}

#closeMenu{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  cursor:pointer;
}

.sidebarLinks{
  display:flex;
  flex-direction:column;
  gap:12px;
}

#sidebar a{
  color:#fff;
  text-decoration:none;
  background:#1a1a1a;
  padding:14px;
  border-radius:12px;
  transition:.2s;
}

#sidebar a:hover{
  background:#e50914;
}

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:4000;
  display:none;
}

#menuOverlay.active{
  display:block;
}

/* ================= HERO ================= */

#hero{
  min-height:80vh;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.3)
  ),
  url(
'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop'
  )
  center/cover no-repeat;

  display:flex;
  align-items:center;

  padding:100px 30px 30px;
}

.heroContent{
  max-width:650px;
}

.heroContent h2{
  font-size:60px;
  margin-bottom:15px;
}

.heroContent p{
  color:#ddd;
  line-height:1.7;
  margin-bottom:25px;
}

.heroButtons{
  display:flex;
  gap:15px;
}

.heroButtons button{
  padding:13px 26px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.playBtn{
  background:#fff;
  color:#000;
}

.infoBtn{
  background:rgba(109,109,110,.7);
  color:#fff;
}

/* ================= CONTENT ================= */

#channelSections{
  padding:20px;
}

.category-wrapper{
  position:relative;
  margin-bottom:40px;
}

.category-wrapper h2{
  margin-bottom:15px;
  font-size:28px;
}

.horizontal-scroll{
  display:flex;
  gap:14px;

  overflow-x:auto;
  scrollbar-width:none;

  padding-bottom:10px;
}

.horizontal-scroll::-webkit-scrollbar{
  display:none;
}

/* ================= CARD ================= */

.card-item{
  min-width:180px;
  width:180px;
  height:270px;

  border-radius:14px;
  overflow:hidden;

  position:relative;
  cursor:pointer;

  background:#181818;

  transition:.25s;
  flex-shrink:0;
}

.card-item:hover{
  transform:scale(1.05);
}

.card-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-item p{
  position:absolute;
  bottom:0;
  width:100%;

  padding:14px;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,.96),
    transparent
  );

  font-size:15px;
  font-weight:600;
}

/* ================= PLAYER ================= */

#videoContainer{
  position:fixed;
  inset:0;

  background:#000;

  display:none;
  align-items:center;
  justify-content:center;

  z-index:9999;
}

#videoPlayer,
#ytFrame{
  width:min(95vw,1600px);
  height:min(85vh,900px);

  border:none;
  border-radius:14px;
  background:#000;
}

#closeBtn{
  position:absolute;
  top:15px;
  right:15px;

  width:50px;
  height:50px;

  border:none;
  border-radius:50%;

  background:#e50914;
  color:#fff;

  font-size:22px;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  #searchInput{
    width:120px;
  }

  .heroContent h2{
    font-size:38px;
  }

  .card-item{
    min-width:140px;
    width:140px;
    height:210px;
  }

  #videoPlayer,
  #ytFrame{
    width:100%;
    height:100%;
    border-radius:0;
  }

}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div id="navbar">

  <div id="leftNav">

    <button id="menuBtn">☰</button>

    <h1 id="appTitle">MAFLIX</h1>

  </div>

  <div id="searchBox">

    <input
      type="text"
      id="searchInput"
      placeholder="Search channels...">

    <button id="searchBtn">🔍</button>

  </div>

</div>

<!-- ================= SIDEBAR ================= -->

<div id="sidebar">

  <div id="sidebarHeader">

    <h2>MAFLIX</h2>

    <button id="closeMenu">✕</button>

  </div>

  <div class="sidebarLinks">

    <a href="#">🏠 Home</a>
    <a href="#">🎌 Anime</a>
    <a href="#">🎭 Drama</a>
    <a href="#">📺 TV Channels</a>
    <a href="#">⚽ Sports</a>

  </div>

</div>

<div id="menuOverlay"></div>

<!-- ================= HERO ================= -->

<section id="hero">

  <div class="heroContent">

    <h2>Trending Now</h2>

    <p>
      Watch movies, anime, sports and live TV
      with MAFLIX streaming platform.
    </p>

    <div class="heroButtons">

      <button class="playBtn">
        ▶ Watch
      </button>

      <button class="infoBtn">
        More Info
      </button>

    </div>

  </div>

</section>

<!-- ================= MOVIES ================= -->

<div id="channelSections">

  <div class="category-wrapper">

    <h2>🎬 Movies & Series</h2>

    <div style="
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
    ">

      <input
        type="text"
        id="movieSearchInput"
        placeholder="Search movie or series..."
        style="
          flex:1;
          min-width:220px;
          height:48px;
          border:none;
          border-radius:12px;
          background:#1b1b1b;
          color:#fff;
          padding:0 15px;
          font-size:15px;
        ">

      <button
        onclick="searchMovies()"
        style="
          height:48px;
          padding:0 20px;
          border:none;
          border-radius:12px;
          background:#e50914;
          color:#fff;
          font-weight:bold;
          cursor:pointer;
        ">
        Search
      </button>

    </div>

    <div
      class="horizontal-scroll"
      id="movieGrid">
    </div>

  </div>

</div>

<!-- ================= PLAYER ================= -->

<div id="videoContainer">

  <video
    id="videoPlayer"
    controls
    autoplay
    playsinline
    style="display:none">
  </video>

  <iframe
    id="ytFrame"
    allowfullscreen
    allow="autoplay; fullscreen">
  </iframe>

  <button id="closeBtn">✕</button>

</div>

<script>

/* ================= MENU ================= */

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.getElementById("sidebar");

const closeMenu =
document.getElementById("closeMenu");

const menuOverlay =
document.getElementById("menuOverlay");

menuBtn.onclick = ()=>{

  sidebar.classList.add("active");

  menuOverlay.classList.add("active");

};

function closeSidebar(){

  sidebar.classList.remove("active");

  menuOverlay.classList.remove("active");

}

closeMenu.onclick =
closeSidebar;

menuOverlay.onclick =
closeSidebar;

/* ================= OMDB ================= */

const OMDB_API_KEY =
"90521a18";

/* ================= SEARCH MOVIES ================= */

async function searchMovies(
  defaultQuery = "Marvel"
){

  const grid =
  document.getElementById(
    "movieGrid"
  );

  const input =
  document.getElementById(
    "movieSearchInput"
  );

  const query =
  input.value.trim() ||
  defaultQuery;

  grid.innerHTML =
  `<p style="padding:20px;color:#aaa;">
    Loading...
  </p>`;

  try{

    const res =
    await fetch(
      `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(query)}`
    );

    const data =
    await res.json();

    grid.innerHTML = "";

    if(!data.Search){

      grid.innerHTML =
      `<p style="padding:20px;color:#aaa;">
        No results found.
      </p>`;

      return;

    }

    data.Search.forEach(movie=>{

      const card =
      document.createElement("div");

      card.className =
      "card-item";

      const poster =
      movie.Poster !== "N/A"
      ? movie.Poster
      : "https://via.placeholder.com/300x450";

      card.innerHTML = `
        <img
          src="${poster}"
          loading="lazy">

        <p>
          ${movie.Title}
        </p>
      `;

      card.onclick = ()=>{

        playMovie(
          movie.imdbID
        );

      };

      document
      .getElementById(
        "movieGrid"
      )
      .appendChild(card);

    });

  }

  catch(err){

    console.error(err);

  }

}

/* ================= PLAY MOVIE ================= */

function playMovie(imdbID){

  const yt =
  document.getElementById(
    "ytFrame"
  );

  const v =
  document.getElementById(
    "videoPlayer"
  );

  const container =
  document.getElementById(
    "videoContainer"
  );

  v.pause();

  v.removeAttribute("src");

  v.load();

  v.style.display =
  "none";

  yt.style.display =
  "block";

  yt.src =
  `https://playimdb.com${imdbID}`;

  container.style.display =
  "flex";

}

/* ================= CLOSE PLAYER ================= */

document
.getElementById(
  "closeBtn"
)
.onclick = ()=>{

  const yt =
  document.getElementById(
    "ytFrame"
  );

  yt.src = "";

  document
  .getElementById(
    "videoContainer"
  )
  .style.display =
  "none";

};

/* ================= ENTER SEARCH ================= */

document
.getElementById(
  "movieSearchInput"
)
.addEventListener(
  "keypress",
  e=>{

    if(e.key === "Enter"){

      searchMovies();

    }

  }
);

/* ================= INIT ================= */

window.onload = ()=>{

  searchMovies("Avengers");

};

</script>

</body>
</html>
