<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Advanced Mobile Calculator">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
}

.calculator{
    width:100%;
    max-width:420px;
    background:#1a1a1a;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,.4);
}

.title-bar{
    background:#0b0b0b;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #222;
}

.title-bar h1{
    font-size:22px;
    font-weight:600;
}

.display{
    background:#000;
    padding:15px;
}

#historyDisplay{
    color:#888;
    min-height:22px;
    text-align:right;
    font-size:14px;
    margin-bottom:5px;
}

#display{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:#fff;
    text-align:right;
    font-size:36px;
    font-weight:bold;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    padding:10px;
}

button{
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    cursor:pointer;
    transition:.15s;
}

button:active{
    transform:scale(.95);
}

.num{
    background:#2d2d2d;
    color:#fff;
}

.func{
    background:#444;
    color:#fff;
}

.op{
    background:#ff9500;
    color:#fff;
}

.equal{
    background:#00c853;
    color:#fff;
    grid-column:span 2;
}

.history{
    max-height:140px;
    overflow-y:auto;
    background:#0e0e0e;
    padding:10px;
}

.history-item{
    color:#aaa;
    font-size:13px;
    padding:5px 0;
    border-bottom:1px solid #222;
}

.history::-webkit-scrollbar{
    width:4px;
}

.history::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

@media(max-width:480px){

    .calculator{
        max-width:100%;
    }

    button{
        padding:14px;
        font-size:15px;
    }

    #display{
        font-size:30px;
    }

    .buttons{
        gap:6px;
    }
}

@media(max-width:340px){

    button{
        padding:12px;
        font-size:14px;
    }

    #display{
        font-size:24px;
    }

    .title-bar h1{
        font-size:18px;
    }
}
</style>
</head>
<body>

<div class="calculator">

    <div class="title-bar">
        <h1>🧮 Calculator</h1>
    </div>

    <div class="display">
        <div id="historyDisplay"></div>
        <input type="text" id="display" value="0" readonly>
    </div>

    <div class="buttons">

        <button class="func" onclick="clearDisplay()">AC</button>
        <button class="func" onclick="backspace()">⌫</button>
        <button class="func" onclick="memoryClear()">MC</button>
        <button class="func" onclick="memoryRecall()">MR</button>
        <button class="func" onclick="copyResult()">📋</button>

        <button class="func" onclick="memoryAdd()">M+</button>
        <button class="func" onclick="memorySubtract()">M-</button>
        <button class="func" onclick="append('%')">%</button>
        <button class="op" onclick="append('/')">÷</button>
        <button class="func" onclick="scientific('sqrt')">√</button>

        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="op" onclick="append('*')">×</button>
        <button class="func" onclick="scientific('pow')">x²</button>

        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="op" onclick="append('-')">−</button>
        <button class="func" onclick="scientific('sin')">sin</button>

        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="op" onclick="append('+')">+</button>
        <button class="func" onclick="scientific('cos')">cos</button>

        <button class="num" onclick="append('0')">0</button>
        <button class="num" onclick="append('.')">.</button>
        <button class="func" onclick="scientific('tan')">tan</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="history" id="history"></div>

</div>

<script>
const display = document.getElementById("display");
const historyDisplay = document.getElementById("historyDisplay");
const historyBox = document.getElementById("history");

let memory = 0;

function append(value){
    if(display.value === "0" || display.value === "Error"){
        display.value = value;
    }else{
        display.value += value;
    }
}

function clearDisplay(){
    display.value = "0";
    historyDisplay.textContent = "";
}

function backspace(){
    if(display.value.length > 1){
        display.value = display.value.slice(0,-1);
    }else{
        display.value = "0";
    }
}

function calculate(){
    try{
        let expression = display.value.replace(/%/g,"/100");
        let result = eval(expression);

        historyDisplay.textContent = display.value + " =";
        addHistory(display.value,result);

        display.value = result;
    }catch{
        display.value = "Error";
    }
}

function scientific(type){

    let value = parseFloat(display.value);

    if(isNaN(value)) return;

    switch(type){

        case "sqrt":
            display.value = Math.sqrt(value);
            break;

        case "pow":
            display.value = Math.pow(value,2);
            break;

        case "sin":
            display.value = Math.sin(value*Math.PI/180);
            break;

        case "cos":
            display.value = Math.cos(value*Math.PI/180);
            break;

        case "tan":
            display.value = Math.tan(value*Math.PI/180);
            break;
    }
}

function addHistory(exp,res){

    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = exp + " = " + res;

    historyBox.prepend(div);

    if(historyBox.children.length > 20){
        historyBox.removeChild(historyBox.lastChild);
    }
}

function memoryAdd(){
    memory += Number(display.value) || 0;
}

function memorySubtract(){
    memory -= Number(display.value) || 0;
}

function memoryRecall(){
    display.value = memory;
}

function memoryClear(){
    memory = 0;
}

function copyResult(){

    navigator.clipboard.writeText(display.value)
    .then(()=>{
        alert("Copied: " + display.value);
    });
}

document.addEventListener("keydown",(e)=>{

    if("0123456789+-*/.".includes(e.key)){
        append(e.key);
    }

    if(e.key === "Enter"){
        calculate();
    }

    if(e.key === "Backspace"){
        backspace();
    }

    if(e.key === "Escape"){
        clearDisplay();
    }
});
</script>

</body>
</html>
