<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MAFLIX</title>
<meta name="theme-color" content="#e50914">
<meta name="description" content="Watch movies, anime, sports and live TV with MAFLIX streaming platform.">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  touch-action:pan-y;
}
/* ================= GLOBAL ================= */
img{
  display:block;
  max-width:100%;
}
button, a, input, .card-item{
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
button:focus, a:focus, input:focus, .card-item:focus{
  outline:3px solid #fff;
  outline-offset:2px;
}
/* ================= NAVBAR ================= */
#navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:999;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background: linear-gradient(to bottom, rgba(0,0,0,.95), rgba(0,0,0,.35), transparent);
  backdrop-filter:blur(10px);
}
#leftNav{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
#menuBtn{
  width:46px;
  height:46px;
  border:none;
  border-radius:12px;
  background:#1b1b1b;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  flex-shrink:0;
  transition:.2s;
}
#menuBtn:hover, #menuBtn:focus{
  background:#e50914;
  transform:scale(1.05);
}
#appTitle{
  color:#e50914;
  font-size:clamp(22px,4vw,38px);
  font-weight:bold;
  letter-spacing:1px;
  white-space:nowrap;
}
/* ================= SEARCH ================= */
#searchBox{
  display:flex;
  align-items:center;
  background:#1b1b1b;
  border-radius:50px;
  overflow:hidden;
  flex-shrink:0;
}
#searchInput{
  width:220px;
  height:46px;
  padding:0 15px;
  border:none;
  background:transparent;
  color:#fff;
  font-size:15px;
}
#searchInput::placeholder{
  color:#aaa;
}
#searchBtn{
  width:52px;
  height:46px;
  border:none;
  background:#e50914;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
/* ================= SIDEBAR ================= */
#sidebar{
  position:fixed;
  top:0;
  left:-320px;
  width:280px;
  max-width:85%;
  height:100dvh;
  background:#111;
  z-index:5000;
  padding:20px;
  transition:.3s;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#e50914 #111;
}
#sidebar::-webkit-scrollbar{
  width:6px;
}
#sidebar::-webkit-scrollbar-thumb{
  background:#e50914;
  border-radius:20px;
}
#sidebar.active{
  left:0;
}
#sidebarHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  position:sticky;
  top:0;
  background:#111;
  padding-bottom:10px;
  z-index:10;
}
#sidebarHeader h2{
  color:#e50914;
  font-size:28px;
}
#closeMenu{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#1b1b1b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
.sidebarLinks{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:50px;
}
#sidebar a{
  color:#fff;
  text-decoration:none;
  padding:15px;
  border-radius:12px;
  background:#1a1a1a;
  transition:.2s;
  font-size:16px;
}
#sidebar a:hover, #sidebar a:focus{
  background:#e50914;
}
#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:4000;
  display:none;
}
#menuOverlay.active{
  display:block;
}
/* ================= HERO ================= */
#hero{
  position:relative;
  width:100%;
  min-height:85vh;
  background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.2)),
  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
  display:flex;
  align-items:center;
  padding: clamp(20px,5vw,80px);
  padding-top:100px;
}
.heroContent{
  max-width:650px;
}
.heroContent h2{
  font-size: clamp(34px,7vw,72px);
  margin-bottom:15px;
}
.heroContent p{
  color:#ddd;
  line-height:1.7;
  margin-bottom:25px;
  font-size: clamp(14px,2vw,20px);
}
.heroButtons{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}
.heroButtons button{
  min-height:48px;
  padding:12px 26px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}
.heroButtons button:hover, .heroButtons button:focus{
  transform:scale(1.05);
}
.playBtn{
  background:#fff;
  color:#000;
}
.infoBtn{
  background:rgba(109,109,110,.7);
  color:#fff;
}
/* ================= CHANNELS ================= */
#channelSections{
  padding:15px;
}
.category-wrapper{
  position:relative;
  margin-bottom:35px;
}
.category-wrapper h2{
  margin:15px 0;
  font-size: clamp(20px,3vw,32px);
  padding-left:10px;
}
/* ================= SLIDER ================= */
.horizontal-scroll{
  display:flex;
  gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-behavior:smooth;
  padding-inline:60px;
  padding-bottom:10px;
  scrollbar-width:none;
}
.horizontal-scroll::-webkit-scrollbar{
  display:none;
}
/* ================= CARD ================= */
.card-item{
  min-width:170px;
  width:170px;
  height:255px;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  background:#181818;
  transition: transform .25s, box-shadow .25s;
  flex-shrink:0;
}
.card-item:hover, .card-item:focus{
  transform:scale(1.06);
  box-shadow:0 10px 25px rgba(0,0,0,.5);
}
.card-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card-item p{
  position:absolute;
  bottom:0;
  width:100%;
  padding:14px;
  background: linear-gradient(to top, rgba(0,0,0,.96), transparent);
  font-size:16px;
  font-weight:bold;
}
/* ================= SLIDE BUTTON ================= */
.slideBtn{
  position:absolute;
  top:55%;
  transform:translateY(-50%);
  width:52px;
  height:95px;
  border:none;
  border-radius:14px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:34px;
  cursor:pointer;
  z-index:10;
  backdrop-filter:blur(8px);
  transition:.2s;
}
.slideBtn:hover, .slideBtn:focus{
  background:#e50914;
}
.slideLeft{
  left:0;
}
.slideRight{
  right:0;
}
/* ================= PLAYER ================= */
#videoContainer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
#videoPlayer, #ytFrame{
  width:min(95vw,1600px);
  height:min(85vh,900px);
  border:none;
  border-radius:12px;
  background:#000;
}
#closeBtn{
  position:absolute;
  top:15px;
  right:15px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:#e50914;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
#spinner{
  border:5px solid rgba(255,255,255,.2);
  border-top:5px solid #e50914;
  border-radius:50%;
  width:52px;
  height:52px;
  animation:spin 1s linear infinite;
  position:absolute;
  display:none;
}
@keyframes spin{
  100%{ transform:rotate(360deg); }
}
/* ================= MOBILE ================= */
@media(max-width:768px){
  #navbar{ padding:10px 12px; }
  #searchInput{ width:120px; font-size:14px; }
  #hero{ min-height:65vh; padding:20px; padding-top:100px; }
  .card-item{ min-width:140px; width:140px; height:210px; }
  .card-item p{ font-size:14px; }
  .slideBtn{ width:40px; height:65px; font-size:22px; }
  .horizontal-scroll{ padding-inline:42px; }
  #videoPlayer, #ytFrame{ width:100%; height:100%; border-radius:0; }
}
/* ================= SMART TV ================= */
@media(min-width:1400px){
  body{ font-size:20px; }
  #navbar{ padding:20px 30px; }
  #appTitle{ font-size:50px; }
  #searchInput{ width:340px; height:62px; font-size:20px; }
  #searchBtn, #menuBtn, #closeMenu{ width:62px; height:62px; font-size:28px; }
  .card-item{ min-width:300px; width:300px; height:430px; }
  .card-item p{ font-size:22px; }
  .slideBtn{ width:74px; height:140px; font-size:46px; }
  .heroButtons button{ min-height:64px; padding:16px 36px; font-size:22px; }
}
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<div id="navbar">
  <div id="leftNav">
    <button id="menuBtn">☰</button>
    <h1 id="appTitle">MAFLIX</h1>
  </div>
  <div id="searchBox">
    <input type="text" id="searchInput" placeholder="Search channels...">
    <button id="searchBtn">🔍</button>
  </div>
</div>

<!-- ================= SIDEBAR ================= -->
<div id="sidebar">
  <div id="sidebarHeader">
    <h2>MAFLIX</h2>
    <button id="closeMenu">✕</button>
  </div>
  <div class="sidebarLinks">
    <a href="index.html">🏠 Home</a>
    <a href="anime/index.html">🎌 Anime</a>
    <a href="drama-tagalod-dudbed/index.html">🎭 Tagalog Dubbed Drama</a>
    <a href="tv-channel.html">📺 TV Channels</a>
    <a href="sports-event.html">⚽ Sports Event</a>
    <a href="vivamax.html">🎬 Viva Max</a>
  </div>
</div>
<div id="menuOverlay"></div>

<!-- ================= HERO ================= -->
<section id="hero">
  <div class="heroContent">
    <h2>Trending Now</h2>
    <p>Watch movies, anime, sports and live TV with MAFLIX streaming platform.</p>
    <div class="heroButtons">
      <button class="playBtn">▶ Watch</button>
      <button class="infoBtn">More Info</button>
    </div>
  </div>
</section>

<!-- ================= CHANNELS ================= -->
<div id="channelSections"></div>

<!-- ================= PLAYER ================= -->
<div id="videoContainer">
  <div id="spinner"></div>
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
  <button id="closeBtn">✕</button>
</div>

<script>
/* ================= MENU ================= */
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const closeMenu = document.getElementById("closeMenu");
const menuOverlay = document.getElementById("menuOverlay");

menuBtn.onclick = () => {
  sidebar.classList.add("active");
  menuOverlay.classList.add("active");
};

function closeSidebar() {
  sidebar.classList.remove("active");
  menuOverlay.classList.remove("active");
}

closeMenu.onclick = closeSidebar;
menuOverlay.onclick = closeSidebar;

/* ================= CHANNEL SYSTEM ================= */
let staticChannels = [];
let shakaPlayer = null;
let currentFocusIndex = 0;

/* ================= PARSE M3U ================= */
function parseM3U(content) {
  const lines = content.split("\n");
  const channels = [];
  let current = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith("#EXTINF")) {
      const nameMatch = line.match(/,(.*)$/);
      const logoMatch = line.match(/tvg-logo="(.*?)"/);
      const groupMatch = line.match(/group-title="(.*?)"/);
      current = {
        name: nameMatch ? nameMatch[1] : "Unknown",
        logo: logoMatch ? logoMatch[1] : "https://via.placeholder.com/300x450",
        category: groupMatch ? groupMatch[1] : "Live TV",
        manifestUri: "",
        type: "iframe"
      };
    } else if (line && !line.startsWith("#") && current) {
      current.manifestUri = line;
      if (line.includes("youtube.com") || line.includes("youtu.be")) {
        current.type = "youtube";
      } else if (line.includes(".m3u8")) {
        current.type = "hls";
      } else if (line.includes(".mpd")) {
        current.type = "dash";
      } else if (line.includes(".mp4")) {
        current.type = "mp4";
      } else {
        current.type = "iframe";
      }
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

/* ================= FETCH ================= */
async function fetchChannels() {
  try {
    let allChannels = [];
    try {
      const res1 = await fetch("channels.json");
      const data1 = await res1.json();
      if (data1.channels) allChannels.push(...data1.channels);
    } catch (e) { console.log("channels.json missing"); }

    try {
      const res2 = await fetch("channels2.json");
      const text2 = await res2.text();
      const parsed = parseM3U(text2);
      allChannels.push(...parsed);
    } catch (e) { console.log("channels2.json missing"); }

    staticChannels = allChannels;
    render(staticChannels);
  } catch (err) { console.error(err); }
}

/* ================= GROUP ================= */
function groupChannels(list) {
  return list.reduce((g, c) => {
    (g[c.category] ||= []).push(c);
    return g;
  }, {});
}

/* ================= RENDER ================= */
function render(channelsList) {
  const container = document.getElementById("channelSections");
  container.innerHTML = "";
  const grouped = groupChannels(channelsList);

  Object.entries(grouped).forEach(([cat, channels], index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "category-wrapper";
    wrapper.innerHTML = `
      <h2>${cat}</h2>
      <button class="slideBtn slideLeft" onclick="slideRow('row${index}',-1)">❮</button>
      <div class="horizontal-scroll" id="row${index}"></div>
      <button class="slideBtn slideRight" onclick="slideRow('row${index}',1)">❯</button>
    `;
    container.appendChild(wrapper);

    const row = wrapper.querySelector(".horizontal-scroll");
    channels.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card-item";
      card.tabIndex = 0;
      card.innerHTML = `
        <img loading="lazy" decoding="async" src="${ch.logo}" alt="${ch.name}">
        <p>${ch.name}</p>
      `;
      card.onclick = () => playChannel(ch);
      row.appendChild(card);
    });
  });

  // Set focus to first card after render
  setTimeout(() => {
    const firstCard = document.querySelector('.card-item');
    if (firstCard) {
      currentFocusIndex = 0;
      firstCard.focus();
    }
  }, 200);
}

/* ================= SLIDE ================= */
function slideRow(rowId, direction) {
  const row = document.getElementById(rowId);
  const scrollAmount = row.clientWidth * 0.85;
  row.scrollBy({ left: direction * scrollAmount, behavior: "smooth" });
}

/* ================= TV REMOTE NAVIGATION ================= */
document.addEventListener("keydown", e => {
  const active = document.activeElement;
  const allCards = Array.from(document.querySelectorAll('.card-item'));

  // Enter key to select
  if (e.key === "Enter" && active) {
    if (active.tagName === "BUTTON" || active.tagName === "A" || active.classList.contains("card-item")) {
      active.click();
      e.preventDefault();
    }
    return;
  }

  // Up/Down arrows scroll page
  if (e.key === "ArrowDown") {
    window.scrollBy({ top: 300, behavior: "smooth" });
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowUp") {
    window.scrollBy({ top: -300, behavior: "smooth" });
    e.preventDefault();
    return;
  }

  // Left/Right arrows navigate cards
  if (allCards.length === 0) return;

  if (e.key === "ArrowRight") {
    e.preventDefault();
    currentFocusIndex = Math.min(currentFocusIndex + 1, allCards.length - 1);
    allCards[currentFocusIndex].focus();
    allCards[currentFocusIndex].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }

  if (e.key === "ArrowLeft") {
    e.preventDefault();
    currentFocusIndex = Math.max(currentFocusIndex - 1, 0);
    allCards[currentFocusIndex].focus();
    allCards[currentFocusIndex].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }
});

/* ================= PLAY CHANNEL ================= */
async function playChannel(ch) {
  const v = document.getElementById("videoPlayer");
  const yt = document.getElementById("ytFrame");
  const c = document.getElementById("videoContainer");
  const spinner = document.getElementById("spinner");

  c.style.display = "flex";
  spinner.style.display = "block";
  v.pause();
  v.removeAttribute("src");
  v.load();
  yt.src = "";
  yt.style.display = "none";
  v.style.display = "none";

  if (ch.type === "youtube") {
    yt.style.display = "block";
    const videoId = ch.manifestUri.includes("v=") ? ch.manifestUri.split("v=")[1].split("&")[0] : ch.manifestUri.split("/").pop();
    yt.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    spinner.style.display = "none";
    return;
  }

  if (ch.type === "iframe") {
    yt.style.display = "block";
    yt.src = ch.manifestUri;
    spinner.style.display = "none";
    return;
  }

  if (ch.type === "mp4") {
    if (shakaPlayer) { await shakaPlayer.destroy(); shakaPlayer = null; }
    v.style.display = "block";
    v.src = ch.manifestUri;
    v.onloadeddata = () => { spinner.style.display = "none"; };
    v.play();
    return;
  }

  v.style.display = "block";
  if (!shakaPlayer) shakaPlayer = new shaka.Player(v);
  await shakaPlayer.unload();

  if (ch.clearKey) {
    shakaPlayer.configure({ drm: { clearKeys: ch.clearKey } });
  }

  try {
    await shakaPlayer.load(ch.manifestUri);
    spinner.style.display = "none";
    v.play();
  } catch (e) {
    console.error(e);
    spinner.style.display = "none";
    alert("Playback Error");
  }
}

/* ================= CLOSE PLAYER ================= */
document.getElementById("closeBtn").onclick = () => {
  const v = document.getElementById("videoPlayer");
  const yt = document.getElementById("ytFrame");
  document.getElementById("videoContainer").style.display = "none";
  v.pause();
  v.removeAttribute("src");
  v.load();
  yt.src = "";
};

/* ================= SEARCH ================= */
const searchInput = document.getElementById("searchInput");
function searchChannels() {
  const value = searchInput.value.toLowerCase();
  const filtered = staticChannels.filter(ch =>
    ch.name.toLowerCase().includes(value) ||
    ch.category.toLowerCase().includes(value)
  );
  render(filtered);
}
searchInput.addEventListener("input", searchChannels);
document.getElementById("searchBtn").onclick = searchChannels;

/* ================= INIT ================= */
window.onload = fetchChannels;
</script>

</body>
</html>
