<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>KMJS Gabi Ng Lagim The Movie</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    min-height: 100dvh;
}

/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    height: 100dvh;
    background: #000;
    position: relative;
    overflow: hidden;
}

/* =========================================================
   VIDEO
========================================================= */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
    background: #000;

    outline: none;

    /* Helps avoid unwanted browser touch behavior */
    touch-action: manipulation;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    z-index: 20;

    padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        18px
        max(14px, env(safe-area-inset-left));

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.92),
            rgba(0,0,0,.55),
            transparent
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.title {
    max-width: 90%;

    font-size: clamp(15px, 2vw, 21px);
    line-height: 1.25;

    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow:
        0 2px 8px rgba(0,0,0,.9);
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    position: absolute;
    inset: 0;

    z-index: 15;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    background:
        rgba(0,0,0,.08);

    transition:
        opacity .2s ease;
}

.loading.hidden {
    opacity: 0;
    visibility: hidden;
}

.spinner {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    border:
        5px solid rgba(255,255,255,.22);

    border-top-color: #00ff88;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   CENTER PLAY BUTTON
========================================================= */

.center-play {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(1);

    z-index: 12;

    width: 76px;
    height: 76px;

    border: 0;
    border-radius: 50%;

    background:
        rgba(0,0,0,.65);

    color: #fff;

    font-size: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        opacity .2s ease,
        transform .15s ease,
        background .15s ease;
}

.center-play:hover,
.center-play:focus {
    background: #00ff88;
    color: #000;

    transform:
        translate(-50%, -50%)
        scale(1.06);

    outline: none;
}

.center-play.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   ERROR
========================================================= */

.error {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(90%, 520px);

    z-index: 40;

    padding: 24px;

    text-align: center;

    background:
        rgba(12,12,12,.97);

    border:
        1px solid #333;

    border-radius: 14px;

    box-shadow:
        0 15px 60px rgba(0,0,0,.8);
}

.error.hidden {
    display: none;
}

.error h2 {
    margin-bottom: 10px;

    color: #ff5b5b;

    font-size: 20px;
}

.error p {
    color: #bbb;

    font-size: 14px;
    line-height: 1.55;
}

.retry {
    margin-top: 16px;

    padding: 11px 20px;

    border: 0;
    border-radius: 8px;

    background: #00ff88;
    color: #000;

    font-weight: 700;

    cursor: pointer;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 25;

    padding:
        8px
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.98),
            rgba(0,0,0,.86),
            rgba(0,0,0,0)
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.controls.hidden,
.topbar.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 6px;

    appearance: none;

    cursor: pointer;

    background: rgba(255,255,255,.25);

    border-radius: 10px;

    outline: none;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 16px;
    height: 16px;

    border-radius: 50%;

    background: #00ff88;

    cursor: pointer;
}

.progress::-moz-range-thumb {
    width: 16px;
    height: 16px;

    border: 0;

    border-radius: 50%;

    background: #00ff88;

    cursor: pointer;
}

/* =========================================================
   CONTROL ROW
========================================================= */

.control-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 6px;
}

.control {
    min-width: 44px;
    height: 42px;

    padding: 0 10px;

    border: 0;
    border-radius: 8px;

    background:
        rgba(25,25,25,.9);

    color: #fff;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    outline: none;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .12s ease,
        color .12s ease,
        transform .1s ease;
}

.control:hover,
.control:focus {
    background: #00ff88;
    color: #000;
}

.control:active {
    transform: scale(.94);
}

.play {
    min-width: 52px;
    font-size: 18px;
}

.seek {
    font-size: 12px;
}

.spacer {
    flex: 1;
}

.time {
    min-width: 105px;

    color: #ddd;

    font-size: 12px;

    text-align: center;

    white-space: nowrap;
}

.volume {
    width: 85px;
    height: 5px;

    accent-color: #00ff88;

    cursor: pointer;
}

.speed {
    height: 42px;

    border: 0;
    border-radius: 8px;

    padding: 0 8px;

    background: rgba(25,25,25,.9);
    color: #fff;

    outline: none;
}

.speed:focus {
    background: #00ff88;
    color: #000;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .topbar {
        padding-top:
            max(10px, env(safe-area-inset-top));
    }

    .title {
        font-size: 14px;
    }

    .control {
        min-width: 40px;
        height: 38px;

        padding: 0 7px;

        font-size: 12px;
    }

    .play {
        min-width: 46px;
        font-size: 17px;
    }

    .seek {
        min-width: 42px;
    }

    .time {
        min-width: 82px;
        font-size: 10px;
    }

    .volume {
        display: none;
    }

    .speed {
        height: 38px;
        font-size: 11px;
    }

    .center-play {
        width: 64px;
        height: 64px;

        font-size: 25px;
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 390px) {

    .control {
        min-width: 36px;
        padding: 0 5px;
    }

    .seek {
        font-size: 10px;
    }

    .time {
        min-width: 70px;
    }

    .speed {
        display: none;
    }
}

/* =========================================================
   TV
========================================================= */

@media (min-width: 900px) {

    .control {
        min-width: 58px;
        height: 46px;

        font-size: 14px;
    }

    .play {
        min-width: 64px;
        font-size: 20px;
    }

    .seek {
        min-width: 64px;
    }

    .progress {
        height: 7px;
    }

    .progress::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
    }

    button:focus,
    select:focus,
    input:focus {
        outline:
            3px solid #00ff88;

        outline-offset: 2px;
    }
}

/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen #video {
    width: 100vw;
    height: 100vh;
}

:fullscreen .controls {
    padding-bottom: 20px;
}

:fullscreen .topbar {
    padding-top: 20px;
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="metadata"
        crossorigin="anonymous"
        tabindex="0">

        <source
            src="https://movies.maflix.qzz.io/movies/1786407007914-e7ea37ff-cd96-484f-af16-68b7074e308b-KMJS.Gabi.ng.Lagim.The.Movie.2025.1080p.mkv"
            type="video/x-matroska">

    <!-- =====================================================

    <div id="topbar" class="topbar">

                id="play"
                class="control play"

                aria-label="Play or pause">

                id="fullscreen"

                ⛶
            </button>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const app =
    document.getElementById("app");

const video =
    document.getElementById("video");

const play =
    document.getElementById("play");

const centerPlay =
    document.getElementById("centerPlay");

const back =
    document.getElementById("back");

const forward =
    document.getElementById("forward");

const progress =
    document.getElementById("progress");

const time =
    document.getElementById("time");

const volume =
    document.getElementById("volume");

const mute =
    document.getElementById("mute");

const fullscreen =
    document.getElementById("fullscreen");

const pip =
    document.getElementById("pip");

const speed =
    document.getElementById("speed");

const controls =
    document.getElementById("controls");

const topbar =
    document.getElementById("topbar");

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const retry =
    document.getElementById("retry");


/* =========================================================
   SETTINGS
========================================================= */

const SEEK_TIME = 10;

const STORAGE_KEY =
    "kmjs-gabi-ng-lagim-position";

let hideTimer = null;

let progressDragging = false;

let lastTap = 0;


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds) ||
        seconds < 0) {

        return "00:00";
    }

    seconds =
        Math.floor(seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secondsPart =
        seconds % 60;

    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secondsPart).padStart(2, "0")
        );
    }

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secondsPart).padStart(2, "0")
    );
}


/* =========================================================
   PLAY STATE
========================================================= */

function updatePlayButton() {

    if (video.paused) {

        play.textContent = "▶";
        centerPlay.textContent = "▶";

        centerPlay.classList.remove("hidden");

    } else {

        play.textContent = "❚❚";

        centerPlay.classList.add("hidden");
    }
}


/* =========================================================
   PLAY
========================================================= */

async function playVideo() {

    try {

        await video.play();

        updatePlayButton();

        hideControlsSoon();

    } catch (err) {

        /*
         * Autoplay may be blocked.
         * User interaction will still allow playback.
         */

        console.log(
            "Playback requires user interaction:",
            err
        );

        centerPlay.classList.remove("hidden");
    }
}


function pauseVideo() {

    video.pause();

    updatePlayButton();
}


async function togglePlay() {

    if (video.paused) {

        await playVideo();

    } else {

        pauseVideo();
    }
}


play.addEventListener(
    "click",
    togglePlay
);

centerPlay.addEventListener(
    "click",
    togglePlay
);

video.addEventListener(
    "play",
    updatePlayButton
);

video.addEventListener(
    "pause",
    updatePlayButton
);


/* =========================================================
   SEEK
========================================================= */

function seekTo(seconds) {

    if (!Number.isFinite(video.duration)) {
        return;
    }

    const target =
        Math.max(
            0,
            Math.min(
                video.duration,
                seconds
            )
        );

    /*
     * fastSeek is useful for quick seeking
     * where supported.
     */
    if (
        typeof video.fastSeek === "function"
    ) {

        video.fastSeek(target);

    } else {

        video.currentTime = target;
    }
}


function seekBy(amount) {

    if (!Number.isFinite(video.currentTime)) {
        return;
    }

    seekTo(
        video.currentTime + amount
    );

    showControls();
}


back.addEventListener(
    "click",
    () => seekBy(-SEEK_TIME)
);

forward.addEventListener(
    "click",
    () => seekBy(SEEK_TIME)
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    if (
        progressDragging ||
        !Number.isFinite(video.duration) ||
        video.duration <= 0
    ) {
        return;
    }

    progress.value =
        (
            video.currentTime /
            video.duration
        ) * 100;

    time.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(video.duration);
}


video.addEventListener(
    "timeupdate",
    updateProgress
);

video.addEventListener(
    "durationchange",
    updateProgress
);

video.addEventListener(
    "loadedmetadata",
    updateProgress
);


/* =========================================================
   DRAG PROGRESS
========================================================= */

progress.addEventListener(
    "pointerdown",
    () => {

        progressDragging = true;
    }
);


progress.addEventListener(
    "pointerup",
    () => {

        progressDragging = false;

        if (
            Number.isFinite(video.duration)
        ) {

            video.currentTime =
                (
                    Number(progress.value) /
                    100
                ) * video.duration;
        }
    }
);


progress.addEventListener(
    "input",
    () => {

        if (
            Number.isFinite(video.duration)
        ) {

            const preview =
                (
                    Number(progress.value) /
                    100
                ) * video.duration;

            time.textContent =
                formatTime(preview) +
                " / " +
                formatTime(video.duration);
        }
    }
);


/* =========================================================
   VOLUME
========================================================= */

function updateMuteIcon() {

    if (
        video.muted ||
        video.volume === 0
    ) {

        mute.textContent = "🔇";

    } else if (
        video.volume < 0.5
    ) {

        mute.textContent = "🔉";

    } else {

        mute.textContent = "🔊";
    }
}


volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(volume.value);

        video.muted =
            video.volume === 0;

        updateMuteIcon();
    }
);


mute.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

        showControls();
    }
);


/* =========================================================
   SPEED
========================================================= */

speed.addEventListener(
    "change",
    () => {

        video.playbackRate =
            Number(speed.value);

        showControls();
    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen() {

    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

            return;
        }


        if (
            app.requestFullscreen
        ) {

            await app.requestFullscreen();

        } else if (
            video.webkitEnterFullscreen
        ) {

            video.webkitEnterFullscreen();
        }

    } catch (err) {

        console.log(
            "Fullscreen error:",
            err
        );
    }
}


fullscreen.addEventListener(
    "click",
    enterFullscreen
);


/* =========================================================
   PICTURE IN PICTURE
========================================================= */

async function togglePiP() {

    try {

        if (
            document.pictureInPictureElement
        ) {

            await document.exitPictureInPicture();

            return;
        }

        if (
            document.pictureInPictureEnabled &&
            !video.disablePictureInPicture
        ) {

            await video.requestPictureInPicture();

        } else {

            console.log(
                "Picture in Picture is not supported."
            );
        }

    } catch (err) {

        console.log(
            "PiP error:",
            err
        );
    }
}


pip.addEventListener(
    "click",
    togglePiP
);


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

    loading.classList.remove(
        "hidden"
    );
}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );
}


video.addEventListener(
    "loadstart",
    showLoading
);

video.addEventListener(
    "waiting",
    showLoading
);

video.addEventListener(
    "stalled",
    showLoading
);

video.addEventListener(
    "seeking",
    showLoading
);

video.addEventListener(
    "canplay",
    hideLoading
);

video.addEventListener(
    "playing",
    hideLoading
);

video.addEventListener(
    "seeked",
    hideLoading
);


/* =========================================================
   ERROR HANDLING
========================================================= */

function showError(message) {

    hideLoading();

    errorMessage.textContent =
        message;

    error.classList.remove(
        "hidden"
    );
}


video.addEventListener(
    "error",
    () => {

        let message =
            "This browser could not play the video.";

        if (video.error) {

            switch (
                video.error.code
            ) {

                case MediaError.MEDIA_ERR_ABORTED:

                    message =
                        "Video loading was aborted.";

                    break;

                case MediaError.MEDIA_ERR_NETWORK:

                    message =
                        "A network error occurred while loading the video.";

                    break;

                case MediaError.MEDIA_ERR_DECODE:

                    message =
                        "The video was downloaded but could not be decoded. The MKV container or its codec may not be supported.";

                    break;

                case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:

                    message =
                        "This browser does not support this video source or codec.";

                    break;
            }
        }

        showError(message);
    }
);


/* =========================================================
   RETRY
========================================================= */

retry.addEventListener(
    "click",
    async () => {

        error.classList.add(
            "hidden"
        );

        showLoading();

        const position =
            video.currentTime || 0;

        video.load();

        video.addEventListener(
            "loadedmetadata",
            function restorePosition() {

                video.removeEventListener(
                    "loadedmetadata",
                    restorePosition
                );

                if (
                    position > 0 &&
                    Number.isFinite(video.duration)
                ) {

                    video.currentTime =
                        Math.min(
                            position,
                            video.duration - 1
                        );
                }

                playVideo();
            }
        );
    }
);


/* =========================================================
   RESUME PLAYBACK
========================================================= */

function restorePosition() {

    try {

        const saved =
            Number(
                localStorage.getItem(
                    STORAGE_KEY
                )
            );

        if (
            saved > 5 &&
            Number.isFinite(video.duration)
        ) {

            if (
                saved <
                video.duration - 10
            ) {

                video.currentTime =
                    saved;
            }
        }

    } catch (err) {

        console.log(
            "Resume unavailable:",
            err
        );
    }
}


video.addEventListener(
    "loadedmetadata",
    restorePosition
);


video.addEventListener(
    "timeupdate",
    () => {

        /*
         * Save periodically instead of every
         * millisecond to reduce storage writes.
         */

        if (
            Math.floor(video.currentTime) % 5 === 0
        ) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    String(video.currentTime)
                );

            } catch (err) {}
        }
    }
);


video.addEventListener(
    "ended",
    () => {

        try {

            localStorage.removeItem(
                STORAGE_KEY
            );

        } catch (err) {}

        updatePlayButton();
    }
);


/* =========================================================
   AUTOPLAY
========================================================= */

window.addEventListener(
    "load",
    async () => {

        /*
         * Muted autoplay is more likely to be
         * allowed by browsers.
         */

        video.muted = true;

        volume.value = 1;

        updateMuteIcon();

        await playVideo();
    }
);


/* =========================================================
   USER CONTROLS
========================================================= */

function showControls() {

    controls.classList.remove(
        "hidden"
    );

    topbar.classList.remove(
        "hidden"
    );

    clearTimeout(hideTimer);

    if (!video.paused) {

        hideTimer =
            setTimeout(
                hideControls,
                3500
            );
    }
}


function hideControls() {

    if (video.paused) {
        return;
    }

    controls.classList.add(
        "hidden"
    );

    topbar.classList.add(
        "hidden"
    );
}


function hideControlsSoon() {

    clearTimeout(hideTimer);

    hideTimer =
        setTimeout(
            hideControls,
            3500
        );
}


app.addEventListener(
    "pointermove",
    showControls
);

app.addEventListener(
    "pointerdown",
    showControls
);

app.addEventListener(
    "mousemove",
    showControls
);


/* =========================================================
   DOUBLE TAP / DOUBLE CLICK
========================================================= */

video.addEventListener(
    "click",
    async () => {

        const now =
            Date.now();

        if (
            now - lastTap < 350
        ) {

            await enterFullscreen();
        }

        lastTap = now;

        showControls();
    }
);


/* =========================================================
   KEYBOARD / TV REMOTE
========================================================= */

document.addEventListener(
    "keydown",
    async (event) => {

        const key =
            event.key;

        /*
         * PLAY / PAUSE
         */

        if (
            key === " " ||
            key === "Enter" ||
            key === "MediaPlayPause"
        ) {

            event.preventDefault();

            await togglePlay();

            showControls();

            return;
        }


        /*
         * LEFT
         * BACK 10 SECONDS
         */

        if (
            key === "ArrowLeft" ||
            key === "MediaRewind"
        ) {

            event.preventDefault();

            seekBy(-SEEK_TIME);

            return;
        }


        /*
         * RIGHT
         * FORWARD 10 SECONDS
         */

        if (
            key === "ArrowRight" ||
            key === "MediaFastForward"
        ) {

            event.preventDefault();

            seekBy(SEEK_TIME);

            return;
        }


        /*
         * UP = VOLUME UP
         */

        if (
            key === "ArrowUp"
        ) {

            event.preventDefault();

            video.muted = false;

            video.volume =
                Math.min(
                    1,
                    video.volume + .05
                );

            volume.value =
                video.volume;

            updateMuteIcon();

            showControls();

            return;
        }


        /*
         * DOWN = VOLUME DOWN
         */

        if (
            key === "ArrowDown"
        ) {

            event.preventDefault();

            video.volume =
                Math.max(
                    0,
                    video.volume - .05
                );

            volume.value =
                video.volume;

            if (
                video.volume === 0
            ) {

                video.muted = true;
            }

            updateMuteIcon();

            showControls();

            return;
        }


        /*
         * M = MUTE
         */

        if (
            key === "m" ||
            key === "M"
        ) {

            video.muted =
                !video.muted;

            updateMuteIcon();

            return;
        }


        /*
         * F = FULLSCREEN
         */

        if (
            key === "f" ||
            key === "F"
        ) {

            await enterFullscreen();

            return;
        }


        /*
         * ESCAPE
         */

        if (
            key === "Escape"
        ) {

            if (
                document.fullscreenElement
            ) {

                await document.exitFullscreen();

            } else {

                showControls();
            }

            return;
        }


        /*
         * NUMBER KEYS
         * 0 = START
         * 1-9 = 10%-90%
         */

        if (
            /^[0-9]$/.test(key)
        ) {

            const number =
                Number(key);

            if (
                Number.isFinite(
                    video.duration
                )
            ) {

                video.currentTime =
                    number === 0
                        ? 0
                        : (
                            video.duration *
                            (number / 10)
                        );
            }

            showControls();
        }
    }
);


/* =========================================================
   MEDIA SESSION
   Android / TV / LOCK SCREEN CONTROLS
========================================================= */

if (
    "mediaSession" in navigator
) {

    try {

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    "KMJS Gabi Ng Lagim The Movie",

                artist:
                    "KMJS",

                album:
                    "KMJS Gabi Ng Lagim The Movie"
            });


        navigator.mediaSession.setActionHandler(
            "play",
            () => playVideo()
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => pauseVideo()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => seekBy(-10)
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => seekBy(10)
        );


        navigator.mediaSession.setActionHandler(
            "seekto",
            details => {

                if (
                    Number.isFinite(
                        details.seekTime
                    )
                ) {

                    seekTo(
                        details.seekTime
                    );
                }
            }
        );

    } catch (err) {

        console.log(
            "Media Session unavailable:",
            err
        );
    }
}


/* =========================================================
   SCREEN WAKE LOCK
========================================================= */

let wakeLock = null;


async function requestWakeLock() {

    if (
        !("wakeLock" in navigator)
    ) {
        return;
    }

    try {

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    } catch (err) {

        console.log(
            "Wake Lock unavailable:",
            err
        );
    }
}


async function releaseWakeLock() {

    if (wakeLock) {

        try {

            await wakeLock.release();

        } catch (err) {}

        wakeLock = null;
    }
}


video.addEventListener(
    "play",
    requestWakeLock
);

video.addEventListener(
    "pause",
    releaseWakeLock
);

video.addEventListener(
    "ended",
    releaseWakeLock
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible" &&
            !video.paused
        ) {

            await requestWakeLock();
        }
    }
);


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        showControls();

        setTimeout(
            hideControlsSoon,
            100
        );
    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

video.volume = 1;

video.muted = true;

video.playbackRate = 1;

updateMuteIcon();

updatePlayButton();

showControls();


/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

video.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);
</script>
