<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#00e676">

<title>KMJS Gabi Ng Lagim The Movie</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100dvh;
}

button,
select,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

/* =========================================================
   APP
========================================================= */

#app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}

/* =========================================================
   VIDEO
========================================================= */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    outline: none;

    touch-action: manipulation;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    z-index: 20;

    padding:
        max(12px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        18px
        max(14px, env(safe-area-inset-left));

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,.55),
            transparent
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.movie-title {
    max-width: 92%;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: clamp(15px, 2vw, 22px);
    font-weight: 700;

    text-shadow:
        0 2px 8px #000;
}

/* =========================================================
   PROCESSING SCREEN
========================================================= */

#processor {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 25px;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #101b15 0%,
            #050705 45%,
            #000 100%
        );

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

#processor.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.logo {
    width: 76px;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 22px;

    border-radius: 50%;

    background: #00e676;

    color: #000;

    font-size: 34px;
    font-weight: 900;

    box-shadow:
        0 0 35px rgba(0,230,118,.35);
}

.processor-title {
    font-size: 20px;
    font-weight: 800;

    margin-bottom: 8px;
}

.processor-status {
    max-width: 600px;

    color: #aaa;

    font-size: 14px;
    line-height: 1.5;

    margin-bottom: 18px;
}

.progress-box {
    width: min(600px, 90vw);
}

.ffmpeg-progress {
    width: 100%;
    height: 7px;

    overflow: hidden;

    background: #222;

    border-radius: 20px;
}

.ffmpeg-progress-bar {
    width: 0%;
    height: 100%;

    background: #00e676;

    border-radius: inherit;

    transition: width .1s linear;
}

.percent {
    margin-top: 8px;

    color: #00e676;

    font-size: 13px;
    font-weight: 700;
}

/* =========================================================
   LOADING
========================================================= */

#loading {
    position: absolute;
    inset: 0;

    z-index: 40;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

    background:
        rgba(0,0,0,.12);

    transition:
        opacity .2s ease,
        visibility .2s ease;
}

#loading.hidden {
    opacity: 0;
    visibility: hidden;
}

.spinner {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    border:
        5px solid rgba(255,255,255,.2);

    border-top-color: #00e676;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   CENTER PLAY
========================================================= */

#centerPlay {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    width: 74px;
    height: 74px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.72);

    color: #fff;

    font-size: 28px;

    transition:
        opacity .2s ease,
        transform .15s ease;
}

#centerPlay:hover,
#centerPlay:focus {
    background: #00e676;
    color: #000;

    transform:
        translate(-50%, -50%)
        scale(1.08);

    outline: none;
}

#centerPlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   ERROR
========================================================= */

#errorBox {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 150;

    width: min(92%, 560px);

    padding: 24px;

    border:
        1px solid #333;

    border-radius: 14px;

    background:
        rgba(8,8,8,.98);

    text-align: center;

    box-shadow:
        0 20px 70px rgba(0,0,0,.85);
}

#errorBox.hidden {
    display: none;
}

#errorBox h2 {
    margin-bottom: 10px;

    color: #ff5252;

    font-size: 20px;
}

#errorMessage {
    color: #bbb;

    font-size: 14px;
    line-height: 1.55;
}

.retry {
    margin-top: 18px;

    padding: 11px 22px;

    border-radius: 8px;

    background: #00e676;
    color: #000;

    font-weight: 800;
}

/* =========================================================
   CONTROLS
========================================================= */

#controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 50;

    padding:
        8px
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.98),
            rgba(0,0,0,.86),
            transparent
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

#controls.hidden,
.topbar.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   SEEK BAR
========================================================= */

.progress-container {
    width: 100%;

    margin-bottom: 8px;
}

#progress {
    appearance: none;

    width: 100%;
    height: 6px;

    background: #333;

    border-radius: 20px;

    outline: none;

    cursor: pointer;
}

#progress::-webkit-slider-thumb {
    appearance: none;

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: #00e676;

    cursor: pointer;
}

#progress::-moz-range-thumb {
    width: 17px;
    height: 17px;

    border: 0;

    border-radius: 50%;

    background: #00e676;

    cursor: pointer;
}

/* =========================================================
   BUTTON ROW
========================================================= */

.control-row {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 6px;
}

.control {
    min-width: 44px;
    height: 42px;

    padding: 0 9px;

    border-radius: 8px;

    background:
        rgba(24,24,24,.95);

    color: #fff;

    font-size: 13px;
    font-weight: 700;

    outline: none;
}

.control:hover,
.control:focus {
    background: #00e676;
    color: #000;

    outline:
        2px solid #00e676;

    outline-offset: 2px;
}

.control:active {
    transform: scale(.94);
}

.play-button {
    min-width: 52px;

    font-size: 18px;
}

.time {
    min-width: 105px;

    color: #ddd;

    text-align: center;

    font-size: 12px;

    white-space: nowrap;
}

.spacer {
    flex: 1;
}

.volume {
    width: 85px;
    height: 5px;

    accent-color: #00e676;

    cursor: pointer;
}

.speed {
    height: 42px;

    padding: 0 8px;

    border: 0;
    border-radius: 8px;

    background: rgba(24,24,24,.95);

    color: #fff;

    outline: none;
}

.speed:focus {
    background: #00e676;
    color: #000;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .control {
        min-width: 39px;
        height: 38px;

        padding: 0 6px;

        font-size: 11px;
    }

    .play-button {
        min-width: 46px;

        font-size: 16px;
    }

    .time {
        min-width: 82px;

        font-size: 10px;
    }

    .volume {
        display: none;
    }

    .speed {
        height: 38px;

        font-size: 11px;
    }

    #centerPlay {
        width: 64px;
        height: 64px;

        font-size: 24px;
    }
}

@media (max-width: 390px) {

    .speed {
        display: none;
    }

    .time {
        min-width: 70px;
    }

    .control {
        min-width: 35px;
        padding: 0 4px;
    }
}

/* =========================================================
   TV
========================================================= */

@media (min-width: 900px) {

    .control {
        min-width: 58px;
        height: 46px;

        font-size: 14px;
    }

    .play-button {
        min-width: 65px;

        font-size: 20px;
    }

    #progress {
        height: 7px;
    }

    #progress::-webkit-slider-thumb {
        width: 19px;
        height: 19px;
    }
}

/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen #video {
    width: 100vw;
    height: 100vh;
}

:fullscreen #controls {
    padding-bottom: 20px;
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>

<script type="module">

/*
 * Current FFmpeg JS wrapper and utility packages.
 *
 * The FFmpeg project publishes current releases on GitHub.
 * This page uses the browser module build.
 */

import {
    FFmpeg
} from "https://esm.sh/@ffmpeg/ffmpeg@0.12.15";

import {
    fetchFile,
    toBlobURL
} from "https://esm.sh/@ffmpeg/util@0.12.2";


/* =========================================================
   SOURCE
========================================================= */

const SOURCE_URL =
"https://movies.maflix.qzz.io/movies/1786407007914-e7ea37ff-cd96-484f-af16-68b7074e308b-KMJS.Gabi.ng.Lagim.The.Movie.2025.1080p.mkv";


const TITLE =
"KMJS Gabi Ng Lagim The Movie";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const processor =
    document.getElementById("processor");

const processorStatus =
    document.getElementById("processorStatus");

const ffmpegBar =
    document.getElementById("ffmpegBar");

const ffmpegPercent =
    document.getElementById("ffmpegPercent");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");

const retry =
    document.getElementById("retry");

const controls =
    document.getElementById("controls");

const topbar =
    document.getElementById("topbar");

const play =
    document.getElementById("play");

const centerPlay =
    document.getElementById("centerPlay");

const back =
    document.getElementById("back");

const forward =
    document.getElementById("forward");

const progress =
    document.getElementById("progress");

const time =
    document.getElementById("time");

const volume =
    document.getElementById("volume");

const mute =
    document.getElementById("mute");

const fullscreen =
    document.getElementById("fullscreen");

const speed =
    document.getElementById("speed");


/* =========================================================
   FFmpeg
========================================================= */

const ffmpeg =
    new FFmpeg();


let objectURL = null;

let progressDragging = false;

let hideTimer = null;

let wakeLock = null;


/* =========================================================
   UI HELPERS
========================================================= */

function setProcessorStatus(message) {

    processorStatus.textContent =
        message;
}


function setFFmpegProgress(value) {

    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    ffmpegBar.style.width =
        value + "%";

    ffmpegPercent.textContent =
        Math.round(value) + "%";
}


function showLoading() {

    loading.classList.remove(
        "hidden"
    );
}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );
}


function showError(message) {

    hideLoading();

    processor.classList.add(
        "hidden"
    );

    errorMessage.textContent =
        message;

    errorBox.classList.remove(
        "hidden"
    );
}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {
        return "00:00";
    }

    seconds =
        Math.floor(seconds);

    const h =
        Math.floor(
            seconds / 3600
        );

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;


    if (h > 0) {

        return (
            String(h).padStart(2,"0") +
            ":" +
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );
    }


    return (
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );
}


/* =========================================================
   PLAY STATE
========================================================= */

function updatePlayButton() {

    if (video.paused) {

        play.textContent =
            "▶";

        centerPlay.textContent =
            "▶";

        centerPlay.classList.remove(
            "hidden"
        );

    } else {

        play.textContent =
            "❚❚";

        centerPlay.classList.add(
            "hidden"
        );
    }
}


async function togglePlay() {

    if (video.paused) {

        try {

            await video.play();

        } catch (err) {

            console.log(
                "Play blocked:",
                err
            );

        }

    } else {

        video.pause();
    }
}


play.addEventListener(
    "click",
    togglePlay
);


centerPlay.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "play",
    updatePlayButton
);


video.addEventListener(
    "pause",
    updatePlayButton
);


/* =========================================================
   SEEK
========================================================= */

function seekBy(seconds) {

    if (
        !Number.isFinite(
            video.duration
        )
    ) {
        return;
    }


    const target =
        Math.max(
            0,
            Math.min(
                video.duration,
                video.currentTime +
                seconds
            )
        );


    if (
        typeof video.fastSeek ===
        "function"
    ) {

        video.fastSeek(
            target
        );

    } else {

        video.currentTime =
            target;
    }


    showControls();
}


back.addEventListener(
    "click",
    () => seekBy(-10)
);


forward.addEventListener(
    "click",
    () => seekBy(10)
);


/* =========================================================
   PROGRESS
========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        if (
            progressDragging
        ) {
            return;
        }


        if (
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ) {

            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 100;
        }


        time.textContent =
            formatTime(
                video.currentTime
            ) +
            " / " +
            formatTime(
                video.duration
            );
    }
);


progress.addEventListener(
    "pointerdown",
    () => {

        progressDragging =
            true;
    }
);


progress.addEventListener(
    "pointerup",
    () => {

        progressDragging =
            false;

        if (
            Number.isFinite(
                video.duration
            )
        ) {

            video.currentTime =
                (
                    Number(progress.value) /
                    100
                ) *
                video.duration;
        }
    }
);


progress.addEventListener(
    "input",
    () => {

        if (
            Number.isFinite(
                video.duration
            )
        ) {

            const preview =
                (
                    Number(progress.value) /
                    100
                ) *
                video.duration;

            time.textContent =
                formatTime(preview) +
                " / " +
                formatTime(video.duration);
        }
    }
);


/* =========================================================
   VOLUME
========================================================= */

function updateMuteIcon() {

    if (
        video.muted ||
        video.volume === 0
    ) {

        mute.textContent =
            "🔇";

    } else if (
        video.volume < .5
    ) {

        mute.textContent =
            "🔉";

    } else {

        mute.textContent =
            "🔊";
    }
}


volume.addEventListener(
    "input",
    () => {

        video.volume =
            Number(
                volume.value
            );

        video.muted =
            video.volume === 0;

        updateMuteIcon();
    }
);


mute.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateMuteIcon();

        showControls();
    }
);


/* =========================================================
   SPEED
========================================================= */

speed.addEventListener(
    "change",
    () => {

        video.playbackRate =
            Number(
                speed.value
            );
    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen() {

    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

        } else if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        } else if (
            video.webkitEnterFullscreen
        ) {

            video.webkitEnterFullscreen();
        }

    } catch (err) {

        console.log(
            "Fullscreen error:",
            err
        );
    }
}


fullscreen.addEventListener(
    "click",
    toggleFullscreen
);


/* =========================================================
   CONTROLS AUTO HIDE
========================================================= */

function showControls() {

    controls.classList.remove(
        "hidden"
    );

    topbar.classList.remove(
        "hidden"
    );

    clearTimeout(
        hideTimer
    );


    if (!video.paused) {

        hideTimer =
            setTimeout(
                () => {

                    controls.classList.add(
                        "hidden"
                    );

                    topbar.classList.add(
                        "hidden"
                    );

                },
                3500
            );
    }
}


document.addEventListener(
    "pointermove",
    showControls
);


document.addEventListener(
    "pointerdown",
    showControls
);


/* =========================================================
   LOADING EVENTS
========================================================= */

video.addEventListener(
    "waiting",
    showLoading
);

video.addEventListener(
    "stalled",
    showLoading
);

video.addEventListener(
    "seeking",
    showLoading
);

video.addEventListener(
    "playing",
    hideLoading
);

video.addEventListener(
    "canplay",
    hideLoading
);

video.addEventListener(
    "seeked",
    hideLoading
);


/* =========================================================
   VIDEO ERROR
========================================================= */

video.addEventListener(
    "error",
    () => {

        let msg =
            "The processed video could not be played.";

        if (video.error) {

            if (
                video.error.code ===
                MediaError.MEDIA_ERR_DECODE
            ) {

                msg =
                    "The browser cannot decode the output video codec.";

            } else if (
                video.error.code ===
                MediaError.MEDIA_ERR_NETWORK
            ) {

                msg =
                    "A network error occurred while loading the processed video.";

            } else if (
                video.error.code ===
                MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED
            ) {

                msg =
                    "The browser does not support the generated media format.";
            }
        }

        showError(msg);
    }
);


/* =========================================================
   FFmpeg LOG
========================================================= */

ffmpeg.on(
    "log",
    ({ message }) => {

        console.log(
            "[FFmpeg]",
            message
        );
    }
);


/* =========================================================
   FFmpeg PROGRESS
========================================================= */

ffmpeg.on(
    "progress",
    ({ progress: p }) => {

        setFFmpegProgress(
            p * 100
        );
    }
);


/* =========================================================
   LOAD FFMPEG
========================================================= */

async function loadFFmpeg() {

    if (
        ffmpeg.loaded
    ) {

        return;
    }


    setProcessorStatus(
        "Loading FFmpeg.wasm..."
    );

    setFFmpegProgress(5);


    try {

        /*
         * Use the single-thread core for a
         * normal standalone HTML page.
         *
         * toBlobURL avoids cross-origin worker
         * loading problems from the CDN.
         */

        const baseURL =
            "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


        const coreURL =
            await toBlobURL(
                `${baseURL}/ffmpeg-core.js`,
                "text/javascript"
            );


        const wasmURL =
            await toBlobURL(
                `${baseURL}/ffmpeg-core.wasm`,
                "application/wasm"
            );


        await ffmpeg.load({
            coreURL,
            wasmURL
        });


        setFFmpegProgress(10);

        setProcessorStatus(
            "FFmpeg engine ready."
        );

    } catch (err) {

        console.error(
            "FFmpeg load error:",
            err
        );

        throw new Error(
            "FFmpeg.wasm could not load. Check your internet connection or CDN access."
        );
    }
}


/* =========================================================
   FETCH SOURCE
========================================================= */

async function downloadSource() {

    setProcessorStatus(
        "Connecting to MAFLIX..."
    );

    setFFmpegProgress(12);


    let response;

    try {

        response =
            await fetch(
                SOURCE_URL,
                {
                    method: "GET",
                    mode: "cors",
                    credentials: "omit",
                    cache: "no-store"
                }
            );

    } catch (err) {

        throw new Error(
            "MAFLIX did not allow browser access to the MKV. The source server needs CORS support."
        );
    }


    if (!response.ok) {

        throw new Error(
            `MAFLIX returned HTTP ${response.status}.`
        );
    }


    /*
     * Content-Length is not always available
     * because of CORS/server configuration.
     */

    const total =
        Number(
            response.headers.get(
                "content-length"
            )
        );


    if (
        !response.body
    ) {

        const buffer =
            await response.arrayBuffer();

        setFFmpegProgress(25);

        return new Uint8Array(
            buffer
        );
    }


    const reader =
        response.body.getReader();

    const chunks = [];

    let received = 0;


    while (true) {

        const {
            done,
            value
        } =
            await reader.read();


        if (done) {
            break;
        }


        chunks.push(value);

        received +=
            value.byteLength;


        if (
            total > 0
        ) {

            /*
             * Download occupies 10%-45%.
             */

            const p =
                10 +
                (
                    received /
                    total
                ) * 35;

            setFFmpegProgress(
                p
            );

            setProcessorStatus(
                "Downloading MKV... " +
                Math.round(
                    received /
                    1048576
                ) +
                " MB"
            );

        } else {

            setProcessorStatus(
                "Downloading MKV... " +
                Math.round(
                    received /
                    1048576
                ) +
                " MB"
            );
        }
    }


    const result =
        new Uint8Array(
            received
        );


    let offset = 0;


    for (
        const chunk of chunks
    ) {

        result.set(
            chunk,
            offset
        );

        offset +=
            chunk.length;
    }


    setFFmpegProgress(45);

    return result;
}


/* =========================================================
   PREPARE MKV
========================================================= */

async function prepareVideo() {

    await loadFFmpeg();


    setProcessorStatus(
        "Downloading MKV source..."
    );


    const input =
        await downloadSource();


    setProcessorStatus(
        "Loading MKV into FFmpeg..."
    );

    setFFmpegProgress(48);


    try {

        await ffmpeg.writeFile(
            "input.mkv",
            input
        );

    } catch (err) {

        console.error(
            "writeFile error:",
            err
        );

        throw new Error(
            "The MKV is too large for this browser's available memory or could not be loaded."
        );
    }


    setProcessorStatus(
        "Remuxing MKV into browser-compatible MP4..."
    );

    setFFmpegProgress(50);


    /*
     * First attempt:
     *
     * Copy the video stream without re-encoding.
     * AAC audio is generated for compatibility.
     *
     * This is MUCH faster than full transcoding.
     */

    try {

        await ffmpeg.exec([
            "-i",
            "input.mkv",

            "-map",
            "0:v:0",

            "-map",
            "0:a:0?",

            "-c:v",
            "copy",

            "-c:a",
            "aac",

            "-b:a",
            "160k",

            "-movflags",
            "+faststart",

            "output.mp4"
        ]);


    } catch (remuxError) {

        console.warn(
            "Fast remux failed:",
            remuxError
        );


        /*
         * Compatibility fallback:
         *
         * H.264 + AAC.
         *
         * This is considerably slower and
         * CPU-intensive for 1080p movies.
         */

        setProcessorStatus(
            "Using compatibility mode: H.264 + AAC..."
        );


        setFFmpegProgress(55);


        await ffmpeg.exec([
            "-i",
            "input.mkv",

            "-map",
            "0:v:0",

            "-map",
            "0:a:0?",

            "-c:v",
            "libx264",

            "-preset",
            "veryfast",

            "-crf",
            "23",

            "-pix_fmt",
            "yuv420p",

            "-c:a",
            "aac",

            "-b:a",
            "160k",

            "-movflags",
            "+faststart",

            "output.mp4"
        ]);
    }


    setProcessorStatus(
        "Preparing browser video..."
    );

    setFFmpegProgress(92);


    const data =
        await ffmpeg.readFile(
            "output.mp4"
        );


    /*
     * Free the input from FFmpeg's virtual FS.
     */

    try {
        await ffmpeg.deleteFile(
            "input.mkv"
        );
    } catch (e) {}


    try {
        await ffmpeg.deleteFile(
            "output.mp4"
        );
    } catch (e) {}


    /*
     * Create browser Blob.
     */

    const blob =
        new Blob(
            [data.buffer],
            {
                type: "video/mp4"
            }
        );


    objectURL =
        URL.createObjectURL(
            blob
        );


    video.src =
        objectURL;


    video.load();


    setFFmpegProgress(100);


    setProcessorStatus(
        "Video ready."
    );


    /*
     * Give the video element time to
     * recognize its metadata.
     */

    await new Promise(
        resolve => {

            if (
                video.readyState >= 1
            ) {

                resolve();

                return;
            }


            video.addEventListener(
                "loadedmetadata",
                resolve,
                {
                    once: true
                }
            );
        }
    );


    processor.classList.add(
        "hidden"
    );


    showControls();


    /*
     * Muted autoplay attempt.
     */

    video.muted =
        true;

    volume.value =
        "1";

    updateMuteIcon();


    try {

        await video.play();

    } catch (err) {

        centerPlay.classList.remove(
            "hidden"
        );
    }
}


/* =========================================================
   MUTE ICON
========================================================= */

function updateMuteIcon() {

    if (
        video.muted ||
        video.volume === 0
    ) {

        mute.textContent =
            "🔇";

    } else if (
        video.volume < .5
    ) {

        mute.textContent =
            "🔉";

    } else {

        mute.textContent =
            "🔊";
    }
}


/* =========================================================
   RETRY
========================================================= */

retry.addEventListener(
    "click",
    async () => {

        errorBox.classList.add(
            "hidden"
        );

        processor.classList.remove(
            "hidden"
        );

        setFFmpegProgress(0);

        try {

            await prepareVideo();

        } catch (err) {

            console.error(err);

            showError(
                err.message ||
                "Unable to prepare the MKV."
            );
        }
    }
);


/* =========================================================
   TV REMOTE / KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    async event => {

        const key =
            event.key;


        /* PLAY / PAUSE */

        if (
            key === " " ||
            key === "Enter" ||
            key === "MediaPlayPause"
        ) {

            event.preventDefault();

            await togglePlay();

            showControls();

            return;
        }


        /* BACKWARD */

        if (
            key === "ArrowLeft" ||
            key === "MediaRewind"
        ) {

            event.preventDefault();

            seekBy(-10);

            return;
        }


        /* FORWARD */

        if (
            key === "ArrowRight" ||
            key === "MediaFastForward"
        ) {

            event.preventDefault();

            seekBy(10);

            return;
        }


        /* VOLUME UP */

        if (
            key === "ArrowUp"
        ) {

            event.preventDefault();

            video.muted =
                false;

            video.volume =
                Math.min(
                    1,
                    video.volume + .05
                );

            volume.value =
                video.volume;

            updateMuteIcon();

            showControls();

            return;
        }


        /* VOLUME DOWN */

        if (
            key === "ArrowDown"
        ) {

            event.preventDefault();

            video.volume =
                Math.max(
                    0,
                    video.volume - .05
                );

            volume.value =
                video.volume;

            if (
                video.volume === 0
            ) {

                video.muted =
                    true;
            }

            updateMuteIcon();

            showControls();

            return;
        }


        /* MUTE */

        if (
            key === "m" ||
            key === "M"
        ) {

            video.muted =
                !video.muted;

            updateMuteIcon();

            return;
        }


        /* FULLSCREEN */

        if (
            key === "f" ||
            key === "F"
        ) {

            await toggleFullscreen();

            return;
        }


        /* ESCAPE */

        if (
            key === "Escape"
        ) {

            if (
                document.fullscreenElement
            ) {

                await document.exitFullscreen();
            }

            showControls();
        }


        /*
         * Number keys:
         *
         * 0 = beginning
         * 1 = 10%
         * ...
         * 9 = 90%
         */

        if (
            /^[0-9]$/.test(key)
        ) {

            const n =
                Number(key);


            if (
                Number.isFinite(
                    video.duration
                )
            ) {

                video.currentTime =
                    n === 0
                        ? 0
                        : video.duration *
                          (n / 10);
            }

            showControls();
        }
    }
);


/* =========================================================
   SAVE / RESUME
========================================================= */

const resumeKey =
    "kmjs-gabi-ng-lagim-resume";


video.addEventListener(
    "loadedmetadata",
    () => {

        try {

            const saved =
                Number(
                    localStorage.getItem(
                        resumeKey
                    )
                );


            if (
                saved > 10 &&
                saved <
                video.duration - 10
            ) {

                video.currentTime =
                    saved;
            }

        } catch (e) {}
    }
);


let lastSaved =
    0;


video.addEventListener(
    "timeupdate",
    () => {

        const current =
            Math.floor(
                video.currentTime
            );


        if (
            current - lastSaved >= 5
        ) {

            lastSaved =
                current;


            try {

                localStorage.setItem(
                    resumeKey,
                    String(current)
                );

            } catch (e) {}
        }
    }
);


video.addEventListener(
    "ended",
    () => {

        try {

            localStorage.removeItem(
                resumeKey
            );

        } catch (e) {}
    }
);


/* =========================================================
   WAKE LOCK
========================================================= */

async function requestWakeLock() {

    if (
        !("wakeLock" in navigator)
    ) {
        return;
    }


    try {

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    } catch (e) {}
}


async function releaseWakeLock() {

    if (wakeLock) {

        try {

            await wakeLock.release();

        } catch (e) {}

        wakeLock =
            null;
    }
}


video.addEventListener(
    "play",
    requestWakeLock
);


video.addEventListener(
    "pause",
    releaseWakeLock
);


video.addEventListener(
    "ended",
    releaseWakeLock
);


/* =========================================================
   MEDIA SESSION
========================================================= */

if (
    "mediaSession" in navigator
) {

    try {

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    TITLE,

                artist:
                    "KMJS",

                album:
                    TITLE
            });


        navigator.mediaSession.setActionHandler(
            "play",
            () => video.play()
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => video.pause()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => seekBy(-10)
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => seekBy(10)
        );

    } catch (e) {}
}


/* =========================================================
   CLEAN OBJECT URL
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            objectURL
        ) {

            URL.revokeObjectURL(
                objectURL
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

(async function start() {

    try {

        await prepareVideo();

    } catch (err) {

        console.error(
            "Player startup failed:",
            err
        );


        showError(
            err.message ||
            "Unable to load the MKV video."
        );
    }

})();

</script>
