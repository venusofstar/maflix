<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Iframe Player</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#frame{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  outline:none;

  /* Touch enabled */
  pointer-events:auto;
  touch-action:auto;

  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
</style>
</head>

<body>

<iframe
  id="frame"
  title="Video Player"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture; web-share"
  allowfullscreen
  tabindex="0">
</iframe>

<script>
const params = new URLSearchParams(location.search);
const target = params.get("url");

const frame = document.getElementById("frame");

if (target) {
  try {

    const url = new URL(target);

    if (
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ) {
      throw new Error("Invalid protocol");
    }

    /*
     * Request autoplay.
     * The embedded player may still require
     * user interaction for unmuted playback.
     */
    url.searchParams.set("autoplay", "1");
    url.searchParams.set("mute", "0");
    url.searchParams.set("muted", "0");

    frame.src = url.href;

  } catch (e) {
    console.error("Invalid target URL:", e);
  }
}


/*
 * Best-effort popup protection
 *
 * This protects the parent page from scripts
 * attempting to use window.open().
 *
 * IMPORTANT:
 * A cross-origin iframe can still have its own
 * popup behavior that the parent cannot completely
 * control without sandboxing or controlling the
 * iframe content.
 */

(function(){

  const originalOpen = window.open;

  window.open = function(){

    console.warn("Popup blocked");

    return null;
  };

  /*
   * Prevent accidental links on the parent page
   * from opening a new browsing context.
   */
  document.addEventListener(
    "click",
    function(e){

      const link = e.target.closest("a");

      if(link && link.target === "_blank"){
        e.preventDefault();
        e.stopPropagation();

        console.warn("New tab blocked");
      }

    },
    true
  );

})();
</script>

</body>
</html>
