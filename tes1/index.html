<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAFLIX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebarHeader">
      <h2>MAFLIX</h2>
      <button id="closeMenu" class="closeBtn">✕</button>
    </div>
    <div class="sidebarLinks">
      <a href="go:home" class="navLink">🏠 Home</a>
      <a href="go:movies" class="navLink">🎬 Movies</a>
      <a href="go:series" class="navLink">📺 Series</a>
      <a href="go:anime-tag" class="navLink">🌸 Anime</a>
      <a href="go:drama-tag" class="navLink">🎭 Philippine Drama</a>
      <a href="go:tv-channel" class="navLink">📡 TV Channels</a>
      <a href="go:sports" class="navLink">⚽ Sports</a>
      <a href="go:vivamax" class="navLink">🎞️ Vivamax</a>
      <a href="go:request" class="navLink">📩 Request Content</a>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  <!-- Main Header -->
  <header class="mainHeader">
    <button id="menuBtn" class="menuBtn">☰</button>
    <div class="searchContainer">
      <input type="text" id="movieSearchInput" placeholder="Search movies, series, anime...">
      <button id="searchBtn">🔍</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="mainContent">
    <!-- Home Section -->
    <section id="homeContent" class="contentSection active">
      <div id="continueSection" class="rowContainer">
        <h2>Continue Watching</h2>
        <div class="row" id="continueGrid"></div>
      </div>

      <div class="rowContainer">
        <h2>Trending Now</h2>
        <div class="row" id="trendingGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('trendingGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('trendingGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Popular Movies</h2>
        <div class="row" id="popularGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('popularGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('popularGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Popular Series</h2>
        <div class="row" id="seriesPopularGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('seriesPopularGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('seriesPopularGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Action Movies</h2>
        <div class="row" id="actionGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('actionGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('actionGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Horror Movies</h2>
        <div class="row" id="horrorGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('horrorGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('horrorGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Drama Movies</h2>
        <div class="row" id="dramaGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('dramaGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('dramaGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Comedy Movies</h2>
        <div class="row" id="comedyGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('comedyGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('comedyGrid', 1)">›</button>
      </div>

      <div class="rowContainer">
        <h2>Anime</h2>
        <div class="row" id="animeGrid"></div>
        <button class="scrollBtn left" onclick="scrollRow('animeGrid', -1)">‹</button>
        <button class="scrollBtn right" onclick="scrollRow('animeGrid', 1)">›</button>
      </div>
    </section>

    <!-- Movies Section -->
    <section id="moviesSection" class="contentSection">
      <h2>All Movies</h2>
      <div class="grid" id="moviesGrid"></div>
    </section>

    <!-- Series Section -->
    <section id="seriesSection" class="contentSection">
      <h2>All Series</h2>
      <div class="grid" id="seriesGrid"></div>
    </section>

    <!-- Search Section -->
    <section id="searchSection" class="contentSection">
      <h2>Search Results</h2>
      <div class="grid" id="searchGrid"></div>
    </section>
  </main>

  <!-- Info Page -->
  <div id="infoPage" class="infoPage">
    <button id="infoBackBtn" class="backBtn">← Back</button>
    <div id="infoContent" class="infoContent"></div>
  </div>

  <!-- Player Modal -->
  <div id="playerModal" class="playerModal">
    <div id="topControls" class="playerControls">
      <button id="backPlayer" class="controlBtn">← Back</button>
      <div class="serverControls">
        <button id="server1Btn" class="controlBtn active">Server 1</button>
        <button id="server2Btn" class="controlBtn">Server 2</button>
        <button id="fullscreenBtn" class="controlBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <iframe id="videoFrame" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

  <script src="script.js"></script>
</body>
</html>
