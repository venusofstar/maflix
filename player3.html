<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HONOR TV Player</title>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#videoPlayer{
    width:100%;
    height:100%;
    background:#000;
}
</style>
</head>
<body>

<video
    id="videoPlayer"
    controls
    autoplay
    playsinline
    webkit-playsinline>
</video>

<script>
const params = new URLSearchParams(location.search);
const streamUrl = params.get("url");

if (!streamUrl) {
    document.body.innerHTML = `
        <div style="
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            height:100vh;
            font-family:sans-serif;">
            Missing ?url=
        </div>
    `;
} else {
    const player = dashjs.MediaPlayer().create();

    player.updateSettings({
        streaming: {
            lowLatencyEnabled: true,
            fastSwitchEnabled: true
        }
    });

    player.initialize(
        document.getElementById("videoPlayer"),
        decodeURIComponent(streamUrl),
        true
    );
}
</script>

</body>
</html>
