<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1"
/>

<title>MAFLIX HLS Player</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#container{
  position:relative;
  width:100%;
  height:100vh;
  background:#000;
}

video{
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:10;
  padding:15px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#00bfff;
}

.status{
  font-size:14px;
}

.loader{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  color:#fff;
  text-align:center;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,.2);
  border-top:5px solid #00bfff;
  border-radius:50%;
  margin:auto;
  margin-bottom:15px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.controls{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:15px;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
}

button{
  border:none;
  background:#00bfff;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:.85;
}

#error{
  position:absolute;
  inset:0;
  background:#000;
  color:#fff;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:50;
  text-align:center;
  padding:20px;
}

#error h2{
  color:#ff4444;
  margin-bottom:10px;
}

@media(max-width:768px){

  button{
    width:48%;
  }

  .logo{
    font-size:20px;
  }

}

</style>
</head>
<body>

<div id="container">

  <div class="topbar">
    <div class="logo">MAFLIX</div>
    <div class="status" id="status">Connecting...</div>
  </div>

  <video
    id="video"
    controls
    playsinline
    webkit-playsinline
    preload="auto"
    autoplay
    muted>
  </video>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>Loading Stream...</div>
  </div>

  <div class="controls">

    <button onclick="togglePlay()">Play / Pause</button>

    <button onclick="skipBack()">-10s</button>

    <button onclick="skipForward()">+10s</button>

    <button onclick="fullscreen()">Fullscreen</button>

    <button onclick="reloadPlayer()">Reload</button>

  </div>

  <div id="error">
    <h2>Stream Failed</h2>
    <p>Cannot load this M3U8 stream.</p>
    <button onclick="reloadPlayer()">Retry</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>

const video = document.getElementById("video");
const loader = document.getElementById("loader");
const statusText = document.getElementById("status");
const errorBox = document.getElementById("error");

/*
========================================
YOUR M3U8 STREAM
========================================
*/

const streamURL =
"https://hls03.cdnvideo11.shop/Devils-Stay.2024Ep1.m3u8?v=fmg3xvzlkpw";

/*
========================================
LOAD STREAM
========================================
*/

function startPlayer(){

  loader.style.display = "block";
  errorBox.style.display = "none";

  if(Hls.isSupported()){

    const hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:90
    });

    hls.loadSource(streamURL);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,function(){

      statusText.innerHTML = "Playing";

      video.play()
      .then(()=>{
        loader.style.display = "none";
      })
      .catch((e)=>{
        console.log(e);
      });

    });

    hls.on(Hls.Events.ERROR,function(event,data){

      console.log(data);

      if(data.fatal){

        switch(data.type){

          case Hls.ErrorTypes.NETWORK_ERROR:
            statusText.innerHTML = "Network Error";
            hls.startLoad();
            break;

          case Hls.ErrorTypes.MEDIA_ERROR:
            statusText.innerHTML = "Media Error";
            hls.recoverMediaError();
            break;

          default:
            showError();
            break;

        }

      }

    });

  }

  else if(video.canPlayType("application/vnd.apple.mpegurl")){

    video.src = streamURL;

    video.addEventListener("loadedmetadata",function(){

      video.play();

      loader.style.display = "none";

      statusText.innerHTML = "Playing";

    });

  }

  else{

    showError();

  }

}

/*
========================================
HELPERS
========================================
*/

function showError(){

  loader.style.display = "none";

  errorBox.style.display = "flex";

  statusText.innerHTML = "Failed";

}

function togglePlay(){

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}

function skipForward(){

  video.currentTime += 10;

}

function skipBack(){

  video.currentTime -= 10;

}

function reloadPlayer(){

  location.reload();

}

function fullscreen(){

  if(video.requestFullscreen){

    video.requestFullscreen();

  }else if(video.webkitRequestFullscreen){

    video.webkitRequestFullscreen();

  }

}

/*
========================================
VIDEO EVENTS
========================================
*/

video.addEventListener("waiting",()=>{

  loader.style.display = "block";

  statusText.innerHTML = "Buffering...";

});

video.addEventListener("playing",()=>{

  loader.style.display = "none";

  statusText.innerHTML = "Playing";

});

video.addEventListener("pause",()=>{

  statusText.innerHTML = "Paused";

});

video.addEventListener("ended",()=>{

  statusText.innerHTML = "Finished";

});

/*
========================================
START
========================================
*/

startPlayer();

</script>

</body>
</html>
