<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HONOR TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.player-container {
  width: 100%;
  max-width: 1200px;
  background: #000;
}

.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
  object-fit: contain;
}

.message {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.75);

  color: #fff;
  font-size: 15px;
  text-align: center;

  padding: 20px;

  pointer-events: none;
}

.hidden {
  display: none;
}

@media(max-width:600px) {

  .video-wrapper {
    aspect-ratio: 16 / 9;
  }

}
</style>
</head>

<body>

<div class="player-container">

  <div class="video-wrapper">

    <video
      id="video"
      controls
      playsinline
      preload="metadata">
    </video>

    <div
      id="message"
      class="message">
      Loading video...
    </div>

  </div>

</div>

<script>

/* =========================================================
   PLAYER
========================================================= */

const video = document.getElementById("video");
const message = document.getElementById("message");

let hls = null;


/* =========================================================
   GET URL FROM:
   player.html?url=STREAM_URL
========================================================= */

const params = new URLSearchParams(
  window.location.search
);

const streamURL = params.get("url");


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(text) {

  message.textContent = text;
  message.classList.remove("hidden");

}


/* =========================================================
   HIDE MESSAGE
========================================================= */

function hideMessage() {

  message.classList.add("hidden");

}


/* =========================================================
   CLEAN HLS
========================================================= */

function destroyHLS() {

  if (hls) {

    try {
      hls.destroy();
    } catch (error) {
      console.error(error);
    }

    hls = null;

  }

}


/* =========================================================
   CHECK URL
========================================================= */

if (!streamURL) {

  showMessage(
    "No video URL provided."
  );

} else {

  loadVideo(streamURL);

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(url) {

  destroyHLS();

  video.pause();

  video.removeAttribute("src");

  video.load();


  /*
   * Detect HLS by URL extension.
   */

  const isHLS =
    /\.m3u8($|\?)/i.test(url);


  /* =======================================================
     NATIVE HLS
  ======================================================= */

  if (
    isHLS &&
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    video.load();

    video.play()
      .then(() => {

        hideMessage();

      })
      .catch(() => {

        showMessage(
          "Video ready — press Play."
        );

      });

    return;

  }


  /* =======================================================
     HLS.JS
  ======================================================= */

  if (
    isHLS &&
    typeof Hls !== "undefined" &&
    Hls.isSupported()
  ) {

    hls = new Hls({

      enableWorker: true,

      lowLatencyMode: false,

      backBufferLength: 90,

      maxBufferLength: 30,

      maxMaxBufferLength: 60

    });


    hls.loadSource(url);

    hls.attachMedia(video);


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function () {

        hideMessage();

        video.play()
          .catch(() => {

            showMessage(
              "Video ready — press Play."
            );

          });

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function (event, data) {

        console.error(
          "HLS error:",
          data
        );

        if (data.fatal) {

          showMessage(
            "Unable to play this video."
          );

        }

      }
    );


    return;

  }


  /* =======================================================
     NORMAL VIDEO
     MP4 / WEBM / OTHER BROWSER SUPPORTED FORMAT
  ======================================================= */

  video.src = url;

  video.load();


  video.play()
    .then(() => {

      hideMessage();

    })
    .catch(() => {

      showMessage(
        "Video ready — press Play."
      );

    });

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "loadstart",
  function () {

    showMessage(
      "Loading video..."
    );

  }
);


video.addEventListener(
  "loadedmetadata",
  function () {

    hideMessage();

  }
);


video.addEventListener(
  "canplay",
  function () {

    hideMessage();

  }
);


video.addEventListener(
  "waiting",
  function () {

    showMessage(
      "Buffering..."
    );

  }
);


video.addEventListener(
  "playing",
  function () {

    hideMessage();

  }
);


video.addEventListener(
  "error",
  function () {

    showMessage(
      "Unable to play this video."
    );

  }
);

</script>

</body>
</html>
