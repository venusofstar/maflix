<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#00c853">

<title>HONOR TV | Movie Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  overflow: hidden;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body {
  overscroll-behavior: none;
}

button,
input {
  font: inherit;
}

.player {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100svh;
  background: #000;
  overflow: hidden;
  outline: none;
  user-select: none;
}

video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  object-fit: contain;
  object-position: center;

  /*
   * Helps prevent browser-side aggressive
   * power saving from interfering with playback.
   */
  -webkit-user-select: none;
  user-select: none;
}

/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;

  z-index: 20;

  padding:
    max(12px, env(safe-area-inset-top))
    16px
    45px;

  background:
    linear-gradient(
      rgba(0,0,0,.78),
      rgba(0,0,0,.25),
      transparent
    );

  pointer-events: none;

  opacity: 1;

  transition: opacity .25s ease;
}

.logo {
  color: #00e676;

  font-size: 18px;
  font-weight: 800;

  letter-spacing: .5px;

  text-shadow:
    0 2px 8px #000;
}

.player.hide-ui .top-bar {
  opacity: 0;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
  position: absolute;
  inset: 0;

  z-index: 50;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,.42);

  transition:
    opacity .2s ease;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.spinner {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  border:
    4px solid
    rgba(255,255,255,.18);

  border-top-color: #00e676;

  animation:
    spin .65s linear infinite;
}

.loading-text {
  margin-top: 12px;

  font-size: 14px;
  font-weight: 600;

  color: #fff;

  text-shadow:
    0 2px 6px #000;
}

.buffer-info {
  margin-top: 6px;

  color: #aaa;

  font-size: 11px;

  text-align: center;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================================================
   ERROR
========================================================= */

.error {
  position: absolute;
  inset: 0;

  z-index: 80;

  display: none;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 25px;

  background: #000;
}

.error.show {
  display: flex;
}

.error-icon {
  font-size: 46px;
  margin-bottom: 12px;
}

.error-title {
  font-size: 20px;
  font-weight: 700;

  margin-bottom: 8px;
}

.error-text {
  max-width: 390px;

  color: #aaa;

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 18px;
}

.retry-btn {
  min-width: 120px;
  height: 44px;

  border: 0;
  border-radius: 9px;

  background: #00c853;
  color: #fff;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

.retry-btn:active {
  transform: scale(.95);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 30;

  padding:
    70px
    12px
    max(12px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.96)
    );

  opacity: 1;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.player.hide-ui .controls {
  opacity: 0;
  pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-box {
  width: 100%;
  height: 30px;

  display: flex;
  align-items: center;
}

.progress {
  width: 100%;
  height: 5px;

  appearance: none;

  border: 0;
  border-radius: 20px;

  outline: none;

  background:
    rgba(255,255,255,.32);

  cursor: pointer;
}

.progress::-webkit-slider-thumb {
  appearance: none;

  width: 16px;
  height: 16px;

  border: 0;
  border-radius: 50%;

  background: #00e676;

  box-shadow:
    0 0 8px rgba(0,230,118,.65);

  cursor: pointer;
}

.progress::-moz-range-thumb {
  width: 16px;
  height: 16px;

  border: 0;
  border-radius: 50%;

  background: #00e676;

  cursor: pointer;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 7px;

  margin-top: 5px;
}

.control-btn {
  flex: 0 0 auto;

  width: 48px;
  height: 44px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 9px;

  background:
    rgba(20,20,20,.94);

  color: #fff;

  font-size: 19px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  outline: none;

  transition:
    background .12s,
    transform .12s,
    border-color .12s;
}

.control-btn:active {
  transform: scale(.92);
}

.control-btn:focus,
.control-btn:hover,
.control-btn.focused {
  background: #00c853;

  border-color: #00e676;
}

.seek-label {
  font-size: 9px;
  font-weight: 800;

  margin-left: -2px;
}

.time {
  flex: 1;

  min-width: 0;

  text-align: center;

  color: #ddd;

  font-size: 11px;

  white-space: nowrap;
  overflow: hidden;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .controls {
    padding-left: 9px;
    padding-right: 9px;

    padding-top: 55px;

    padding-bottom:
      max(9px, env(safe-area-inset-bottom));
  }

  .control-btn {
    width: 43px;
    height: 42px;

    border-radius: 8px;

    font-size: 17px;
  }

  .buttons {
    gap: 5px;
  }

  .seek-label {
    font-size: 8px;
  }

  .time {
    font-size: 10px;
  }

  .logo {
    font-size: 16px;
  }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 360px) {

  .control-btn {
    width: 39px;
    height: 39px;

    font-size: 15px;
  }

  .buttons {
    gap: 3px;
  }

  .time {
    font-size: 9px;
  }
}

/* =========================================================
   LANDSCAPE
========================================================= */

@media
(max-height: 500px)
and
(orientation: landscape) {

  .controls {
    padding-top: 35px;

    padding-left: 15px;
    padding-right: 15px;
  }

  .control-btn {
    width: 44px;
    height: 40px;
  }

  .progress-box {
    height: 23px;
  }

  .top-bar {
    padding-top: 8px;
  }
}

/* =========================================================
   TV
========================================================= */

@media (min-width: 900px) {

  .controls {
    padding-left: 30px;
    padding-right: 30px;
  }

  .control-btn {
    width: 62px;
    height: 54px;

    font-size: 23px;
  }

  .progress {
    height: 7px;
  }

  .logo {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div
  id="player"
  class="player"
  tabindex="0"
>

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto"
    crossorigin="anonymous"
  ></video>

  <!-- TOP -->

  <div class="top-bar">

    <div class="logo">
      HONOR TV
    </div>

  </div>

  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <div
      id="loadingText"
      class="loading-text"
    >
      Connecting...
    </div>

    <div
      id="bufferInfo"
      class="buffer-info"
    >
      Preparing movie
    </div>

  </div>

  <!-- ERROR -->

  <div
    id="error"
    class="error"
  >

    <div class="error-icon">
      ⚠️
    </div>

    <div class="error-title">
      Unable to play movie
    </div>

    <div class="error-text">
      The movie could not be loaded.
      Please check the stream or try again.
    </div>

    <button
      id="retry"
      class="retry-btn"
      type="button"
    >
      Retry
    </button>

  </div>

  <!-- CONTROLS -->

  <div
    id="controls"
    class="controls"
  >

    <div class="progress-box">

      <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Movie progress"
      >

    </div>

    <div class="buttons">

      <button
        id="rewind"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Rewind 10 seconds"
      >
        ⏪
        <span class="seek-label">10</span>
      </button>

      <button
        id="play"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Play"
      >
        ▶
      </button>

      <button
        id="forward"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Forward 10 seconds"
      >
        ⏩
        <span class="seek-label">10</span>
      </button>

      <button
        id="mute"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Mute"
      >
        🔊
      </button>

      <button
        id="fullscreen"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Fullscreen"
      >
        ⛶
      </button>

      <div
        id="time"
        class="time"
      >
        00:00 / 00:00
      </div>

    </div>

  </div>

</div>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
  document.getElementById("player");

const video =
  document.getElementById("video");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const bufferInfo =
  document.getElementById("bufferInfo");

const errorBox =
  document.getElementById("error");

const retryBtn =
  document.getElementById("retry");

const progress =
  document.getElementById("progress");

const playBtn =
  document.getElementById("play");

const rewindBtn =
  document.getElementById("rewind");

const forwardBtn =
  document.getElementById("forward");

const muteBtn =
  document.getElementById("mute");

const fullscreenBtn =
  document.getElementById("fullscreen");

const timeText =
  document.getElementById("time");


/* =========================================================
   STATE
========================================================= */

let hls = null;

let hideTimer = null;

let saveTimer = null;

let bufferTimer = null;

let seeking = false;

let currentURL = null;

let startupReady = false;

let retryCount = 0;

let lastWaitingTime = 0;


/*
 * VOD startup target.
 *
 * The player waits for actual media buffer
 * instead of using an artificial timeout.
 */
const STARTUP_BUFFER_SECONDS = 4;


/*
 * When playing normally, try to maintain
 * a healthy VOD buffer.
 */
const TARGET_BUFFER_SECONDS = 30;


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

currentURL =
  params.get("url");


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  text = "Loading...",
  info = ""
) {

  loadingText.textContent =
    text;

  bufferInfo.textContent =
    info;

  loading.classList.remove(
    "hidden"
  );
}


function hideLoading() {

  loading.classList.add(
    "hidden"
  );
}


/* =========================================================
   ERROR
========================================================= */

function showError(
  message
) {

  hideLoading();

  if (message) {

    document.querySelector(
      ".error-text"
    ).textContent =
      message;

  }

  errorBox.classList.add(
    "show"
  );
}


function hideError() {

  errorBox.classList.remove(
    "show"
  );
}


/* =========================================================
   UI
========================================================= */

function showUI() {

  player.classList.remove(
    "hide-ui"
  );

  clearTimeout(
    hideTimer
  );

  hideTimer =
    setTimeout(
      () => {

        if (
          !video.paused &&
          window.innerWidth > 600
        ) {

          player.classList.add(
            "hide-ui"
          );

        }

      },
      4500
    );
}


/* =========================================================
   HLS CLEANUP
========================================================= */

function destroyHLS() {

  if (hls) {

    try {

      hls.stopLoad();

      hls.detachMedia();

      hls.destroy();

    } catch (e) {

      console.warn(
        "HLS cleanup:",
        e
      );

    }

    hls = null;
  }
}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(
  seconds
) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {

    return "00:00";
  }

  seconds =
    Math.floor(seconds);

  const hours =
    Math.floor(
      seconds / 3600
    );

  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  const secs =
    seconds % 60;

  if (hours > 0) {

    return (
      String(hours).padStart(2,"0") +
      ":" +
      String(minutes).padStart(2,"0") +
      ":" +
      String(secs).padStart(2,"0")
    );

  }

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}


/* =========================================================
   BUFFER INFORMATION
========================================================= */

function getBufferedSeconds() {

  if (
    !video.buffered ||
    video.buffered.length === 0
  ) {

    return 0;
  }

  const current =
    video.currentTime;

  for (
    let i = 0;
    i < video.buffered.length;
    i++
  ) {

    const start =
      video.buffered.start(i);

    const end =
      video.buffered.end(i);

    if (
      current >= start &&
      current <= end
    ) {

      return Math.max(
        0,
        end - current
      );
    }
  }

  return 0;
}


function updateBufferInfo() {

  const buffered =
    getBufferedSeconds();

  if (
    !video.paused &&
    buffered > 0
  ) {

    bufferInfo.textContent =
      "Buffered " +
      Math.floor(buffered) +
      "s";

  }
}


/* =========================================================
   TIME UPDATE
========================================================= */

function updateTime() {

  const current =
    video.currentTime || 0;

  const duration =
    Number.isFinite(video.duration)
      ? video.duration
      : 0;

  timeText.textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);

  if (
    duration > 0 &&
    !seeking
  ) {

    progress.value =
      Math.min(
        100,
        Math.max(
          0,
          (current / duration) * 100
        )
      );
  }

  updateBufferInfo();
}


/* =========================================================
   PLAY BUTTON
========================================================= */

function updatePlayButton() {

  playBtn.textContent =
    video.paused
      ? "▶"
      : "⏸";
}


async function togglePlay() {

  try {

    if (video.paused) {

      await video.play();

    } else {

      video.pause();

    }

  } catch (e) {

    console.warn(
      "Play failed:",
      e
    );

  }

  showUI();
}


/* =========================================================
   SEEK
========================================================= */

function rewind() {

  if (
    !Number.isFinite(
      video.currentTime
    )
  ) {

    return;
  }

  video.currentTime =
    Math.max(
      0,
      video.currentTime - 10
    );

  showUI();
}


function forward() {

  if (
    !Number.isFinite(
      video.currentTime
    )
  ) {

    return;
  }

  if (
    Number.isFinite(
      video.duration
    )
  ) {

    video.currentTime =
      Math.min(
        video.duration,
        video.currentTime + 10
      );

  } else {

    video.currentTime += 10;
  }

  showUI();
}


/* =========================================================
   MUTE
========================================================= */

function toggleMute() {

  video.muted =
    !video.muted;

  updateMute();
}


function updateMute() {

  muteBtn.textContent =
    video.muted
      ? "🔇"
      : "🔊";
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreen() {

  try {

    if (
      !document.fullscreenElement
    ) {

      if (
        player.requestFullscreen
      ) {

        await player.requestFullscreen();

      } else if (
        video.webkitEnterFullscreen
      ) {

        video.webkitEnterFullscreen();

      }

    } else if (
      document.exitFullscreen
    ) {

      await document.exitFullscreen();
    }

  } catch (e) {

    console.warn(
      "Fullscreen:",
      e
    );
  }

}


/* =========================================================
   STORAGE
========================================================= */

function storageKey() {

  return (
    "honor_tv_movie_" +
    encodeURIComponent(
      currentURL || ""
    )
  );
}


function savePosition() {

  if (
    !currentURL ||
    !Number.isFinite(
      video.currentTime
    )
  ) {

    return;
  }

  if (
    video.currentTime < 10
  ) {

    return;
  }

  try {

    localStorage.setItem(
      storageKey(),
      String(
        video.currentTime
      )
    );

  } catch (e) {}
}


function restorePosition() {

  try {

    const saved =
      parseFloat(
        localStorage.getItem(
          storageKey()
        )
      );

    if (
      Number.isFinite(saved) &&
      saved > 10
    ) {

      if (
        !video.duration ||
        saved < video.duration - 10
      ) {

        video.currentTime =
          saved;
      }
    }

  } catch (e) {}
}


/* =========================================================
   AUTOPLAY
========================================================= */

async function startPlayback() {

  /*
   * First attempt with sound.
   */

  video.muted = false;

  updateMute();

  try {

    await video.play();

    hideLoading();

    updatePlayButton();

  } catch (e) {

    /*
     * Browser autoplay restrictions.
     */

    video.muted = true;

    updateMute();

    try {

      await video.play();

      hideLoading();

      updatePlayButton();

    } catch (err) {

      hideLoading();

      showUI();

      updatePlayButton();
    }
  }
}


/* =========================================================
   WAIT FOR REAL BUFFER
========================================================= */

function waitForStartupBuffer() {

  clearInterval(
    bufferTimer
  );

  startupReady = false;

  showLoading(
    "Preparing movie...",
    "Buffering 0s / " +
    STARTUP_BUFFER_SECONDS +
    "s"
  );

  bufferTimer =
    setInterval(
      async () => {

        const buffered =
          getBufferedSeconds();

        bufferInfo.textContent =
          "Buffering " +
          Math.floor(buffered) +
          "s / " +
          STARTUP_BUFFER_SECONDS +
          "s";

        /*
         * Start after real buffered media
         * reaches the startup target.
         */

        if (
          buffered >=
          STARTUP_BUFFER_SECONDS
        ) {

          clearInterval(
            bufferTimer
          );

          startupReady = true;

          showLoading(
            "Starting movie...",
            "Buffer ready"
          );

          await startPlayback();
        }

      },
      150
    );
}


/* =========================================================
   VOD HLS CONFIG
========================================================= */

function createHLS() {

  return new Hls({

    /*
     * Worker improves demuxing performance
     * on supported browsers.
     */
    enableWorker: true,

    /*
     * IMPORTANT:
     * This is MOVIE/VOD, not live.
     */
    lowLatencyMode: false,

    /*
     * Start automatically at an appropriate
     * quality level.
     */
    startLevel: -1,

    /*
     * Allow adaptive bitrate.
     */
    abrEwmaDefaultEstimate: 2500000,

    abrEwmaFastLive: 3.0,

    abrEwmaSlowLive: 9.0,

    abrBandWidthFactor: 0.90,

    abrBandWidthUpFactor: 0.70,

    /*
     * VOD buffering.
     *
     * 30 seconds target is useful for
     * normal movie playback.
     */
    maxBufferLength:
      TARGET_BUFFER_SECONDS,

    /*
     * Allow a larger buffer when the
     * browser/network can handle it.
     */
    maxMaxBufferLength: 90,

    /*
     * Keep enough data behind the current
     * playback position for movie seeking.
     */
    backBufferLength: 30,

    /*
     * Avoid unnecessary quality restrictions.
     */
    capLevelToPlayerSize: true,

    /*
     * Fragment retries.
     */
    fragLoadingMaxRetry: 6,

    fragLoadingRetryDelay: 1000,

    fragLoadingMaxRetryTimeout: 8000,

    /*
     * Manifest retries.
     */
    manifestLoadingMaxRetry: 5,

    manifestLoadingRetryDelay: 1000,

    manifestLoadingMaxRetryTimeout: 8000,

    /*
     * Level playlist retries.
     */
    levelLoadingMaxRetry: 5,

    levelLoadingRetryDelay: 1000,

    levelLoadingMaxRetryTimeout: 8000,

    /*
     * Request timeout.
     */
    fragLoadingTimeOut: 20000,

    manifestLoadingTimeOut: 15000,

    levelLoadingTimeOut: 15000,

    /*
     * Avoid unnecessary buffer flushing.
     */
    maxFragLookUpTolerance: 0.25,

    /*
     * VOD does not need live synchronization.
     */
    liveSyncDurationCount: 3,

    liveMaxLatencyDurationCount: 6

  });
}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(url) {

  if (!url) {

    showError(
      "No movie URL was supplied."
    );

    return;
  }

  currentURL = url;

  retryCount = 0;

  startupReady = false;

  hideError();

  showLoading(
    "Connecting...",
    "Preparing movie"
  );

  destroyHLS();

  clearInterval(
    bufferTimer
  );

  /*
   * Reset video element.
   */

  try {

    video.pause();

    video.removeAttribute(
      "src"
    );

    video.load();

  } catch (e) {}


  /*
   * Determine HLS.
   */

  const isHLS =
    /\.m3u8(?:$|\?)/i.test(
      url
    );


  /* =======================================================
     NATIVE HLS
  ======================================================= */

  if (
    isHLS &&
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    video.load();

    /*
     * Native Safari/iOS HLS.
     *
     * We cannot control its internal
     * segment buffer like HLS.js.
     */
    video.addEventListener(
      "loadedmetadata",
      function nativeReady() {

        video.removeEventListener(
          "loadedmetadata",
          nativeReady
        );

        hideLoading();

        restorePosition();

        startPlayback();
      }
    );

    return;
  }


  /* =======================================================
     HLS.JS
  ======================================================= */

  if (
    isHLS &&
    typeof Hls !== "undefined" &&
    Hls.isSupported()
  ) {

    hls =
      createHLS();

    /*
     * Attach first, then load source.
     */
    hls.attachMedia(
      video
    );

    hls.on(
      Hls.Events.MEDIA_ATTACHED,
      function () {

        hls.loadSource(
          url
        );
      }
    );


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function () {

        console.log(
          "HLS manifest parsed"
        );

        restorePosition();

        /*
         * Wait for actual media buffer.
         */
        waitForStartupBuffer();
      }
    );


    hls.on(
      Hls.Events.FRAG_BUFFERED,
      function () {

        updateBufferInfo();
      }
    );


    hls.on(
      Hls.Events.ERROR,
      function (
        event,
        data
      ) {

        console.warn(
          "HLS:",
          data.type,
          data.details,
          data.fatal
        );


        /*
         * NETWORK ERROR
         */

        if (
          data.fatal &&
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR
        ) {

          retryCount++;

          showLoading(
            "Reconnecting...",
            "Network retry " +
            retryCount
          );

          try {

            hls.startLoad();

          } catch (e) {}

          /*
           * Keep the retry mechanism from
           * looping forever.
           */
          if (
            retryCount > 8
          ) {

            showError(
              "Network error. Please try again."
            );
          }

          return;
        }


        /*
         * MEDIA ERROR
         */

        if (
          data.fatal &&
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR
        ) {

          showLoading(
            "Recovering playback...",
            "Please wait"
          );

          try {

            hls.recoverMediaError();

          } catch (e) {

            showError(
              "The movie format could not be decoded."
            );
          }

          return;
        }


        /*
         * OTHER FATAL ERROR
         */

        if (
          data.fatal
        ) {

          showError(
            "The movie stream could not be loaded."
          );
        }

      }
    );


    return;
  }


  /* =======================================================
     NORMAL VIDEO / MP4
  ======================================================= */

  video.src = url;

  video.load();

  video.addEventListener(
    "loadedmetadata",
    function normalReady() {

      video.removeEventListener(
        "loadedmetadata",
        normalReady
      );

      restorePosition();

      hideLoading();

      startPlayback();

    }
  );
}


/* =========================================================
   RETRY
========================================================= */

function retryPlayback() {

  hideError();

  clearInterval(
    bufferTimer
  );

  destroyHLS();

  /*
   * Small reset only.
   */
  try {

    video.pause();

    video.removeAttribute(
      "src"
    );

    video.load();

  } catch (e) {}

  setTimeout(
    () => {

      loadVideo(
        currentURL
      );

    },
    250
  );
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

playBtn.addEventListener(
  "click",
  togglePlay
);

rewindBtn.addEventListener(
  "click",
  rewind
);

forwardBtn.addEventListener(
  "click",
  forward
);

muteBtn.addEventListener(
  "click",
  toggleMute
);

fullscreenBtn.addEventListener(
  "click",
  fullscreen
);

retryBtn.addEventListener(
  "click",
  retryPlayback
);


/* =========================================================
   PROGRESS
========================================================= */

progress.addEventListener(
  "input",
  function () {

    seeking = true;

    if (
      Number.isFinite(
        video.duration
      ) &&
      video.duration > 0
    ) {

      video.currentTime =
        (
          Number(progress.value) /
          100
        ) *
        video.duration;
    }

    updateTime();
  }
);


progress.addEventListener(
  "change",
  function () {

    seeking = false;

    showUI();
  }
);


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "loadstart",
  function () {

    showLoading(
      "Loading...",
      "Preparing movie"
    );
  }
);


video.addEventListener(
  "loadedmetadata",
  function () {

    updateTime();

    /*
     * Only restore here if it hasn't
     * already been restored by HLS.
     */
    if (!hls) {

      restorePosition();
    }
  }
);


video.addEventListener(
  "waiting",
  function () {

    const now =
      Date.now();

    /*
     * Prevent the loading overlay from
     * constantly flashing during tiny stalls.
     */
    if (
      now - lastWaitingTime < 500
    ) {

      return;
    }

    lastWaitingTime = now;

    showLoading(
      "Buffering...",
      "Building movie buffer"
    );
  }
);


video.addEventListener(
  "stalled",
  function () {

    if (
      !video.paused
    ) {

      showLoading(
        "Buffering...",
        "Waiting for network"
      );
    }
  }
);


video.addEventListener(
  "canplay",
  function () {

    /*
     * Do not hide immediately during
     * startup until our target buffer
     * has been reached.
     */

    if (
      startupReady ||
      !hls
    ) {

      hideLoading();
    }
  }
);


video.addEventListener(
  "playing",
  function () {

    hideLoading();

    updatePlayButton();

    showUI();
  }
);


video.addEventListener(
  "play",
  function () {

    updatePlayButton();
  }
);


video.addEventListener(
  "pause",
  function () {

    updatePlayButton();

    showUI();
  }
);


video.addEventListener(
  "timeupdate",
  function () {

    updateTime();
  }
);


video.addEventListener(
  "progress",
  function () {

    updateBufferInfo();
  }
);


video.addEventListener(
  "ended",
  function () {

    updatePlayButton();

    showUI();

    try {

      localStorage.removeItem(
        storageKey()
      );

    } catch (e) {}
  }
);


video.addEventListener(
  "error",
  function () {

    /*
     * Don't immediately show an error
     * if HLS.js is handling recovery.
     */
    if (
      hls &&
      hls.media
    ) {

      return;
    }

    showError(
      "The movie could not be played. Please check the stream."
    );
  }
);


/* =========================================================
   TOUCH
========================================================= */

player.addEventListener(
  "click",
  function (event) {

    if (
      event.target === video
    ) {

      showUI();
    }
  }
);


player.addEventListener(
  "touchstart",
  function () {

    showUI();

  },
  {
    passive: true
  }
);


/* =========================================================
   TV / KEYBOARD REMOTE
========================================================= */

document.addEventListener(
  "keydown",
  function (event) {

    const key =
      event.key;

    const code =
      event.keyCode;


    /*
     * PLAY / PAUSE
     */

    if (
      key === " " ||
      key === "Enter" ||
      code === 13 ||
      code === 32
    ) {

      if (
        document.activeElement !==
        progress
      ) {

        event.preventDefault();

        togglePlay();
      }

      return;
    }


    /*
     * REWIND
     */

    if (
      key === "ArrowLeft" ||
      code === 37
    ) {

      event.preventDefault();

      rewind();

      return;
    }


    /*
     * FORWARD
     */

    if (
      key === "ArrowRight" ||
      code === 39
    ) {

      event.preventDefault();

      forward();

      return;
    }


    /*
     * UP
     */

    if (
      key === "ArrowUp" ||
      code === 38
    ) {

      event.preventDefault();

      showUI();

      return;
    }


    /*
     * DOWN
     */

    if (
      key === "ArrowDown" ||
      code === 40
    ) {

      event.preventDefault();

      showUI();

      return;
    }


    /*
     * MUTE
     */

    if (
      key.toLowerCase() === "m"
    ) {

      event.preventDefault();

      toggleMute();

      return;
    }


    /*
     * FULLSCREEN
     */

    if (
      key.toLowerCase() === "f"
    ) {

      event.preventDefault();

      fullscreen();

      return;
    }


    /*
     * RETRY
     */

    if (
      key.toLowerCase() === "r"
    ) {

      event.preventDefault();

      retryPlayback();

      return;
    }


    /*
     * ESC
     */

    if (
      key === "Escape" ||
      code === 27
    ) {

      showUI();

      return;
    }

  }
);


/* =========================================================
   POSITION SAVING
========================================================= */

saveTimer =
  setInterval(
    savePosition,
    5000
  );


document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.hidden
    ) {

      savePosition();
    }
  }
);


window.addEventListener(
  "beforeunload",
  function () {

    savePosition();

    clearInterval(
      saveTimer
    );

    clearInterval(
      bufferTimer
    );

    destroyHLS();
  }
);


/* =========================================================
   INITIALIZATION
========================================================= */

video.muted = false;

updateMute();

updatePlayButton();


if (
  currentURL
) {

  loadVideo(
    currentURL
  );

} else {

  showError(
    "No movie URL was supplied. Use ?url=YOUR_MOVIE_URL"
  );
}


/* =========================================================
   PERIODIC BUFFER MONITOR
========================================================= */

setInterval(
  function () {

    if (
      !video.paused
    ) {

      const buffered =
        getBufferedSeconds();

      /*
       * If buffer becomes very low,
       * display a useful status.
       */
      if (
        buffered > 0 &&
        buffered < 2
      ) {

        bufferInfo.textContent =
          "Low buffer: " +
          Math.floor(buffered) +
          "s";

      }

    }

  },
  1000
);

</script>

</body>
</html>
