<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Optimized HLS Player</title>

  <link
    href="https://vjs.zencdn.net/8.10.0/video-js.css"
    rel="stylesheet"
  />

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .video-js {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

<div class="wrap">
  <video
    id="video"
    class="video-js vjs-default-skin"
    controls
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const src = params.get("url");

if (!src) {
  document.body.innerHTML =
    "<h2 style='color:white;text-align:center'>Missing ?url=</h2>";
  throw new Error("Missing stream URL");
}

const video = document.getElementById("video");

const player = videojs(video, {
  controls: true,
  autoplay: true,
  muted: true,
  preload: "auto",
  fluid: true,
  liveui: true
});

// ========================================
// FIX URL
// ========================================
let streamUrl = src;

// auto encode if needed
if (!streamUrl.includes("%")) {
  streamUrl = encodeURI(streamUrl);
}

// ========================================
// LOAD HLS
// ========================================
function startPlayer(url) {

  // Destroy previous instance
  if (window.hls) {
    window.hls.destroy();
  }

  // ========================================
  // HLS.JS
  // ========================================
  if (Hls.isSupported()) {

    const hls = new Hls({
      debug: false,

      enableWorker: true,
      lowLatencyMode: true,

      backBufferLength: 90,
      maxBufferLength: 30,
      maxMaxBufferLength: 120,

      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,

      fragLoadingTimeOut: 20000,
      manifestLoadingTimeOut: 20000,
      levelLoadingTimeOut: 20000,

      fragLoadingMaxRetry: 6,
      manifestLoadingMaxRetry: 6,
      levelLoadingMaxRetry: 6
    });

    window.hls = hls;

    // ========================================
    // IMPORTANT
    // Browser cannot spoof Referer/Origin reliably.
    // Proxy must handle headers server-side.
    // ========================================
    hls.config.xhrSetup = function(xhr) {
      xhr.withCredentials = false;
    };

    // ========================================
    // LOAD STREAM
    // ========================================
    hls.loadSource(url);
    hls.attachMedia(video);

    // ========================================
    // PLAY WHEN READY
    // ========================================
    hls.on(Hls.Events.MANIFEST_PARSED, async () => {
      try {
        await video.play();
      } catch (e) {
        console.log("Autoplay blocked:", e);
      }
    });

    // ========================================
    // AUTO RECOVERY
    // ========================================
    hls.on(Hls.Events.ERROR, function(event, data) {

      console.log("HLS Error:", data);

      if (!data.fatal) return;

      switch (data.type) {

        case Hls.ErrorTypes.NETWORK_ERROR:
          console.log("Network error → retrying...");
          hls.startLoad();
          break;

        case Hls.ErrorTypes.MEDIA_ERROR:
          console.log("Media error → recovering...");
          hls.recoverMediaError();
          break;

        default:
          console.log("Fatal error → rebuilding player...");
          hls.destroy();

          setTimeout(() => {
            startPlayer(url);
          }, 2000);

          break;
      }
    });

  }

  // ========================================
  // SAFARI / IOS NATIVE HLS
  // ========================================
  else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

    video.addEventListener("loadedmetadata", async () => {
      try {
        await video.play();
      } catch (e) {
        console.log("Native autoplay blocked:", e);
      }
    });
  }

  // ========================================
  // UNSUPPORTED
  // ========================================
  else {
    alert("HLS not supported in this browser.");
  }
}

// ========================================
// START
// ========================================
startPlayer(streamUrl);
</script>

</body>
</html>
