<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAFLIX Player</title>

  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
    }

    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div class="wrap">
  <video id="video" class="video-js vjs-default-skin" controls autoplay></video>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const src = urlParams.get("url"); // ✅ FIXED

const video = document.getElementById("video");
const player = videojs(video);

if (!src) {
  alert("No stream URL provided (?url=...)");
}

function loadStream(url) {
  if (Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      player.play();
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      console.error("HLS error:", data);

      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          hls.destroy();
        }
      }
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("loadedmetadata", () => player.play());
  } else {
    alert("HLS not supported");
  }
}

loadStream(src);
</script>

</body>
</html>
