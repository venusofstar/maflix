<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no,
  viewport-fit=cover"
>

<meta name="theme-color" content="#00c853">

<title>HONOR TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* =========================================================
   PLAYER
========================================================= */

.player {
  position: relative;

  width: 100%;
  height: 100dvh;

  min-height: 100svh;

  background: #000;

  overflow: hidden;

  outline: none;
}


/* =========================================================
   VIDEO
========================================================= */

video {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  object-fit: contain;

  object-position: center center;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  z-index: 10;

  padding:
    max(12px, env(safe-area-inset-top))
    15px
    18px;

  background:
    linear-gradient(
      rgba(0,0,0,.75),
      transparent
    );

  pointer-events: none;

  opacity: 1;

  transition: opacity .25s ease;
}

.player.hide-ui .top-bar {
  opacity: 0;
}

.logo {
  color: #00e676;

  font-size: 18px;

  font-weight: 800;

  letter-spacing: .5px;

  text-shadow:
    0 2px 8px #000;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
  position: absolute;

  inset: 0;

  z-index: 30;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background: rgba(0,0,0,.45);

  transition:
    opacity .2s ease;
}

.loading.hidden {
  opacity: 0;

  pointer-events: none;
}

.spinner {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  border:
    4px solid
    rgba(255,255,255,.22);

  border-top-color: #00e676;

  animation:
    spin .65s linear infinite;
}

.loading-text {
  margin-top: 12px;

  color: #fff;

  font-size: 14px;

  font-weight: 600;

  text-shadow:
    0 2px 5px #000;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================================================
   ERROR
========================================================= */

.error {
  position: absolute;

  inset: 0;

  z-index: 40;

  display: none;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 25px;

  background: #000;
}

.error.show {
  display: flex;
}

.error-icon {
  font-size: 45px;

  margin-bottom: 12px;
}

.error-title {
  font-size: 20px;

  font-weight: 700;

  color: #fff;

  margin-bottom: 7px;
}

.error-text {
  max-width: 360px;

  color: #aaa;

  font-size: 13px;

  line-height: 1.5;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 20;

  padding:
    65px
    12px
    max(12px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.94)
    );

  opacity: 1;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.player.hide-ui .controls {
  opacity: 0;

  pointer-events: none;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-box {
  width: 100%;

  height: 30px;

  display: flex;

  align-items: center;
}

.progress {
  width: 100%;

  height: 5px;

  appearance: none;

  border: 0;

  border-radius: 20px;

  outline: none;

  background:
    rgba(255,255,255,.35);

  cursor: pointer;
}

.progress::-webkit-slider-thumb {
  appearance: none;

  width: 16px;
  height: 16px;

  border: 0;

  border-radius: 50%;

  background: #00e676;

  box-shadow:
    0 0 8px
    rgba(0,230,118,.6);

  cursor: pointer;
}

.progress::-moz-range-thumb {
  width: 16px;
  height: 16px;

  border: 0;

  border-radius: 50%;

  background: #00e676;

  cursor: pointer;
}


/* =========================================================
   BUTTON ROW
========================================================= */

.buttons {
  display: flex;

  align-items: center;

  width: 100%;

  gap: 7px;

  margin-top: 5px;
}

.control-btn {
  flex: 0 0 auto;

  width: 48px;
  height: 44px;

  border: 1px solid
    rgba(255,255,255,.12);

  border-radius: 9px;

  background:
    rgba(20,20,20,.92);

  color: #fff;

  font-size: 19px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  outline: none;

  transition:
    background .15s,
    transform .15s,
    border-color .15s;
}

.control-btn:active {
  transform: scale(.92);
}

.control-btn:focus,
.control-btn:hover,
.control-btn.focused {
  background: #00c853;

  border-color: #00e676;

  color: #fff;

  outline: none;
}

.seek-label {
  font-size: 9px;

  font-weight: 800;

  margin-left: -2px;
}


/* =========================================================
   TIME
========================================================= */

.time {
  flex: 1;

  min-width: 0;

  text-align: center;

  color: #ddd;

  font-size: 11px;

  white-space: nowrap;

  overflow: hidden;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .player {
    height: 100dvh;

    min-height: 100svh;
  }

  .controls {
    padding-left: 9px;
    padding-right: 9px;

    padding-bottom:
      max(9px, env(safe-area-inset-bottom));

    padding-top: 55px;
  }

  .control-btn {
    width: 43px;
    height: 42px;

    border-radius: 8px;

    font-size: 17px;
  }

  .seek-label {
    font-size: 8px;
  }

  .buttons {
    gap: 5px;
  }

  .time {
    font-size: 10px;
  }

  .logo {
    font-size: 16px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 360px) {

  .control-btn {
    width: 39px;
    height: 39px;

    font-size: 15px;
  }

  .buttons {
    gap: 3px;
  }

  .time {
    font-size: 9px;
  }

}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (
  max-height: 500px
) and (
  orientation: landscape
) {

  .controls {
    padding-top: 35px;

    padding-left: 15px;
    padding-right: 15px;
  }

  .control-btn {
    width: 44px;
    height: 40px;
  }

  .progress-box {
    height: 23px;
  }

  .top-bar {
    padding-top: 8px;
  }

}


/* =========================================================
   TV / LARGE DISPLAY
========================================================= */

@media (min-width: 900px) {

  .controls {
    padding-left: 30px;
    padding-right: 30px;
  }

  .control-btn {
    width: 62px;
    height: 54px;

    font-size: 23px;
  }

  .progress {
    height: 7px;
  }

  .logo {
    font-size: 22px;
  }

}

</style>
</head>


<body>

<div
  id="player"
  class="player"
  tabindex="0"
>

  <!-- VIDEO -->

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto"
    crossorigin="anonymous"
  ></video>


  <!-- TOP -->

  <div class="top-bar">

    <div class="logo">
      HONOR TV
    </div>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <div
      id="loadingText"
      class="loading-text"
    >
      Loading...
    </div>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error"
  >

    <div class="error-icon">
      ⚠️
    </div>

    <div class="error-title">
      Unable to play video
    </div>

    <div class="error-text">
      The video could not be loaded.
      Please check the stream or try again.
    </div>

  </div>


  <!-- CONTROLS -->

  <div
    id="controls"
    class="controls"
  >

    <!-- PROGRESS -->

    <div class="progress-box">

      <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Video progress"
      >

    </div>


    <!-- BUTTONS -->

    <div class="buttons">


      <!-- REWIND -->

      <button
        id="rewind"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Rewind 10 seconds"
      >

        ⏪

        <span
          class="seek-label"
        >
          10
        </span>

      </button>


      <!-- PLAY -->

      <button
        id="play"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Play"
      >
        ▶
      </button>


      <!-- FORWARD -->

      <button
        id="forward"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Forward 10 seconds"
      >

        ⏩

        <span
          class="seek-label"
        >
          10
        </span>

      </button>


      <!-- MUTE -->

      <button
        id="mute"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Mute"
      >
        🔊
      </button>


      <!-- FULLSCREEN -->

      <button
        id="fullscreen"
        class="control-btn"
        type="button"
        tabindex="0"
        aria-label="Fullscreen"
      >
        ⛶
      </button>


      <!-- TIME -->

      <div
        id="time"
        class="time"
      >
        00:00 / 00:00
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
  document.getElementById("player");

const video =
  document.getElementById("video");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const errorBox =
  document.getElementById("error");

const progress =
  document.getElementById("progress");

const playBtn =
  document.getElementById("play");

const rewindBtn =
  document.getElementById("rewind");

const forwardBtn =
  document.getElementById("forward");

const muteBtn =
  document.getElementById("mute");

const fullscreenBtn =
  document.getElementById("fullscreen");

const timeText =
  document.getElementById("time");


let hls = null;

let hideTimer = null;

let seeking = false;

let currentURL = null;


/* =========================================================
   GET URL

   player.html?url=STREAM_URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

currentURL =
  params.get("url");


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  text = "Loading..."
) {

  loadingText.textContent = text;

  loading.classList.remove(
    "hidden"
  );

}

function hideLoading() {

  loading.classList.add(
    "hidden"
  );

}


/* =========================================================
   ERROR
========================================================= */

function showError() {

  hideLoading();

  errorBox.classList.add(
    "show"
  );

}

function hideError() {

  errorBox.classList.remove(
    "show"
  );

}


/* =========================================================
   UI
========================================================= */

function showUI() {

  player.classList.remove(
    "hide-ui"
  );

  clearTimeout(
    hideTimer
  );

  hideTimer =
    setTimeout(
      function () {

        if (
          !video.paused &&
          window.innerWidth > 600
        ) {

          player.classList.add(
            "hide-ui"
          );

        }

      },
      4500
    );

}


/* =========================================================
   HLS CLEANUP
========================================================= */

function destroyHLS() {

  if (hls) {

    try {
      hls.destroy();
    } catch (e) {}

    hls = null;

  }

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
  seconds
) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {

    return "00:00";

  }

  seconds =
    Math.floor(seconds);

  const hours =
    Math.floor(
      seconds / 3600
    );

  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  const secs =
    seconds % 60;


  if (hours > 0) {

    return (
      String(hours)
        .padStart(2, "0") +
      ":" +
      String(minutes)
        .padStart(2, "0") +
      ":" +
      String(secs)
        .padStart(2, "0")
    );

  }


  return (
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(secs)
      .padStart(2, "0")
  );

}


/* =========================================================
   TIME
========================================================= */

function updateTime() {

  const current =
    video.currentTime || 0;

  const duration =
    video.duration || 0;


  timeText.textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);


  if (
    duration &&
    !seeking
  ) {

    progress.value =
      (
        current /
        duration
      ) * 100;

  }

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

  if (
    video.paused
  ) {

    video.play()
      .catch(() => {});

  } else {

    video.pause();

  }

  showUI();

}


/* =========================================================
   REWIND
========================================================= */

function rewind() {

  video.currentTime =
    Math.max(
      0,
      video.currentTime - 10
    );

  showUI();

}


/* =========================================================
   FORWARD
========================================================= */

function forward() {

  if (
    Number.isFinite(
      video.duration
    )
  ) {

    video.currentTime =
      Math.min(
        video.duration,
        video.currentTime + 10
      );

  } else {

    video.currentTime += 10;

  }

  showUI();

}


/* =========================================================
   MUTE
========================================================= */

function toggleMute() {

  video.muted =
    !video.muted;

  updateMute();

}


function updateMute() {

  muteBtn.textContent =
    video.muted
      ? "🔇"
      : "🔊";

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreen() {

  try {

    if (
      !document.fullscreenElement
    ) {

      if (
        player.requestFullscreen
      ) {

        await player.requestFullscreen();

      } else if (
        video.webkitEnterFullscreen
      ) {

        video.webkitEnterFullscreen();

      }

    } else {

      if (
        document.exitFullscreen
      ) {

        await document.exitFullscreen();

      }

    }

  } catch (e) {

    console.error(e);

  }

}


/* =========================================================
   STORAGE KEY
========================================================= */

function storageKey() {

  return (
    "honor_tv_" +
    encodeURIComponent(
      currentURL || ""
    )
  );

}


/* =========================================================
   SAVE POSITION
========================================================= */

function savePosition() {

  if (
    !currentURL ||
    !Number.isFinite(
      video.currentTime
    )
  ) {

    return;

  }

  if (
    video.currentTime < 10
  ) {

    return;

  }

  try {

    localStorage.setItem(
      storageKey(),
      String(
        video.currentTime
      )
    );

  } catch (e) {}

}


/* =========================================================
   RESTORE POSITION
========================================================= */

function restorePosition() {

  try {

    const saved =
      parseFloat(
        localStorage.getItem(
          storageKey()
        )
      );


    if (
      Number.isFinite(saved) &&
      saved > 10 &&
      (
        !video.duration ||
        saved < video.duration - 10
      )
    ) {

      video.currentTime =
        saved;

    }

  } catch (e) {}

}


/* =========================================================
   START VIDEO
========================================================= */

function startPlayback() {

  /*
   * First attempt autoplay with sound.
   */

  video.muted = false;

  updateMute();


  video.play()
    .then(() => {

      hideLoading();

      updatePlayButton();

    })
    .catch(() => {

      /*
       * Browser autoplay policy fallback.
       */

      video.muted = true;

      updateMute();


      video.play()
        .then(() => {

          hideLoading();

          updatePlayButton();

        })
        .catch(() => {

          hideLoading();

          showUI();

          updatePlayButton();

        });

    });

}


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(url) {

  if (!url) {

    showError();

    return;

  }


  hideError();

  showLoading(
    "Connecting..."
  );


  destroyHLS();


  video.pause();

  video.removeAttribute(
    "src"
  );

  video.load();


  /*
   * HLS detection.
   */

  const isHLS =
    /\.m3u8($|\?)/i.test(url);


  /* =======================================================
     NATIVE HLS
  ======================================================= */

  if (
    isHLS &&
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    video.load();

    startPlayback();

    return;

  }


  /* =======================================================
     HLS.JS
  ======================================================= */

  if (
    isHLS &&
    typeof Hls !== "undefined" &&
    Hls.isSupported()
  ) {

    hls =
      new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 60,

        maxBufferLength: 20,

        maxMaxBufferLength: 40,

        startLevel: -1,

        capLevelToPlayerSize: true,

        fragLoadingMaxRetry: 3,

        manifestLoadingMaxRetry: 3,

        levelLoadingMaxRetry: 3

      });


    hls.loadSource(url);

    hls.attachMedia(video);


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function () {

        hideLoading();

        startPlayback();

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function (
        event,
        data
      ) {

        console.error(
          "HLS error:",
          data
        );


        if (
          data.fatal
        ) {

          if (
            data.type ===
            Hls.ErrorTypes.NETWORK_ERROR
          ) {

            showLoading(
              "Reconnecting..."
            );

            hls.startLoad();

          }

          else if (
            data.type ===
            Hls.ErrorTypes.MEDIA_ERROR
          ) {

            hls.recoverMediaError();

          }

          else {

            showError();

          }

        }

      }
    );


    return;

  }


  /* =======================================================
     MP4 / NORMAL VIDEO
  ======================================================= */

  video.src = url;

  video.load();

  startPlayback();

}


/* =========================================================
   PLAY BUTTON
========================================================= */

function updatePlayButton() {

  playBtn.textContent =
    video.paused
      ? "▶"
      : "⏸";

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

playBtn.addEventListener(
  "click",
  togglePlay
);

rewindBtn.addEventListener(
  "click",
  rewind
);

forwardBtn.addEventListener(
  "click",
  forward
);

muteBtn.addEventListener(
  "click",
  toggleMute
);

fullscreenBtn.addEventListener(
  "click",
  fullscreen
);


/* =========================================================
   PROGRESS
========================================================= */

progress.addEventListener(
  "input",
  function () {

    seeking = true;


    if (
      video.duration
    ) {

      video.currentTime =
        (
          progress.value /
          100
        ) *
        video.duration;

    }


    updateTime();

  }
);


progress.addEventListener(
  "change",
  function () {

    seeking = false;

  }
);


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "loadstart",
  function () {

    showLoading(
      "Loading..."
    );

  }
);


video.addEventListener(
  "waiting",
  function () {

    showLoading(
      "Buffering..."
    );

  }
);


video.addEventListener(
  "stalled",
  function () {

    showLoading(
      "Buffering..."
    );

  }
);


video.addEventListener(
  "canplay",
  function () {

    hideLoading();

  }
);


video.addEventListener(
  "playing",
  function () {

    hideLoading();

    updatePlayButton();

  }
);


video.addEventListener(
  "play",
  function () {

    hideLoading();

    updatePlayButton();

  }
);


video.addEventListener(
  "pause",
  function () {

    updatePlayButton();

    showUI();

  }
);


video.addEventListener(
  "timeupdate",
  function () {

    updateTime();

  }
);


video.addEventListener(
  "loadedmetadata",
  function () {

    updateTime();

    restorePosition();

  }
);


video.addEventListener(
  "ended",
  function () {

    updatePlayButton();

    showUI();

    try {

      localStorage.removeItem(
        storageKey()
      );

    } catch (e) {}

  }
);


video.addEventListener(
  "error",
  function () {

    showError();

  }
);


/* =========================================================
   TOUCH
========================================================= */

player.addEventListener(
  "click",
  function (event) {

    /*
     * Don't toggle when clicking controls.
     */

    if (
      event.target === video
    ) {

      showUI();

    }

  }
);


player.addEventListener(
  "touchstart",
  function () {

    showUI();

  },
  {
    passive: true
  }
);


/* =========================================================
   TV / KEYBOARD REMOTE
========================================================= */

document.addEventListener(
  "keydown",
  function (event) {

    const key =
      event.key;

    const code =
      event.keyCode;


    /* PLAY / PAUSE */

    if (
      key === " " ||
      key === "Enter" ||
      code === 13 ||
      code === 32
    ) {

      if (
        document.activeElement !==
        progress
      ) {

        event.preventDefault();

        togglePlay();

      }

      return;

    }


    /* REWIND */

    if (
      key === "ArrowLeft" ||
      code === 37
    ) {

      event.preventDefault();

      rewind();

      return;

    }


    /* FORWARD */

    if (
      key === "ArrowRight" ||
      code === 39
    ) {

      event.preventDefault();

      forward();

      return;

    }


    /* UP */

    if (
      key === "ArrowUp" ||
      code === 38
    ) {

      event.preventDefault();

      showUI();

      return;

    }


    /* DOWN */

    if (
      key === "ArrowDown" ||
      code === 40
    ) {

      event.preventDefault();

      showUI();

      return;

    }


    /* MUTE */

    if (
      key.toLowerCase() === "m"
    ) {

      event.preventDefault();

      toggleMute();

      return;

    }


    /* FULLSCREEN */

    if (
      key.toLowerCase() === "f"
    ) {

      event.preventDefault();

      fullscreen();

      return;

    }


    /* ESC */

    if (
      key === "Escape" ||
      code === 27
    ) {

      showUI();

      return;

    }

  }
);


/* =========================================================
   SAVE POSITION
========================================================= */

setInterval(
  savePosition,
  5000
);


document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.hidden
    ) {

      savePosition();

    }

  }
);


window.addEventListener(
  "beforeunload",
  function () {

    savePosition();

    destroyHLS();

  }
);


/* =========================================================
   INITIAL
========================================================= */

video.muted = false;

updateMute();

updatePlayButton();


if (currentURL) {

  loadVideo(
    currentURL
  );

} else {

  showError();

}

</script>
