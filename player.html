<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1"
/>

<title>MAFLIX Player</title>

<meta name="theme-color" content="#0b0f1a" />

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

#player-container{
  position:relative;
  width:100%;
  height:100vh;
  background:#000;
}

video{
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:14px;
  z-index:20;
  background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#00bfff;
  letter-spacing:1px;
}

.status{
  font-size:14px;
  color:#fff;
  background:rgba(0,0,0,.5);
  padding:6px 12px;
  border-radius:20px;
}

.center-loader{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  color:#fff;
}

.spinner{
  width:55px;
  height:55px;
  border:5px solid rgba(255,255,255,.2);
  border-top:5px solid #00bfff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.bottom-controls{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:15px;
  z-index:25;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  border:none;
  outline:none;
  background:#00bfff;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  opacity:.85;
}

.error-box{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:15px;
  color:#fff;
  background:#000;
  z-index:40;
  text-align:center;
  padding:20px;
}

.error-box h2{
  color:#ff4b4b;
}

@media(max-width:768px){

  .logo{
    font-size:20px;
  }

  button{
    width:48%;
    font-size:14px;
    padding:11px;
  }

}

@media(min-width:1200px){

  button{
    font-size:16px;
  }

}
</style>
</head>
<body>

<div id="player-container">

  <div class="topbar">
    <div class="logo">MAFLIX</div>
    <div class="status" id="status">Loading...</div>
  </div>

  <video
    id="video"
    controls
    autoplay
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

  <div class="center-loader" id="loader">
    <div class="spinner"></div>
    <div>Loading Stream...</div>
  </div>

  <div class="bottom-controls">

    <button onclick="togglePlay()">Play / Pause</button>

    <button onclick="goFullscreen()">Fullscreen</button>

    <button onclick="reloadVideo()">Reload</button>

    <button onclick="skipForward()">+10s</button>

    <button onclick="skipBack()">-10s</button>

  </div>

  <div class="error-box" id="errorBox">
    <h2>Playback Error</h2>
    <p>This stream cannot be played.</p>
    <button onclick="reloadVideo()">Retry</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById('video');
const loader = document.getElementById('loader');
const statusText = document.getElementById('status');
const errorBox = document.getElementById('errorBox');

/*
=========================================
MAIN M3U8 STREAM
=========================================
*/

const videoSrc =
'https://hls03.cdnvideo11.shop/Devils-Stay.2024Ep1.m3u8?v=fmg3xvzlkpw';

/*
=========================================
LOAD PLAYER
=========================================
*/

function initPlayer(){

  loader.style.display = 'flex';
  errorBox.style.display = 'none';

  if(Hls.isSupported()){

    const hls = new Hls({
      maxBufferLength: 30,
      enableWorker: true,
      lowLatencyMode: true,
    });

    hls.loadSource(videoSrc);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {

      video.play();

      statusText.innerHTML = 'Playing';

      loader.style.display = 'none';

    });

    hls.on(Hls.Events.ERROR, function(event, data){

      console.log(data);

      if(data.fatal){

        errorBox.style.display = 'flex';

        loader.style.display = 'none';

        statusText.innerHTML = 'Error';

      }

    });

  }

  else if(video.canPlayType('application/vnd.apple.mpegurl')){

    video.src = videoSrc;

    video.addEventListener('loadedmetadata', function(){

      video.play();

      loader.style.display = 'none';

      statusText.innerHTML = 'Playing';

    });

  }

  else{

    alert('HLS is not supported on this browser.');

  }

}

/*
=========================================
VIDEO EVENTS
=========================================
*/

video.addEventListener('waiting', () => {
  loader.style.display = 'flex';
  statusText.innerHTML = 'Buffering...';
});

video.addEventListener('playing', () => {
  loader.style.display = 'none';
  statusText.innerHTML = 'Playing';
});

video.addEventListener('pause', () => {
  statusText.innerHTML = 'Paused';
});

video.addEventListener('ended', () => {
  statusText.innerHTML = 'Finished';
});

/*
=========================================
CONTROLS
=========================================
*/

function togglePlay(){

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}

function reloadVideo(){

  location.reload();

}

function skipForward(){

  video.currentTime += 10;

}

function skipBack(){

  video.currentTime -= 10;

}

function goFullscreen(){

  if(video.requestFullscreen){

    video.requestFullscreen();

  }else if(video.webkitRequestFullscreen){

    video.webkitRequestFullscreen();

  }else if(video.msRequestFullscreen){

    video.msRequestFullscreen();

  }

}

/*
=========================================
START PLAYER
=========================================
*/

initPlayer();

</script>

</body>
</html>
