<!-- player.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Player (JW Player)</title>

  <!-- JW Player CDN -->
  <script src="https://cdn.jwplayer.com/libraries/ID_YOUR_JW_PLAYER"></script>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #player {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
    }
  </style>
</head>
<body>

<div id="player"></div>

<script>
const urlParams = new URLSearchParams(location.search);
const src = urlParams.get("src");

if (src) {
  jwplayer("player").setup({
    file: src,
    type: "hls",
    width: "100%",
    aspectratio: "16:9",
    autostart: true,
    controls: true
  });
}
</script>

</body>
</html>
