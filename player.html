<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker HLS Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #status {
      position: absolute;
      color: white;
      font-family: sans-serif;
      top: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div id="status">Loading...</div>
<video id="video" controls autoplay muted playsinline></video>

<script>
const params = new URLSearchParams(location.search);
const src = params.get("url");

const video = document.getElementById("video");
const status = document.getElementById("status");

if (!src) {
  status.innerText = "Missing ?url=";
  throw new Error("Missing URL");
}

// 🔥 IMPORTANT: your worker already handles everything
const proxyUrl = decodeURIComponent(src);

let hls;

function setStatus(text) {
  console.log(text);
  status.innerText = text;
}

function startPlayer(url) {

  if (hls) hls.destroy();

  if (Hls.isSupported()) {

    hls = new Hls({
      enableWorker: true,

      // important for TS streaming stability
      lowLatencyMode: true,
      backBufferLength: 60,

      maxBufferLength: 30,
      maxMaxBufferLength: 120,

      fragLoadingMaxRetry: 8,
      manifestLoadingMaxRetry: 8,
      levelLoadingMaxRetry: 8,

      fragLoadingTimeOut: 20000,
      manifestLoadingTimeOut: 20000
    });

    window.hls = hls;

    // ⚠️ DO NOT set headers here (browser limitation)
    // Worker already handles Referer/Origin

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus("Playing...");
      video.play().catch(() => {
        setStatus("Click play");
      });
    });

    // 🔥 AUTO RECOVERY (important for TS segments)
    hls.on(Hls.Events.ERROR, (event, data) => {

      console.log("HLS ERROR:", data);

      if (!data.fatal) return;

      switch (data.type) {

        case Hls.ErrorTypes.NETWORK_ERROR:
          setStatus("Network error → retrying TS...");
          hls.startLoad();
          break;

        case Hls.ErrorTypes.MEDIA_ERROR:
          setStatus("Media error → recovering...");
          hls.recoverMediaError();
          break;

        default:
          setStatus("Restarting stream...");
          hls.destroy();
          setTimeout(() => startPlayer(url), 2000);
          break;
      }
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

    video.addEventListener("loadedmetadata", () => {
      video.play().catch(() => setStatus("Tap play"));
    });

  } else {
    setStatus("HLS not supported");
  }
}

startPlayer(proxyUrl);
</script>

</body>
</html>
