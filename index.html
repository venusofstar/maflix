<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFLIX Ultimate Player</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
</head>

<body>

<h1 id="appTitle">MAFLIX</h1>

<div id="searchContainer">
  <input type="text" id="searchInput" placeholder="Search channels...">
</div>

<div id="channelSections"></div>

<div id="videoContainer">
  <div id="spinner"></div>
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
  <button id="closeBtn">✕</button>
</div>

  <script>
async function blockIfSuspicious() {

  let blocked = false;
  let reason = "";

  /* ----------------------------
     1. Detect Android WebView
     (most HttpCanary users use WebView based players)
  ----------------------------- */
  const ua = navigator.userAgent.toLowerCase();

  const isAndroid = ua.includes("android");
  const isWebView = ua.includes("wv") || ua.includes("version/");

  if (isAndroid && isWebView) {
    blocked = true;
    reason = "WebView environment detected";
  }

  /* ----------------------------
     2. Detect Chrome DevTools
     (common when sniffing / debugging)
  ----------------------------- */
  const devtoolsOpen = () => {
    const start = performance.now();
    debugger;
    return performance.now() - start > 100;
  };

  if (devtoolsOpen()) {
    blocked = true;
    reason = "Developer tools detected";
  }

  /* ----------------------------
     3. Try to detect proxy / VPN
     using WebRTC IP check
  ----------------------------- */
  try {
    const ips = await getWebRTCIps();

    // If no local/private IP is found,
    // often means VPN / tunnel only
    const hasPrivateIP = ips.some(ip =>
      ip.startsWith("10.") ||
      ip.startsWith("192.168.") ||
      ip.startsWith("172.")
    );

    if (!hasPrivateIP) {
      blocked = true;
      reason = "Possible VPN / proxy detected";
    }

  } catch (e) {}

  /* ----------------------------
     Block page
  ----------------------------- */
  if (blocked) {
    document.body.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        background:#000;
        color:#fff;
        text-align:center;
        font-family:Arial;
        padding:20px">
        <div>
          <h2>Access blocked</h2>
          <p>Please disable VPN, proxy or network inspection tools.</p>
          <small>${reason}</small>
        </div>
      </div>
    `;
  }
}


/* ----------------------------
   WebRTC IP leak function
----------------------------- */
function getWebRTCIps() {
  return new Promise((resolve, reject) => {

    const ips = new Set();

    const pc = new RTCPeerConnection({
      iceServers: []
    });

    pc.createDataChannel("");

    pc.onicecandidate = e => {
      if (!e.candidate) {
        pc.close();
        resolve([...ips]);
        return;
      }

      const parts = e.candidate.candidate.split(" ");
      const ip = parts[4];
      if (ip) ips.add(ip);
    };

    pc.createOffer()
      .then(o => pc.setLocalDescription(o))
      .catch(reject);
  });
}

blockIfSuspicious();
  </script>
  
<script src="script.js"></script>

  
</body>
</html>
