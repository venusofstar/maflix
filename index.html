<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFLIX Ultimate Player</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
</head>

<body>

<h1 id="appTitle">MAFLIX</h1>

<div id="searchContainer">
  <input type="text" id="searchInput" placeholder="Search channels...">
</div>

<div id="channelSections"></div>

<div id="videoContainer">
  <div id="spinner"></div>
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe>
  <button id="closeBtn">✕</button>
</div>

<script src="script.js"></script>

</body>
</html>
